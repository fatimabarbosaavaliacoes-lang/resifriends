<title>Resifriends 2026 — Módulo 5: Saúde da Criança</title>
<style>
  :root{--marrom:#3D1A00;--marrom2:#5C3A1E;--ouro:#C9A84C;--ouro-claro:#F5E6C8;--branco:#FFFFFF;--cinza:#F4F0E8;--verde:#2E8B57;--vermelho:#C0392B;--texto:#2B2B2B;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',Tahoma,sans-serif;background:var(--cinza);color:var(--texto);min-height:100vh;}
  #tela-inicial{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,var(--marrom) 0%,var(--marrom2) 100%);padding:20px;}
  .logo{text-align:center;margin-bottom:36px;}
  .logo h1{font-size:2.1em;color:var(--ouro);font-weight:900;}
  .logo p{color:var(--ouro-claro);font-size:1em;margin-top:6px;}
  .mod-tag{display:inline-block;background:var(--ouro);color:var(--marrom);padding:4px 16px;border-radius:20px;font-size:.9em;font-weight:700;margin-top:10px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px;max-width:860px;width:100%;}
  .card{background:rgba(255,255,255,.06);border:2px solid rgba(201,168,76,.3);border-radius:14px;padding:20px;cursor:pointer;transition:all .25s;}
  .card:hover{background:rgba(201,168,76,.12);border-color:var(--ouro);transform:translateY(-2px);}
  .card .em{font-size:2em;margin-bottom:8px;display:block;}
  .card h3{color:var(--ouro);font-size:1.05em;margin-bottom:4px;}
  .card p{color:var(--ouro-claro);font-size:.84em;}
  #tela-senha{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,var(--marrom) 0%,var(--marrom2) 100%);padding:20px;}
  .sb{background:rgba(255,255,255,.07);border:2px solid rgba(201,168,76,.4);border-radius:18px;padding:36px;max-width:420px;width:100%;text-align:center;}
  .sb h2{color:var(--ouro);font-size:1.4em;margin-bottom:6px;}
  .sb p{color:var(--ouro-claro);font-size:.9em;margin-bottom:22px;}
  .sb input{width:100%;padding:13px 16px;border-radius:10px;border:2px solid rgba(201,168,76,.4);background:rgba(255,255,255,.08);color:#fff;font-size:1em;text-align:center;letter-spacing:2px;outline:none;margin-bottom:8px;}
  .sb input:focus{border-color:var(--ouro);}
  .err{color:#FF6B6B;font-size:.87em;height:18px;margin-bottom:8px;}
  .btn{padding:12px 26px;border-radius:10px;border:none;cursor:pointer;font-size:.95em;font-weight:700;transition:all .2s;}
  .btn-o{background:var(--ouro);color:var(--marrom);width:100%;margin-top:8px;}
  .btn-o:hover{background:#d4aa4f;}
  .btn-v{background:transparent;color:var(--ouro-claro);border:1px solid rgba(201,168,76,.3);font-size:.83em;padding:7px 16px;margin-top:14px;}
  .btn-v:hover{color:var(--ouro);border-color:var(--ouro);}
  #tela-sim{display:none;max-width:860px;margin:0 auto;padding:18px;padding-bottom:80px;}
  .hdr{background:var(--marrom);border-radius:14px;padding:16px 22px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .hdr h2{color:var(--ouro);font-size:1.1em;}
  .hdr .inf{color:var(--ouro-claro);font-size:.83em;margin-top:3px;}
  .badge{background:var(--ouro);color:var(--marrom);border-radius:8px;padding:5px 13px;font-weight:700;font-size:.86em;}
  .prog{height:5px;background:rgba(201,168,76,.2);border-radius:3px;margin-bottom:18px;overflow:hidden;}
  .prog-f{height:100%;background:var(--ouro);border-radius:3px;transition:width .3s;}
  .qc{background:#fff;border-radius:14px;padding:26px;margin-bottom:18px;box-shadow:0 2px 10px rgba(0,0,0,.07);}
  .qn{display:inline-block;background:var(--marrom);color:var(--ouro);border-radius:7px;padding:2px 11px;font-size:.78em;font-weight:700;margin-bottom:13px;}
  .en{font-size:.96em;line-height:1.65;color:var(--texto);margin-bottom:18px;font-weight:500;}
  .ab{display:flex;align-items:flex-start;gap:11px;background:var(--cinza);border:2px solid #DDD;border-radius:10px;padding:12px 15px;margin-bottom:7px;cursor:pointer;text-align:left;transition:all .2s;width:100%;font-size:.92em;line-height:1.5;}
  .ab:hover:not(:disabled){border-color:var(--marrom);background:#EDE8DC;}
  .ab:disabled{cursor:default;}
  .al{font-weight:800;color:var(--marrom);min-width:21px;}
  .ab.cor{background:#E6F4EA;border-color:var(--verde);}
  .ab.cor .al{color:var(--verde);}
  .ab.err2{background:#FDEDED;border-color:var(--vermelho);}
  .ab.err2 .al{color:var(--vermelho);}
  .ab.nc{background:#E6F4EA;border-color:var(--verde);border-style:dashed;}
  .com{background:#F0F7FF;border-left:4px solid var(--marrom);border-radius:0 10px 10px 0;padding:13px 15px;margin-top:13px;font-size:.87em;line-height:1.6;color:#333;display:none;}
  .com .lb{font-weight:700;color:var(--marrom);margin-bottom:5px;display:block;}
  #tela-res{display:none;max-width:680px;margin:0 auto;padding:28px 18px;text-align:center;}
  .rb{background:var(--marrom);border-radius:18px;padding:36px;margin-bottom:22px;}
  .rb h2{color:var(--ouro);font-size:1.7em;margin-bottom:7px;}
  .rb .pl{font-size:3.8em;color:var(--ouro);font-weight:900;margin:14px 0;}
  .rb .sub{color:var(--ouro-claro);font-size:.97em;}
  .rb .cod{background:rgba(255,255,255,.1);border:2px solid var(--ouro);border-radius:10px;padding:11px 18px;font-family:monospace;font-size:1.05em;color:var(--ouro);margin:18px 0;letter-spacing:2px;}
  .bw{background:#25D366;color:#fff;border:none;padding:13px 22px;border-radius:10px;font-size:.97em;font-weight:700;cursor:pointer;display:block;width:100%;margin-bottom:9px;}
  .br2{background:var(--ouro);color:var(--marrom);border:none;padding:13px 22px;border-radius:10px;font-size:.97em;font-weight:700;cursor:pointer;display:block;width:100%;margin-bottom:9px;}
  .bg{background:transparent;color:var(--marrom);border:2px solid var(--marrom);padding:12px 22px;border-radius:10px;font-size:.97em;font-weight:700;cursor:pointer;display:block;width:100%;margin-bottom:9px;}
  .bvm{background:transparent;color:#777;border:2px solid #CCC;padding:12px 22px;border-radius:10px;font-size:.97em;font-weight:700;cursor:pointer;display:block;width:100%;margin-top:8px;}
  .lim{background:#FFF3CD;border:2px solid #FFC107;border-radius:12px;padding:15px;margin-bottom:18px;font-size:.88em;color:#856404;display:none;}
  @media print{.np{display:none!important}body{background:#fff}.qc{break-inside:avoid;box-shadow:none;border:1px solid #DDD}.com{display:block!important}}
  @media(max-width:600px){.grid{grid-template-columns:1fr}.logo h1{font-size:1.55em}.hdr{flex-direction:column;gap:8px}}
</style>

<script>
const TEMAS=[{"id":"recem_nascido","nome":"Assistência ao Recém-Nascido","senha":"rn@mod5","emoji":"👶","questoes":[{"enunciado":"De acordo com o Programa de Reanimação Neonatal da Sociedade Brasileira de Pediatria (SBP 2021/2024), ao nascer um recém-nascido a termo, com boa vitalidade (choro vigoroso, tônus muscular em flexão, frequência cardíaca > 100 bpm), qual é a conduta imediata correta?","alternativas":["A) Aspirar vias aéreas com sonda e levar ao berço aquecido imediatamente","B) Realizar contato pele a pele com a mãe, clampar o cordão oportunamente (mínimo 1-3 minutos), secar e estimular — não separar do binômio mãe-filho","C) Administrar vitamina K IM antes do contato pele a pele","D) Levar imediatamente à incubadora para observação das primeiras horas","E) Aspirar boca e narinas antes de qualquer outro procedimento"],"correta":1,"comentario":"O RN a termo com boa vitalidade (respiração/choro presente, tônus em flexão, FC > 100 bpm) NÃO deve ser separado da mãe. A SBP 2021/2024 preconiza: contato pele a pele imediato, clampeamento oportuno do cordão umbilical (mínimo 1-3 minutos ou após parar de pulsar), secagem e estimulação sobre o abdome/tórax materno. A aspiração de rotina das vias aéreas em RN vigoroso não é mais recomendada (aumenta risco de bradicardia por estimulação vagal). A vitamina K é administrada após a estabilização inicial."},{"enunciado":"Um recém-nascido nasce com 38 semanas, choro fraco, tônus muscular diminuído e FC = 80 bpm. Após o clampeamento do cordão e posicionamento, o enfermeiro inicia os passos iniciais da reanimação. Após 30 segundos de secagem e estimulação, o RN mantém FC < 100 bpm e respiração irregular. Qual é a próxima conduta?","alternativas":["A) Iniciar compressões torácicas imediatamente","B) Iniciar ventilação com pressão positiva (VPP) com balão e máscara, com O2 a 21% (ar ambiente), avaliando FC após 30 segundos","C) Administrar adrenalina por via umbilical","D) Aspirar vias aéreas com sonda calibrosa e aguardar mais 30 segundos","E) Intubar imediatamente e iniciar ventilação mecânica"],"correta":1,"comentario":"Após os passos iniciais (posicionar, secar, estimular — 30 segundos), se o RN mantém FC < 100 bpm e/ou respiração ausente/irregular/apneia, a VPP deve ser iniciada IMEDIATAMENTE. A SBP 2021/2024 recomenda iniciar a VPP com AR AMBIENTE (FiO2 21%) para RN ≥ 34 semanas, utilizando balão autoinflável e máscara. A frequência é de 40-60 ventilações/min. A oximetria e monitor cardíaco devem ser posicionados durante a VPP. A intubação é reservada para falha da VPP ou mecônio com RN deprimido. Compressões torácicas: FC < 60 após 30s de VPP eficaz."},{"enunciado":"Sobre o Índice de Apgar, qual afirmação está CORRETA?","alternativas":["A) O Apgar avalia 5 parâmetros: frequência cardíaca, esforço respiratório, tônus muscular, irritabilidade reflexa e cor — sendo 0, 1 ou 2 pontos para cada","B) Um Apgar de 7-10 no 1º minuto indica necessidade imediata de reanimação avançada","C) O Apgar do 5º minuto é mais importante para avaliar a necessidade de reanimação imediata que o do 1º minuto","D) O Apgar não deve ser utilizado para guiar a reanimação — a avaliação clínica em tempo real é o que direciona as condutas","E) Apgar < 4 no 1º minuto sempre indica encefalopatia hipóxico-isquêmica"],"correta":0,"comentario":"O Índice de Apgar avalia 5 parâmetros com pontuação 0, 1 ou 2 cada: (1) FREQUÊNCIA CARDÍACA (0=ausente, 1<100, 2≥100); (2) ESFORÇO RESPIRATÓRIO (0=ausente, 1=irregular/fraco, 2=choro vigoroso); (3) TÔNUS MUSCULAR (0=flácido, 1=alguma flexão, 2=boa flexão/movimentos ativos); (4) IRRITABILIDADE REFLEXA (0=sem resposta, 1=careta, 2=choro/tosse/espirro); (5) COR (0=cianose/palidez, 1=corpo róseo/extremidades cianóticas, 2=róseo). Total 0-10. IMPORTANTE: o Apgar NÃO é usado para guiar a reanimação (a avaliação em tempo real direciona as condutas); é usado para documentar a condição do RN e a resposta à reanimação."},{"enunciado":"O enfermeiro realiza os cuidados imediatos ao recém-nascido na sala de parto. Sobre a administração de vitamina K no RN, qual afirmação está CORRETA?","alternativas":["A) A vitamina K oral é a via de escolha pelo MS por ser mais segura e eficaz que a IM","B) A vitamina K1 (fitomenadiona) 1 mg IM deve ser administrada a todos os RN nas primeiras horas de vida para prevenção da doença hemorrágica do recém-nascido","C) A vitamina K só é indicada para RN prematuros ou filhos de mães que usaram anticoagulantes","D) A administração de vitamina K deve aguardar o resultado do coagulograma do RN","E) A vitamina K EV é a via de escolha para RN a termo com bom peso"],"correta":1,"comentario":"A VITAMINA K1 (fitomenadiona/filoquinona) 1 mg por via INTRAMUSCULAR (face lateral da coxa) deve ser administrada a TODOS os RN nas primeiras horas de vida (geralmente na 1ª hora, após estabilização e contato pele a pele). Prevenção da Doença Hemorrágica do Recém-Nascido (DHRN) por deficiência de vitamina K — os fatores de coagulação dependentes de vitamina K (II, VII, IX, X) são fisiologicamente baixos nos primeiros dias de vida. A via IM é superior à oral na prevenção da DHRN tardia. O MS brasileiro recomenda a via IM para todos os RN. Não aguardar exames — é profilaxia universal."},{"enunciado":"Sobre a triagem neonatal (Teste do Pezinho) no Brasil, qual afirmação está CORRETA segundo o Programa Nacional de Triagem Neonatal (PNTN) atual?","alternativas":["A) O teste deve ser realizado idealmente entre 3-5 dias de vida (48-72h após início da amamentação) e rastreia apenas PKU e hipotireoidismo congênito","B) O teste deve ser coletado entre o 3º e 5º dia de vida (mínimo 48h após nascimento); o PNTN ampliado rastreia atualmente mais de 50 doenças incluindo hemoglobinopatias, fibrose cística, hiperplasia adrenal congênita, deficiências de biotinidase e G6PD","C) O teste do pezinho pode ser realizado no 1º dia de vida para garantir resultado antes da alta hospitalar","D) O exame é obrigatório apenas para RN prematuros e de baixo peso","E) Resultado alterado do teste do pezinho confirma diagnóstico — não é necessária confirmação"],"correta":1,"comentario":"O TESTE DO PEZINHO (Triagem Neonatal) deve ser coletado entre o 3º e 5º dia de vida (MÍNIMO 48h após início da amamentação — para evitar falsos negativos na PKU e hipotireoidismo). O PNTN ampliado (Portaria MS 3.535/2020) rastreia: fenilcetonúria (PKU), hipotireoidismo congênito, hemoglobinopatias (anemia falciforme), fibrose cística, hiperplasia adrenal congênita (HAC), deficiência de biotinidase, deficiência de G6PD, toxoplasmose congênita — e outros estados têm ampliações próprias. O resultado ALTERADO é uma SUSPEITA — exige confirmação diagnóstica antes do tratamento. É obrigatório para TODOS os RN."},{"enunciado":"Um RN com 36 horas de vida apresenta icterícia visível até o abdome, com bilirrubina total (BT) de 14 mg/dL. A mãe tem tipo sanguíneo O+ e o RN é A+. Qual é a conduta mais adequada?","alternativas":["A) Tranquilizar a mãe — icterícia neonatal precoce é sempre fisiológica e resolve sem tratamento","B) Avaliar pelo nomograma de Bhutani (hora-específico), investigar incompatibilidade ABO (Coombs direto, hemograma), e definir conduta (fototerapia ou exsanguíneotransfusão) conforme o nível e os fatores de risco","C) Iniciar imediatamente exsanguíneotransfusão sem avaliação adicional","D) Suspender o aleitamento materno por 48 horas para reduzir a bilirrubina","E) Repetir a bilirrubina apenas após 72 horas de vida"],"correta":1,"comentario":"Icterícia em RN com 36h + BT 14 mg/dL + mãe O+ e RN A+ (risco de incompatibilidade ABO) = necessita avaliação! Investigação: (1) Coombs direto (detecta anticorpos maternos anti-A/anti-B no RN); (2) hemograma + reticulócitos (hemólise); (3) NOMOGRAMA DE BHUTANI (classifica risco pelo nível de bilirrubina × horas de vida). A FOTOTERAPIA é indicada conforme o nomograma e os fatores de risco (prematuridade, hemólise, etc.). A incompatibilidade ABO é a causa mais comum de doença hemolítica neonatal no Brasil. Suspender aleitamento materno raramente é indicado — só na icterícia do leite materno tardia e após descartada outras causas."},{"enunciado":"Sobre o cuidado com o coto umbilical do recém-nascido, qual recomendação está CORRETA segundo o Ministério da Saúde e a OMS?","alternativas":["A) Aplicar álcool 70% no coto umbilical 3 vezes ao dia para acelerar a queda e prevenir infecção","B) Manter o coto umbilical seco e limpo (cuidado seco), sem aplicação de substâncias; em contextos de alto risco de infecção, a clorexidina 4% pode ser usada","C) Aplicar álcool iodado no coto para cauterização e queda mais rápida","D) Cobrir o coto umbilical com curativo oclusivo para proteção","E) Mergulhar o coto em solução de permanganato de potássio diariamente"],"correta":1,"comentario":"A OMS e o MS recomendam o CUIDADO SECO (dry cord care) do coto umbilical: manter limpo e seco, SEM aplicação de álcool, antissépticos ou substâncias de rotina. O álcool 70%, embora amplamente usado no passado, prolonga o tempo de queda do coto e não tem benefício comprovado sobre a prevenção de onfalite em países de alta renda. O coto deve cair naturalmente em 7-15 dias. Em contextos de alta mortalidade neonatal por infecção (países de baixa renda), a OMS recomenda aplicação de clorexidina aquosa 7,1% (clorexidina 4% base) nos primeiros 3 dias de vida. Sinais de onfalite: eritema periumbilical, secreção purulenta, odor fétido — notificar imediatamente."},{"enunciado":"Sobre a Triagem Neonatal Auditiva (Teste da Orelhinha), qual afirmação está CORRETA?","alternativas":["A) Deve ser realizado após 6 meses de vida para garantir maturidade auditiva","B) Deve ser realizado antes da alta hospitalar (idealmente nas primeiras 24-48h) por Emissões Otoacústicas Evocadas (EOA); RN com fatores de risco para perda auditiva devem realizar também o Potencial Evocado Auditivo de Tronco Encefálico (PEATE/BERA)","C) O exame é obrigatório apenas para RN prematuros < 34 semanas","D) Resultado 'falhou' no teste da orelhinha confirma surdez — encaminhar imediatamente para implante coclear","E) O exame deve ser realizado apenas em maternidades de nível terciário"],"correta":1,"comentario":"Triagem Auditiva Neonatal Universal (TANU) — Lei 12.303/2010: OBRIGATÓRIA para todos os RN antes da alta hospitalar, idealmente nas primeiras 24-48h de vida. Método: EOA (Emissões Otoacústicas Evocadas) — triagem de 1ª etapa para RN sem fatores de risco. RN com FATORES DE RISCO para perda auditiva (prematuridade, uso de aminoglicosídeos, TORCH, asfixia, hiperbilirrubinemia grave, malformações, história familiar) devem realizar EOA + PEATE (BERA). 'FALHOU' = nova avaliação em 30 dias. Falha em 2 testes = encaminhar para avaliação audiológica completa. NÃO é diagnóstico — é triagem."},{"enunciado":"O enfermeiro acompanha um RN prematuro de 30 semanas em UTIN. Quais cuidados do Método Canguru são indicados nessa fase?","alternativas":["A) O Método Canguru só pode ser iniciado após 36 semanas de idade corrigida","B) O Método Canguru (posição canguru — RN em contato pele a pele vertical no tórax dos pais) pode ser iniciado ainda na UTIN quando o RN está clinicamente estável, mesmo em uso de suporte respiratório não invasivo, com benefícios comprovados para termorregulação, ganho de peso, vínculo e aleitamento materno","C) A posição canguru está contraindicada em RN com cateter venoso central","D) O Método Canguru só beneficia RN acima de 33 semanas e peso > 1500g","E) Durante a posição canguru, o monitoramento dos sinais vitais deve ser suspenso para não estressar o bebê"],"correta":1,"comentario":"O MÉTODO CANGURU é uma política do MS (Portaria 693/2000, revisada pela Portaria 371/2014) indicado para RN de baixo peso (< 2500g) e prematuros. A POSIÇÃO CANGURU pode ser iniciada na UTIN (1ª etapa) assim que o RN estiver clinicamente ESTÁVEL — mesmo em CPAP nasal, CPAP de alto fluxo e com cateter venoso, desde que a equipe esteja treinada. Benefícios: termorregulação, estabilidade cardiorrespiratória, ganho de peso, redução da dor, promoção do vínculo, estímulo ao aleitamento materno. 2ª etapa: enfermaria canguru. 3ª etapa: domicílio com acompanhamento ambulatorial."},{"enunciado":"Sobre a Síndrome de Abstinência Neonatal (SAN), qual afirmação está CORRETA?","alternativas":["A) A SAN ocorre exclusivamente em filhos de mães usuárias de heroína","B) A SAN pode ocorrer em RN expostos intraútero a opioides (incluindo metadona e tramadol), benzodiazepínicos, álcool, cocaína e antidepressivos; manifesta-se por irritabilidade, tremores, hipertonia, choro agudo, convulsões, dificuldade alimentar e febre — avaliada pela Escala de Finnegan","C) Os sintomas da SAN sempre aparecem nas primeiras 2 horas após o nascimento","D) O tratamento da SAN é exclusivamente farmacológico — cuidados não farmacológicos não têm evidência","E) RN com SAN devem ser separados da mãe para observação exclusiva na UTIN"],"correta":1,"comentario":"A SAN (Neonatal Abstinence Syndrome) ocorre por dependência fetal a substâncias usadas pela mãe durante a gestação. Causas: opioides (morfina, codeína, tramadol, metadona — mais comuns e mais graves), benzodiazepínicos, ISRS, álcool. Início dos sintomas: opioides de curta ação (heroína) = 24-48h; metadona = 48-72h; benzodiazepínicos = dias a semanas. Avaliação: ESCALA DE FINNEGAN (21 itens; escore ≥ 8 indica tratamento farmacológico). Tratamento NÃO farmacológico (primeira linha): minimizar estímulos, swaddling (enfaixamento), contato pele a pele, aleitamento materno, nutrição adequada. Farmacológico: morfina oral ou metadona (opioides maternos) ou fenobarbital."},{"enunciado":"Um RN de 2 dias de vida apresenta temperatura axilar de 36,0°C, letargia, recusa alimentar e abaulamento da fontanela. O enfermeiro deve suspeitar de qual condição e qual é a conduta imediata?","alternativas":["A) Hipoglicemia neonatal — administrar glicose oral imediatamente","B) Sepse neonatal / Meningite bacteriana — comunicar ao médico IMEDIATAMENTE, preparar para coleta de culturas (hemoculturas, LCR) e início de antibioticoterapia empírica urgente","C) Icterícia neonatal grave — preparar para fototerapia de alta intensidade","D) Síndrome de abstinência neonatal — iniciar protocolo de Finnegan","E) Refluxo gastroesofágico — posicionar em prona e elevar cabeceira"],"correta":1,"comentario":"Letargia + recusa alimentar + abaulamento de fontanela + hipotermia (ou febre) em RN de 2 dias = SEPSE NEONATAL PRECOCE com possível MENINGITE BACTERIANA — emergência! Sinais de alarme neonatais: gemência, hipotermia ou febre, letargia, recusa alimentar, apneia, bradicardia, abaulamento de fontanela, convulsões, icterícia precoce/grave. O abaulamento de fontanela indica aumento da pressão intracraniana — sinal de meningite. Conduta: comunicar IMEDIATAMENTE ao médico, coletar hemoculturas, iniciar antibioticoterapia EV URGENTE (ampicilina + gentamicina ou ampicilina + cefotaxima), coletar LCR se estável. NÃO aguardar resultados para iniciar antibiótico."},{"enunciado":"Sobre a Doença da Membrana Hialina (DMH/SDRA neonatal) em prematuros, qual afirmação está CORRETA?","alternativas":["A) A DMH ocorre por excesso de surfactante pulmonar nos prematuros","B) A DMH é causada pela deficiência de surfactante pulmonar (produzido pelos pneumócitos tipo II a partir de ~24 semanas, com maturidade em ~35 semanas); tratamento: surfactante exógeno intratraqueal + suporte respiratório (CPAP ou VMI)","C) O corticosteroide antenatal (betametasona) é contraindicado por aumentar o risco de DMH","D) A DMH acomete exclusivamente prematuros < 28 semanas","E) O surfactante exógeno deve ser administrado por via oral em prematuros"],"correta":1,"comentario":"A DMH é a principal causa de insuficiência respiratória neonatal em prematuros. Fisiopatologia: deficiência de SURFACTANTE PULMONAR (fosfolipídeos produzidos pelos pneumócitos tipo II) → colapso alveolar progressivo → atelectasia, hipoxemia e hipercapnia. Prevenção: CORTICOSTEROIDE ANTENATAL (betametasona 12 mg IM 24/24h, 2 doses) para gestantes entre 24-34 semanas com risco de parto prematuro → acelera a maturidade pulmonar e reduz DMH em 50%. Tratamento: SURFACTANTE EXÓGENO intratraqueal (beractanto, poractanto) + CPAP nasal (INSURE: INtubação, SURfactante, Extubação para CPAP) ou VMI se necessário."},{"enunciado":"Sobre a Enterocolite Necrosante (ECN) em recém-nascidos prematuros, qual conjunto de fatores de risco e sinais de alerta está CORRETO?","alternativas":["A) ECN acomete exclusivamente RN a termo com malformações gastrointestinais","B) Fatores de risco: prematuridade (principal), baixo peso, alimentação com fórmula artificial, asfixia, policitemia; sinais de alerta: distensão abdominal, resíduo gástrico bilioso, sangue nas fezes, letargia e instabilidade hemodinâmica","C) A ECN é prevenida pelo uso profilático de antibióticos de amplo espectro desde o nascimento","D) O aleitamento materno aumenta o risco de ECN em prematuros","E) A ECN não tem morbimortalidade significativa em prematuros tardios"],"correta":1,"comentario":"A ECN é a emergência gastrointestinal mais comum e grave em prematuros. Fatores de risco: PREMATURIDADE (principal — risco inversamente proporcional à IG), FÓRMULA ARTIFICIAL (o leite materno tem fator protetor comprovado), asfixia perinatal, policitemia, hipotensão, cateter umbilical. Sinais: distensão abdominal progressiva, resíduo gástrico bilioso, sangue nas fezes, paresia intestinal, instabilidade hemodinâmica, acidose. Diagnóstico: RX abdome (pneumatose intestinal é patognomônica; pneumoperitônio = perfuração). Estadiamento de Bell. Tratamento: jejum, descompressão gástrica, ATB EV, cirurgia se perfuração. PREVENÇÃO: leite humano pasteurizado, probióticos (evidência crescente), corticosteroide antenatal."},{"enunciado":"O enfermeiro cuida de um RN com diagnóstico de Hipoglicemia Neonatal. Qual é o valor de glicemia que define hipoglicemia no RN e qual é a conduta inicial?","alternativas":["A) Glicemia < 50 mg/dL nas primeiras 24h; conduta: jejum e hidratação EV com solução salina","B) Glicemia < 45-50 mg/dL (ou < 40 mg/dL nas primeiras horas); se RN sintomático ou glicemia < 25 mg/dL: infusão EV de glicose; se assintomático e glicemia entre 25-45: oferecer aleitamento materno ou fórmula e repetir glicemia em 30-60 min","C) Glicemia < 70 mg/dL em qualquer momento — mesmo valor do adulto","D) Hipoglicemia neonatal sempre requer internação em UTI independentemente dos sintomas","E) Administrar glicose oral concentrada (mel) ao RN hipoglicêmico"],"correta":1,"comentario":"Hipoglicemia Neonatal: glicemia < 45-50 mg/dL (há variação entre guidelines). Grupos de risco: filhos de mãe diabética (FMD), GIG, PIG, prematuros, pós-asfixia. Conduta (SBP): RN SINTOMÁTICO ou glicemia < 25 mg/dL: GLICOSE EV (bolus 200 mg/kg = 2mL/kg de glicose 10% + manutenção). RN ASSINTOMÁTICO com glicemia 25-45 mg/dL: ALEITAMENTO MATERNO ou fórmula + controle em 30-60 min. NUNCA MEL em < 1 ano (risco de botulismo). Sintomas: tremores, hipotonia, letargia, cianose, apneia, convulsões. Monitorar glicemia nas primeiras 24h nos grupos de risco."},{"enunciado":"Sobre os reflexos primitivos do recém-nascido, qual afirmação está CORRETA?","alternativas":["A) O reflexo de Moro persiste normalmente até os 3 anos de idade","B) Os reflexos primitivos (Moro, preensão palmar, sucção, busca, marcha automática, Babinski) estão presentes ao nascimento e desaparecem progressivamente nos primeiros meses; a persistência além do esperado pode indicar lesão neurológica","C) A ausência do reflexo de preensão palmar ao nascimento é normal","D) O reflexo de Babinski (extensão do hálux à estimulação plantar) é patológico no RN","E) Os reflexos primitivos são avaliados apenas em prematuros suspeitos de lesão neurológica"],"correta":1,"comentario":"Os REFLEXOS PRIMITIVOS (arcaicos) são respostas automáticas do SNC imaturo, presentes ao nascimento e que desaparecem progressivamente: MORO (abraço ao estímulo brusco): presente até 4-6 meses; PREENSÃO PALMAR: desaparece aos 3-4 meses; BUSCA (roothing): desaparece aos 3-4 meses; SUCÇÃO: aos 4 meses (voluntária persiste); MARCHA AUTOMÁTICA: desaparece às 6-8 semanas; BABINSKI (extensão do hálux): NORMAL no RN e lactente até 12-18 meses (SNC imaturo). A AUSÊNCIA de reflexos ao nascimento indica lesão neurológica; a PERSISTÊNCIA além do esperado também indica comprometimento neurológico (ex: PC). O Babinski patológico só a partir dos 2 anos."},{"enunciado":"A Unidade de Terapia Intensiva Neonatal (UTIN) recebe um RN com 28 semanas de IG e 1000g. Sobre os cuidados centrados no desenvolvimento (CCD) para esse RN, qual afirmação está CORRETA?","alternativas":["A) Estímulos luminosos intensos são benéficos para o desenvolvimento visual do prematuro na UTIN","B) Os CCD incluem: controle da luminosidade e ruído, posicionamento em ninho (flexão), manipulação mínima agrupando procedimentos, controle da dor, contato pele a pele precoce, envolvimento familiar e estímulo ao aleitamento materno — baseados no modelo NIDCAP","C) A dor em prematuros não causa sequelas neurológicas — o SNC imaturo não processa dor adequadamente","D) O posicionamento em extensão é preferível no prematuro para evitar contraturas","E) Os familiares devem ser afastados da UTIN para reduzir o risco de infecção"],"correta":1,"comentario":"Os CUIDADOS CENTRADOS NO DESENVOLVIMENTO (CCD) são baseados no modelo NIDCAP (Neonatal Individualized Developmental Care and Assessment Program) e visam minimizar o estresse do prematuro e otimizar o neurodesenvolvimento: (1) CONTROLE AMBIENTAL: reduzir luz (cobrir incubadora), ruído < 45-50 dB; (2) POSICIONAMENTO EM NINHO (flexão fisiológica); (3) MANIPULAÇÃO MÍNIMA: agrupar procedimentos, evitar acordar desnecessariamente; (4) CONTROLE DA DOR (escala NIPS, sacarose oral, sucção não nutritiva); (5) CONTATO PELE A PELE (Método Canguru); (6) ENVOLVIMENTO E EMPODERAMENTO DA FAMÍLIA; (7) ESTÍMULO AO ALEITAMENTO MATERNO. Luz intensa e ruído aumentam o consumo de O2 e estressam o prematuro."},{"enunciado":"Sobre a fototerapia no tratamento da hiperbilirrubinemia neonatal, qual afirmação está CORRETA?","alternativas":["A) Durante a fototerapia, o RN deve ser alimentado apenas por SNE para reduzir a interrupção do tratamento","B) Durante a fototerapia: manter olhos protegidos com máscara (prevenir lesão retiniana), expor máxima superfície corporal, manter hidratação adequada, monitorar temperatura, não interromper o aleitamento materno — amamentar fora da fototerapia a cada 2-3h","C) A fototerapia pode ser realizada com qualquer fonte de luz artificial disponível na maternidade","D) A eficácia da fototerapia não depende da distância entre a fonte luminosa e o RN","E) Durante a fototerapia, o RN deve ficar em posição prona exclusivamente"],"correta":1,"comentario":"FOTOTERAPIA: tratamento da hiperbilirrubinemia indireta — luz azul/verde (430-490nm) converte bilirrubina lipossolúvel em fotoisômeros hidrossolúveis excretados sem conjugação. Cuidados essenciais: (1) PROTEÇÃO OCULAR com máscara opaca (evitar retinopatia); (2) EXPOSIÇÃO MÁXIMA da superfície corporal (trocar decúbito periodicamente); (3) HIDRATAÇÃO adequada (perda insensível aumentada); (4) MONITORAR temperatura (risco de hipertermia); (5) MANTER AMAMENTAÇÃO — interromper apenas para mamar (a cada 2-3h); (6) DISTÂNCIA adequada da fonte (seguir fabricante — fototerapia de alta intensidade: LEDs mais próximos); (7) Monitorar bilirrubina conforme protocolo."},{"enunciado":"O enfermeiro realiza visita domiciliar a uma puérpera com RN de 7 dias. A mãe relata que o bebê chora muito, mama frequentemente e ela está com os mamilos dolorosos. Como o enfermeiro deve avaliar a pega do aleitamento?","alternativas":["A) Orientar suplementação com fórmula — o choro indica leite insuficiente","B) Avaliar a pega: boca bem aberta, lábio inferior evertido, queixo tocando a mama, maior parte da aréola visível acima da boca do bebê; mamilos dolorosos geralmente indicam pega incorreta — corrigir a pega e apoiar a mãe","C) Indicar uso de bico de silicone para proteger os mamilos dolorosos durante todas as mamadas","D) Suspender o aleitamento por 48h para recuperação dos mamilos","E) O choro excessivo indica cólica — indicar chá de erva-doce"],"correta":1,"comentario":"Dor no mamilo durante a amamentação + choro frequente do RN + mamadas longas e frequentes = PEGA INCORRETA (causa mais comum). PEGA ADEQUADA (OMS): (1) boca BEM ABERTA; (2) LÁBIO INFERIOR evertido (voltado para fora); (3) QUEIXO tocando ou quase tocando a mama; (4) MAIOR PARTE DA ARÉOLA visível ACIMA da boca (mais aréola abaixo do lábio inferior). O bebê mama a aréola, NÃO o mamilo — pega incorreta causa fissura e dor. Bico de silicone: não recomendado de rotina (reduz estímulo de produção de leite, dificulta pega). Chá: contraindicado < 6 meses. O enfermeiro deve corrigir a pega e fortalecer o suporte à amamentação."},{"enunciado":"Sobre a Triagem Neonatal para Cardiopatias Congênitas Críticas (Teste do Coraçãozinho/Oximetria de Pulso), qual afirmação está CORRETA?","alternativas":["A) O exame deve ser realizado imediatamente após o nascimento, ainda na sala de parto","B) A oximetria de pulso deve ser realizada entre 24-48h de vida (ou antes da alta se > 24h); mede SpO2 em mão direita e em um dos pés — resultado normal: SpO2 ≥ 95% em ambos e diferença ≤ 3%","C) O exame é indicado apenas para RN com suspeita clínica de cardiopatia","D) SpO2 de 92% na mão direita e 91% no pé é considerado resultado normal","E) O exame substitui o ecocardiograma para diagnóstico definitivo de cardiopatia"],"correta":1,"comentario":"TESTE DO CORAÇÃOZINHO (Triagem Neonatal de Cardiopatia Congênita Crítica — Portaria MS 20/2014, Lei 13.631/2018): OXIMETRIA DE PULSO nas primeiras 24-48h (mínimo 24h de vida — após fechamento fisiológico do canal arterial). Realizado em 2 sítios: MÃO DIREITA (pré-ductal) e UM PÉ (pós-ductal). Resultado NORMAL: SpO2 ≥ 95% nos dois sítios E diferença ≤ 3% entre eles. Resultado ALTERADO (repetir em 1h): SpO2 < 95% em qualquer sítio OU diferença > 3%. Duas medidas alteradas = encaminhar para ecocardiograma. Rastreia cardiopatias que dependem de canal arterial patente: TGA, DATVP, coarctação, tetralogia de Fallot grave."},{"enunciado":"Sobre a enterocolite necrosante (ECN) e o papel do leite humano em sua prevenção, qual evidência é mais robusta?","alternativas":["A) O leite de fórmula especial para prematuros oferece maior proteção contra ECN que o leite humano","B) O leite humano pasteurizado (banco de leite humano) e especialmente o leite materno exclusivo reduzem significativamente o risco de ECN em prematuros — o leite materno contém IgA secretória, lactoferrina, lisozima e fatores de crescimento intestinal protetores","C) O leite materno só tem efeito protetor contra ECN se o prematuro tiver > 32 semanas","D) Probióticos têm efeito equivalente ao leite humano na prevenção de ECN","E) A pasteurização elimina todos os fatores de proteção do leite humano contra ECN"],"correta":1,"comentario":"O LEITE HUMANO (materno ou pasteurizado de banco de leite) é o principal fator de proteção contra ECN em prematuros — evidência nível A: reduz risco de ECN em até 77% comparado à fórmula. Componentes protetores: IgA secretória, lactoferrina (antibacteriana), lisozima, fatores de crescimento intestinal (EGF, TGF-β), oligossacarídeos do leite humano (HMOs — estimulam microbioma saudável), macrófagos e linfócitos. A pasteurização (HTST/Holder) preserva a maioria dos fatores imunológicos. Os BANCOS DE LEITE HUMANO (BLH) do Brasil são referência mundial — a pasteurização inativa patógenos mantendo propriedades nutricionais e imunológicas. Probióticos têm evidência crescente mas são ADJUVANTES, não substitutos."},{"enunciado":"Um RN é encaminhado à sala de parto após diagnóstico pré-natal de mielomeningocele (MMC). Qual cuidado é prioritário imediatamente após o nascimento?","alternativas":["A) Realizar raio-X de coluna antes de qualquer outro procedimento","B) Cobrir a lesão com compressa estéril umedecida com SF 0,9% morno, posicionar o RN em decúbito ventral ou lateral (nunca dorsal sobre a lesão), comunicar neurocirurgia e preparar para cirurgia de fechamento nas primeiras 24-72h","C) Aplicar povidona-iodo sobre a lesão para prevenir infecção","D) Realizar amniotomia e aspiração do LCR pela malformação para reduzir a pressão","E) Aguardar avaliação neurológica completa antes de qualquer intervenção cirúrgica"],"correta":1,"comentario":"Mielomeningocele: malformação do tubo neural com exposição da medula e meninges. Cuidados IMEDIATOS ao nascimento: (1) COBRIR a lesão com compressa ESTÉRIL UMEDECIDA com SF 0,9% morno (evitar ressecamento e contaminação) — NÃO usar povidona (neurotóxico); (2) DECÚBITO VENTRAL ou LATERAL (nunca decúbito dorsal sobre a lesão — causa traumatismo e infecção); (3) comunicar NEUROCIRURGIA para fechamento precoce (nas primeiras 24-72h — reduz risco de infecção e preserva função neurológica); (4) avaliar hidrocefalia (associada em 80% dos casos — avaliar necessidade de derivação); (5) evitar puncionar ou pressionar a lesão. Pré-natal: ácido fólico 400 mcg/dia previne 70% dos casos de DTN."},{"enunciado":"Sobre o rastreamento neonatal do hipotireoidismo congênito pelo Teste do Pezinho, qual afirmação está CORRETA?","alternativas":["A) O hipotireoidismo congênito é raro — afeta 1 em 100.000 RN no Brasil","B) É a endocrinopatia congênita mais comum (1:2.000-3.000 RN); o rastreamento pelo TSH neonatal + T4 permite diagnóstico e tratamento precoce (levotiroxina) antes de 15-30 dias de vida, evitando o cretinismo (retardo mental grave e irreversível)","C) O hipotireoidismo congênito é facilmente identificado clinicamente ao nascimento pela hipotonia e icterícia","D) O tratamento do hipotireoidismo congênito pode aguardar os primeiros 6 meses de vida sem sequelas neurológicas","E) O Teste do Pezinho dosa apenas o T4 livre para rastreamento do hipotireoidismo congênito"],"correta":1,"comentario":"O HIPOTIREOIDISMO CONGÊNITO é a endocrinopatia mais comum triada pelo Teste do Pezinho (1:2.000-3.000 nascidos vivos). É clinicamente SILENCIOSO ao nascimento (poucos sinais: icterícia prolongada, hipotonia, constipação, choro rouco, fontanela ampla — muitas vezes ausentes). Sem tratamento precoce → CRETINISMO (retardo mental grave, nanismo). O rastreamento pelo TSH elevado (e confirmação com T4 livre baixo) permite início do tratamento (LEVOTIROXINA oral) idealmente antes dos 15-30 dias de vida — o resultado neurológico é normal quando tratado precocemente. A janela de oportunidade é a vida do hormônio tireoidiano para o desenvolvimento cerebral nos primeiros meses."},{"enunciado":"Sobre a reanimação neonatal no período neonatal, qual afirmação sobre as compressões torácicas está CORRETA segundo a SBP 2021?","alternativas":["A) As compressões torácicas devem ser iniciadas imediatamente quando a FC < 100 bpm ao nascimento","B) As compressões torácicas são indicadas quando a FC permanece < 60 bpm após 30 segundos de VPP eficaz com O2 a 100%; realizam-se na proporção 3 compressões:1 ventilação (90 compressões e 30 ventilações por minuto), na metade inferior do esterno, com 2 polegares (técnica preferida) ou 2 dedos","C) A relação compressão:ventilação na reanimação neonatal é 15:2 como no adulto","D) As compressões torácicas no RN devem ser realizadas apenas por médicos","E) Na ausência de FC detectável, deve-se aguardar 5 minutos antes de iniciar compressões"],"correta":1,"comentario":"Compressões Torácicas Neonatais (SBP 2021): indicadas quando FC < 60 bpm APÓS 30 segundos de VPP EFICAZ com O2 100% (aumentar FiO2 para 100% quando se inicia compressões). Técnica: DOIS POLEGARES (preferida — mais eficaz e menos fatigante) ou 2 dedos. Local: TERÇO INFERIOR DO ESTERNO. Profundidade: 1/3 do diâmetro anteroposterior do tórax. Proporção: 3:1 (3 compressões : 1 ventilação = 90 compressões + 30 ventilações por minuto = 120 eventos/min). Reavaliar FC após 60s. Se FC persistir < 60 após compressões + VPP: adrenalina IV umbilical (0,01-0,03 mg/kg) — via preferida; se não disponível: adrenalina intratraqueal (0,05-0,1 mg/kg)."},{"enunciado":"Sobre o Alojamento Conjunto (AC) na maternidade, qual afirmação está CORRETA?","alternativas":["A) O alojamento conjunto é contraindicado para RN com necessidade de fototerapia","B) O alojamento conjunto (mãe e RN no mesmo quarto 24h) é obrigatório nas maternidades do SUS (Portaria MS 1.016/1993); favorece o aleitamento materno, vínculo, identificação precoce de problemas, reduz infecção hospitalar e prepara a mãe para o cuidado domiciliar","C) O RN deve permanecer no berçário central durante a noite para descanso materno","D) O alojamento conjunto é indicado apenas para mães primíparas","E) No alojamento conjunto, o RN deve ser alimentado a cada 3 horas exatas"],"correta":1,"comentario":"ALOJAMENTO CONJUNTO (AC): permanência da mãe e do RN no mesmo quarto, nas mesmas instalações, 24 horas por dia — obrigatório nas maternidades SUS (Portaria MS 1.016/1993, IHAC — Iniciativa Hospital Amigo da Criança). Benefícios: (1) favorece ALEITAMENTO MATERNO sob livre demanda (não a cada 3h exatas!); (2) fortalece o VÍNCULO mãe-filho; (3) prepara a mãe para os CUIDADOS domiciliares; (4) identifica precocemente PROBLEMAS neonatais; (5) REDUZ infecção hospitalar (evita cruzamento de patógenos no berçário). Fototerapia pode ser realizada no AC (berço fototerapia). RN em AC recebe cuidados DO ENFERMEIRO E DA MÃE — educação em saúde fundamental."},{"enunciado":"Sobre a vacinação do recém-nascido ainda na maternidade, quais vacinas são administradas e qual é o momento correto?","alternativas":["A) BCG e hepatite B são administradas somente após 1 mês de vida","B) BCG intradérmica (0,1 mL no músculo deltoide direito) e hepatite B (IM na face anterolateral da coxa) devem ser administradas nas primeiras horas/dias de vida ainda na maternidade — o mais precocemente possível após estabilização","C) Apenas a BCG é administrada na maternidade — a hepatite B inicia aos 2 meses","D) A vacina hepatite B pode ser substituída por imunoglobulina em todos os RN","E) A BCG está contraindicada em RN com peso < 2.000g"],"correta":1,"comentario":"Vacinação na MATERNIDADE (PNI/MS 2024): (1) BCG-ID: dose única, intradérmica, inserção do músculo deltoide DIREITO (1/3 médio do braço direito) — administrada nas primeiras 24h de vida (ou o mais precocemente possível durante internação); protege contra formas graves de tuberculose (miliar e meníngea); contraindicada em imunodeprimidos graves e RN < 2kg (aguardar peso ≥ 2kg). (2) HEPATITE B: 1ª dose nas primeiras 12h de vida (idealmente nas primeiras horas) — IM na face anterolateral da coxa. Filhos de mãe HBsAg positivo: hepatite B + imunoglobulina anti-HBs (IGHAHB) nas primeiras 12h em sítios diferentes. O esquema completo (4 doses ou 3 com vacina combinada) continua no calendário regular."},{"enunciado":"Sobre o Banco de Leite Humano (BLH) e as características do leite humano pasteurizado para prematuros, qual afirmação está CORRETA?","alternativas":["A) O leite pasteurizado do BLH tem as mesmas características nutricionais e imunológicas do leite materno fresco","B) O leite pasteurizado do BLH (pasteurização Holder: 62,5°C por 30 min) elimina patógenos virais (incluindo HIV e HTLV) e bacterianos, preservando a maioria das propriedades imunológicas e nutricionais — é a segunda melhor opção após o leite da própria mãe para prematuros","C) O leite de BLH pode ser administrado a prematuros sem necessidade de triagem sorológica das doadoras","D) O leite do BLH é contraindicado para prematuros < 32 semanas por risco de ECN","E) A pasteurização elimina completamente as IgAs do leite humano"],"correta":1,"comentario":"Os BANCOS DE LEITE HUMANO (BLH) brasileiros são referência mundial — maior rede de BLH do mundo. Pasteurização HOLDER (62,5°C/30 min): inativa 100% do HIV, HTLV, CMV e bactérias; preserva: IgA secretória (70-80%), lactoferrina (alguns estudos mostram redução), lisozima (atividade residual), fatores de crescimento, macronutrientes. Ordem de preferência: (1) LEITE MATERNO FRESCO da própria mãe; (2) LEITE HUMANO PASTEURIZADO do BLH; (3) FÓRMULA específica para prematuros (último recurso). As DOADORAS passam por triagem sorológica obrigatória (HIV, HTLV, sífilis, hepatite B e C). O leite do BLH é indicado para TODOS os prematuros e RN doentes quando o leite materno não está disponível."}]},{"id":"crescimento_desenvolvimento","nome":"Crescimento e Desenvolvimento Infantil","senha":"crescimento@mod5","emoji":"📏","questoes":[{"enunciado":"De acordo com as curvas de crescimento da OMS adotadas pelo Ministério da Saúde, qual é o critério correto para classificar o estado nutricional de uma criança de 2 anos com peso para idade abaixo do escore Z-2?","alternativas":["A) Obesidade — escore Z-2 indica excesso de peso","B) Baixo peso — peso para idade < escore Z-2 indica baixo peso; < Z-3 indica muito baixo peso","C) Eutrofia — escore Z-2 é o limite superior do normal","D) Sobrepeso — apenas o IMC define o estado nutricional antes dos 5 anos","E) Magreza acentuada — critério válido apenas para maiores de 5 anos"],"correta":1,"comentario":"As curvas da OMS (2006 para < 5 anos; 2007 para 5-19 anos) adotadas pelo MS classificam o estado nutricional por escores Z: Peso/Idade: < Z-3 = muito baixo peso; Z-3 a Z-2 = baixo peso; Z-2 a Z+2 = peso adequado (eutrofia); > Z+2 = peso elevado. Estatura/Idade: < Z-2 = baixa estatura; < Z-3 = muito baixa estatura. IMC/Idade (> 2 anos): < Z-2 = magreza; Z-2 a Z+1 = eutrofia; Z+1 a Z+2 = risco de sobrepeso; > Z+2 = sobrepeso; > Z+3 = obesidade. A Caderneta da Criança traz essas curvas para acompanhamento."},{"enunciado":"Um lactente de 4 meses é trazido à UBS para consulta de puericultura. A mãe pergunta sobre o desenvolvimento motor esperado para a idade. Quais marcos motores são esperados aos 4 meses?","alternativas":["A) Sentar sem apoio e transferir objetos de uma mão para outra","B) Sustentar a cabeça em prono (45-90°), rolar da posição prona para supina, segurar objetos na mão e levar à boca","C) Andar com apoio e falar 2-3 palavras","D) Ficar em pé com apoio e bater palmas","E) Caminhar independentemente e construir torre de 2 cubos"],"correta":1,"comentario":"Marcos do desenvolvimento motor GROSSO e FINO aos 4 meses: MOTOR GROSSO: sustenta a cabeça firmemente em prono (90°), inicia rolagem (prono → supino), ganha controle de tronco em posição semisentada com apoio. MOTOR FINO: segura objetos colocados na mão, leva mãos à boca, bate nas coisas. LINGUAGEM: vocaliza ('aah', 'eeh'), ri alto, localiza sons. SOCIAL: sorri responsivamente, reconhece rosto da mãe. SENSORIAL: acompanha objetos 180°. Sentar sem apoio: ~6-8 meses. Andar independente: ~12 meses. Falar 2-3 palavras: ~12 meses. A avaliação do desenvolvimento deve ser registrada na Caderneta da Criança."},{"enunciado":"Sobre o ganho de peso esperado no primeiro ano de vida, qual sequência está CORRETA?","alternativas":["A) Dobra o peso ao nascer em 3 meses e triplica em 6 meses","B) Dobra o peso de nascimento por volta dos 4-5 meses e triplica por volta dos 12 meses; ganha ~600-900g/mês nos primeiros 3 meses, ~400-500g/mês entre 3-6 meses e ~250-300g/mês entre 6-12 meses","C) Ganha peso uniformemente de 100g/mês durante todo o primeiro ano","D) Dobra o peso ao nascer somente após 12 meses e triplica aos 2 anos","E) O ganho de peso nos primeiros 6 meses é igual ao dos 6-12 meses"],"correta":1,"comentario":"Ganho de peso no 1º ano de vida (referência OMS/MS): 0-3 meses: ~600-900g/mês (crescimento mais rápido); 3-6 meses: ~400-500g/mês; 6-9 meses: ~300-350g/mês; 9-12 meses: ~250-300g/mês. MARCOS de peso: DOBRA o peso de nascimento aos ~4-5 meses (ex: RN com 3 kg → 6 kg aos 4-5 meses); TRIPLICA aos ~12 meses (→ 9 kg). COMPRIMENTO: cresce ~2,5 cm/mês nos primeiros 3 meses, ~1,5 cm/mês dos 3-6 meses, ~1,2 cm/mês dos 6-9 meses, ~1 cm/mês dos 9-12 meses. Crescimento esperado no 1º ano: +25 cm no comprimento. Monitorar na Caderneta da Criança."},{"enunciado":"O enfermeiro avalia o desenvolvimento neuropsicomotor (DNPM) de uma criança de 12 meses. Qual sinal de ALERTA para o desenvolvimento deve ser comunicado ao médico?","alternativas":["A) A criança ainda não corre — só anda com apoio","B) Ausência de gestos comunicativos (apontar, dar tchau, bater palmas), ausência de palavras com significado e não demonstrar interesse social — sinais de alerta para Transtorno do Espectro Autista (TEA) e outros atrasos","C) A criança não sabe construir torre de 5 cubos","D) A criança ainda não sabe pular com os dois pés","E) A criança não sabe contar até 10"],"correta":1,"comentario":"SINAIS DE ALERTA para o desenvolvimento aos 12 meses (SINALIZADORES PARA TEA e outros atrasos): ausência de GESTOS COMUNICATIVOS (apontar, acenar tchau, bater palmas); ausência de BALBUCIO ou palavras com significado; não responder ao próprio nome; não seguir objetos com o olhar; não mostrar interesse em interações sociais; perda de habilidades previamente adquiridas (regressão = sempre alarme). Marcos esperados aos 12 meses: anda com apoio ou independentemente, fala 1-2 palavras com significado (mamã, papá), aponta para objetos, imita gestos, busca objeto escondido. O TESTE DE DESENVOLVIMENTO M-CHAT-R/F rastreia TEA entre 16-30 meses."},{"enunciado":"A enfermeira realiza a consulta de puericultura de um lactente de 6 meses. Sobre a avaliação do desenvolvimento sensorial, qual afirmação está CORRETA?","alternativas":["A) Nesta idade, o lactente não consegue ainda localizar a origem de sons","B) Aos 6 meses o lactente vira a cabeça para localizar sons, acompanha objetos em todas as direções (visão binocular estabelecida), reconhece rostos familiares e estranha desconhecidos (Angústia do 8º mês antecipada)","C) A Triagem Auditiva Neonatal (teste da orelhinha) deve ser repetida aos 6 meses em todos os lactentes","D) O estranhamento de desconhecidos só aparece após os 12 meses de vida","E) Aos 6 meses a criança ainda não consegue distinguir cores"],"correta":1,"comentario":"Desenvolvimento SENSORIAL aos 6 meses: VISÃO: segue objetos em todas as direções, visão de cores estabelecida, percepção de profundidade em desenvolvimento, reconhece rostos familiares. AUDIÇÃO: localiza sons virando a cabeça para ambos os lados, reage ao próprio nome, responde a tons suaves. SOCIAL: estranhamento de desconhecidos pode surgir entre 6-9 meses (pico 8 meses — 'Angústia do 8º mês'). MOTOR: senta com apoio, rola em ambas as direções, transfere objetos de mão. LINGUAGEM: balbucio com consoantes-vogais (bababababa). A Triagem Auditiva Neonatal é realizada uma vez na maternidade; se houver suspeita de perda auditiva, encaminhar ao audiologista."},{"enunciado":"Sobre o desenvolvimento da linguagem infantil, qual sequência de marcos está CORRETA?","alternativas":["A) 2 meses: palavras; 6 meses: frases; 12 meses: narrativas completas","B) 2 meses: vocalizações ('ah', 'eh'); 6 meses: balbucio com consoantes; 12 meses: 1-3 palavras com significado; 18-24 meses: frases de 2 palavras; 3 anos: frases completas compreensíveis por estranhos","C) 6 meses: primeiras palavras; 12 meses: frases de 2 palavras; 18 meses: vocabulário de 100 palavras","D) 12 meses: apenas balbucio; 18 meses: primeiras palavras; 2 anos: primeiras frases","E) O desenvolvimento da linguagem é uniforme em todas as crianças independentemente do ambiente"],"correta":1,"comentario":"Marcos do DESENVOLVIMENTO DA LINGUAGEM (OMS/SBP): 2 meses: vocalizações ('ah','eh','oo'), sorri; 4 meses: ri alto, vocaliza prazer/desprazer; 6 meses: balbucio (babababá, mamamamá); 9-12 meses: balbucio variado, 1-3 palavras com significado; 18 meses: vocabulário de 10-20 palavras; 24 meses: frases de 2 palavras, 50+ palavras; 3 anos: frases de 3-5 palavras, compreensível por estranhos; 4-5 anos: narrativas coerentes. SINAIS DE ALERTA: não vocaliza aos 2m, não balbucia aos 6m, sem palavras aos 12m, sem frases de 2 palavras aos 24m, linguagem incompreensível aos 3 anos → encaminhar para avaliação fonoaudiológica."},{"enunciado":"Uma criança de 2 anos é avaliada na UBS. A mãe relata que ela ainda não anda. O enfermeiro identifica isso como um sinal de alerta. Qual é o marco motor esperado para essa idade e quais hipóteses diagnósticas devem ser investigadas?","alternativas":["A) Andar independente só é esperado aos 3 anos — não é sinal de alerta","B) Andar independente é esperado entre 9-15 meses (limite superior: 18 meses); não andar aos 2 anos é sinal de alerta significativo — investigar Paralisia Cerebral, distrofias musculares, hipotonia central, malformações ortopédicas","C) A criança pode não andar até os 3 anos se for prematura","D) A ausência de marcha aos 2 anos é normal se a criança arrastar para se locomover","E) Encaminhar apenas após os 3 anos de idade"],"correta":1,"comentario":"MARCHA INDEPENDENTE: marco motor grosso esperado entre 9-15 meses (média 12 meses); LIMITE SUPERIOR NORMAL: 18 meses. Criança que não anda com 18 meses deve ser investigada. Criança que não anda com 24 meses (2 anos) é um sinal de ALERTA SIGNIFICATIVO que exige investigação urgente. Hipóteses: PARALISIA CEREBRAL (PC — lesão não progressiva do SNC), DISTROFIA MUSCULAR DE DUCHENNE (meninos), HIPOTONIA CENTRAL (síndromes genéticas, metabolopatias), LUXAÇÃO CONGÊNITA DO QUADRIL, HIDROCEFALIA, ESPINHA BÍFIDA. O enfermeiro deve encaminhar imediatamente para avaliação neurológica e ortopédica. A prematuridade deve ser corrigida pela IDADE CORRIGIDA (até 2 anos para prematuros extremos)."},{"enunciado":"Sobre a dentição na infância, qual afirmação está CORRETA?","alternativas":["A) Os primeiros dentes decíduos surgem entre 12-15 meses de vida","B) A erupção dos dentes decíduos inicia entre 6-8 meses (incisivos centrais inferiores), completando-se aos 2-3 anos; a higiene oral deve ser iniciada antes da erupção (gaze úmida) e com escova macia após o 1º dente; flúor deve ser prescrito conforme avaliação odontológica","C) Os dentes permanentes começam a surgir aos 5-6 anos e a higiene só é necessária após sua erupção","D) A higiene oral em bebês é desnecessária antes dos dentes permanentes","E) O uso de chupeta não interfere no desenvolvimento dentário"],"correta":1,"comentario":"DENTIÇÃO DECÍDUA (leite): erupção entre 6-30 meses. Sequência típica: incisivos centrais inferiores (6-8m) → incisivos centrais superiores (8-10m) → incisivos laterais → primeiros molares → caninos → segundos molares. Completa-se ~24-30 meses (20 dentes). HIGIENE ORAL: deve ser iniciada ANTES da erupção dos dentes (limpar gengiva com gaze úmida após mamar); após o 1º dente: escova macia adequada para bebês; pasta com flúor: MS recomenda 1000 ppm desde a erupção do 1º dente (quantidade de grão de arroz até 3 anos; grão de ervilha dos 3-6 anos). PRIMEIRA CONSULTA odontológica: antes do 1º aniversário. Chupeta e sucção de dedo prolongada (> 3-4 anos) podem causar má oclusão."},{"enunciado":"O enfermeiro orienta uma mãe sobre o desenvolvimento cognitivo do filho de 18 meses. Segundo Jean Piaget, em qual estágio do desenvolvimento cognitivo está essa criança?","alternativas":["A) Estágio Pré-Operatório — pensamento simbólico desenvolvido","B) Estágio Sensório-Motor (0-2 anos) — período 5 ou 6; a criança desenvolve a permanência do objeto, causalidade e imitação diferida; início do jogo simbólico","C) Estágio Operatório Concreto — já realiza operações lógicas","D) Estágio Operatório Formal — pensamento abstrato estabelecido","E) Estágio Sensório-Motor período 1 — reflexos inatos predominam"],"correta":1,"comentario":"TEORIA DO DESENVOLVIMENTO COGNITIVO de Jean Piaget: ESTÁGIO SENSÓRIO-MOTOR (0-2 anos): 6 subestágios. Aos 18 meses (período 5-6): PERMANÊNCIA DO OBJETO completamente estabelecida (busca objeto mesmo com deslocamentos invisíveis), CAUSALIDADE (usa ferramentas para atingir objetivos), IMITAÇÃO DIFERIDA (imita ações que viu anteriormente), início do JOGO SIMBÓLICO (faz de conta). PRÉ-OPERATÓRIO (2-7 anos): pensamento simbólico/representativo, egocentrismo, animismo, centração. OPERATÓRIO CONCRETO (7-11 anos): conservação, classificação, seriação. OPERATÓRIO FORMAL (> 11 anos): pensamento abstrato. O enfermeiro usa esses conhecimentos para estimular o desenvolvimento e orientar os pais sobre brinquedos e atividades adequados."},{"enunciado":"Sobre a microcefalia em crianças, quais são os critérios diagnósticos e as principais etiologias?","alternativas":["A) Perímetro cefálico abaixo do percentil 25 para idade e sexo","B) Perímetro cefálico < escore Z-2 (microcefalia) ou < Z-3 (microcefalia grave) para idade, sexo e idade gestacional; etiologias: infecções TORCH (Zika, CMV, toxoplasmose), síndromes genéticas, hipóxia perinatal, erros inatos do metabolismo","C) Cabeça visualmente pequena sem necessidade de medição formal","D) Microcefalia é sinônimo de retardo mental grave em todos os casos","E) O perímetro cefálico só deve ser medido ao nascimento — não é necessário monitorar no seguimento"],"correta":1,"comentario":"MICROCEFALIA: perímetro cefálico (PC) < escore Z-2 para idade/sexo/IG; MICROCEFALIA GRAVE: < Z-3. No contexto da epidemia de Zika (2015-2016), o MS adotou critérios específicos: RN a termo ≥ 37 sem: PC < 32 cm. ETIOLOGIAS: INFECÇÕES CONGENITAIS (TORCH): Zika vírus (microcefalia + calcificações corticais), Citomegalovírus (CMV — mais comum no mundo), Toxoplasmose, Rubéola, Herpes, Sífilis; GENÉTICAS: Síndrome de Down, Síndrome de Angelman, síndromes cromossômicas; HIPÓXIA PERINATAL grave; ERROS INATOS DO METABOLISMO; EXPOSIÇÃO A TERATÓGENOS (álcool — SAF); CRANIOSSINOSTOSE. O PC deve ser medido em TODA consulta de puericultura e plotado nas curvas da Caderneta da Criança."},{"enunciado":"Durante a consulta de puericultura de uma criança de 3 anos, o enfermeiro realiza a avaliação do desenvolvimento. Quais habilidades são esperadas para essa faixa etária?","alternativas":["A) Lê palavras simples e sabe contar até 20","B) Sobe escadas alternando os pés, pedala triciclo, desenha círculo, faz torre de 6-8 cubos, usa frases de 3-5 palavras, compreende conceitos de tamanho (grande/pequeno), veste-se com ajuda","C) Pula em um pé só com facilidade e escreve seu nome completo","D) Ainda não consegue correr nem subir escadas sem apoio","E) Só consegue construir torre de 2 cubos e falar frases de 2 palavras"],"correta":1,"comentario":"Desenvolvimento esperado aos 3 ANOS: MOTOR GROSSO: corre bem, sobe escadas alternando pés, pedala triciclo, pula com os dois pés, joga bola. MOTOR FINO: torre de 8-9 cubos, copia círculo, segura lápis com mais controle, recorta com tesoura. LINGUAGEM: frases de 3-5 palavras, vocabulário de 900-1000 palavras, compreendido por estranhos em 75%, usa plurais e passado. COGNITIVO: conceitos grande/pequeno, identifica cores, conta até 3. AUTONOMIA: come com colher/garfo, veste-se com pouca ajuda, controle esfincteriano diurno. SOCIAL: jogo paralelo evoluindo para jogo associativo, imita adultos. Pular em um pé só = 4 anos. Escrever nome = 5-6 anos."},{"enunciado":"Sobre a avaliação do desenvolvimento utilizando a Escala de Triagem do Desenvolvimento de Denver II (DDST), qual afirmação está CORRETA?","alternativas":["A) O Denver II avalia desenvolvimento apenas em menores de 6 meses","B) O Denver II é uma ferramenta de TRIAGEM (não diagnóstica) que avalia 4 domínios (motor grosso, motor fino-adaptativo, linguagem e pessoal-social) em crianças de 0-6 anos; resultado suspeito ou não testável indica necessidade de reavaliação e possível encaminhamento","C) O Denver II é o exame padrão-ouro para diagnóstico de autismo","D) O Denver II avalia apenas o desenvolvimento motor, excluindo linguagem e comportamento","E) Um resultado normal no Denver II garante desenvolvimento neurológico perfeito"],"correta":1,"comentario":"DENVER II (Denver Developmental Screening Test): ferramenta de TRIAGEM do DNPM, aplicada de 0-6 anos de vida. Avalia 4 setores: (1) PESSOAL-SOCIAL (interação, cuidados pessoais); (2) MOTOR FINO-ADAPTATIVO (coordenação olho-mão, resolução de problemas); (3) LINGUAGEM (receptiva e expressiva); (4) MOTOR GROSSO. Classificação: NORMAL (dentro do esperado), SUSPEITO (falha em 2+ itens 'cautela' ou 1+ falha), NÃO TESTÁVEL (recusa de itens). Resultado SUSPEITO: reavaluação em 1-2 semanas; se mantém suspeito → encaminhar para avaliação especializada. É uma ferramenta de TRIAGEM — não diagnóstica. O diagnóstico de TEA usa M-CHAT-R/F (16-30 meses) + avaliação especializada."},{"enunciado":"Uma criança de 5 anos apresenta enurese noturna. Os pais estão preocupados. Qual é a orientação mais adequada do enfermeiro?","alternativas":["A) A enurese noturna aos 5 anos é sempre patológica — encaminhar urgentemente ao urologista","B) A enurese noturna (xixi na cama) é considerada normal até os 5-6 anos; após essa idade, investigar causas orgânicas (ITU, diabetes, poliúria), orientar medidas comportamentais (limitar líquidos à noite, ir ao banheiro antes de dormir, reforço positivo) e monitorar","C) Prescrever desmopressina imediatamente como tratamento de primeira linha","D) A enurese noturna aos 5 anos sempre indica abuso sexual","E) Punir a criança pelos episódios para que aprenda a controlar"],"correta":1,"comentario":"ENURESE NOTURNA: micção involuntária durante o sono. É considerada NORMAL até os 5-6 anos (controle esfincteriano noturno completo se estabelece entre 4-7 anos). Prevalência: 15-25% aos 5 anos, 5% aos 10 anos, 1% nos adultos. A resolução ESPONTÂNEA ocorre em 15%/ano. INVESTIGAR após 5-6 anos: ITU recorrente, poliúria (DM, DI), constipação, alterações neurológicas, enurese secundária (criança que ficou seca e voltou a urinar — sempre investigar estressor psicossocial ou causa orgânica). TRATAMENTO (> 6-7 anos): medidas comportamentais (1ª linha): limitar líquidos após jantar, urinar antes de dormir, calendário de controle, reforço positivo; alarme de enurese (melhor evidência); desmopressina (2ª linha). NUNCA punir — causa trauma e piora o quadro."},{"enunciado":"Sobre o crescimento em estatura durante a infância e adolescência, qual sequência está CORRETA?","alternativas":["A) O crescimento é constante de 5 cm/ano da infância até a adolescência","B) 1º ano: ~25 cm; 2º ano: ~12 cm; 3-10 anos: ~5-7 cm/ano (fase de crescimento estável); adolescência: pico de velocidade de crescimento (PVC) de 8-12 cm/ano em meninas (10-12 anos) e 9-14 cm/ano em meninos (12-14 anos)","C) Meninos crescem mais rápido que meninas em todas as fases da infância","D) O crescimento em estatura para completamente aos 14 anos em meninas e 16 anos em meninos","E) O hormônio do crescimento não influencia o crescimento durante a fase pré-puberal"],"correta":1,"comentario":"VELOCIDADE DE CRESCIMENTO em estatura: 1º ANO: ~25 cm (maior crescimento da vida pós-natal); 2º ANO: ~12 cm; 3-10 ANOS (infância média): ~5-7 cm/ano (fase de crescimento estável — GH dependente). PUBERDADE — PICO DE VELOCIDADE DE CRESCIMENTO (PVC): MENINAS: PVC de 8-9 cm/ano aos 11-12 anos (início puberal); término do crescimento ~16 anos (fechamento das epífises). MENINOS: PVC de 9-10 cm/ano aos 13-14 anos; término ~18-20 anos. Meninas crescem mais cedo (puberdade precoce), mas meninos crescem mais (testosterona + GH + IGF-1). Hormônio do crescimento (GH) + IGF-1 são essenciais em todas as fases. Deficiência de GH → nanismo hipofisário. Hipotireoidismo → crescimento retardado."},{"enunciado":"O enfermeiro orienta pais sobre o desenvolvimento social e emocional de uma criança de 4 anos. Qual comportamento é ESPERADO para essa faixa etária?","alternativas":["A) A criança de 4 anos ainda não consegue brincar com outras crianças — jogo solitário é o esperado","B) Jogo associativo com outras crianças, inicia amizades, gosta de histórias e faz de conta elaborado, tem senso de humor, pode ter amigo imaginário, compreende regras simples, alterna entre dependência e independência","C) A criança de 4 anos deve ser completamente autônoma em todas as AVDs","D) Birras frequentes e intensas aos 4 anos são sempre indicativas de transtorno de comportamento","E) A criança de 4 anos ainda não consegue distinguir fantasia da realidade"],"correta":1,"comentario":"DESENVOLVIMENTO SOCIAL E EMOCIONAL aos 4 ANOS: JOGO: associativo com outras crianças (jogar junto com interação), jogos de regras simples, faz de conta elaborado (fantasias complexas). EMOCIONAL: identifica e nomeia emoções básicas, empatia em desenvolvimento, pode ter AMIGO IMAGINÁRIO (normal até 6-7 anos), alternância entre comportamentos infantis e maduros. MORAL: compreende regras, distingue certo/errado, conta mentiras simples. AUTONOMIA: se veste/despe com pouca ajuda, higiene com supervisão. BIRRAS: reduzem significativamente após os 3 anos — birras frequentes e intensas aos 4 anos merecem avaliação (mas podem ser normais se contextuais). A criança de 4 anos JÁ distingue fantasia da realidade (mas o pensamento mágico persiste — Piaget, pré-operatório)."},{"enunciado":"Sobre a puberdade precoce, qual definição está CORRETA?","alternativas":["A) Aparecimento de caracteres sexuais secundários após os 18 anos","B) Desenvolvimento de caracteres sexuais secundários antes dos 8 anos em meninas e antes dos 9 anos em meninos; pode ser central (dependente de GnRH) ou periférica (independente de GnRH); causa avanço da idade óssea e fusão precoce das epífises → baixa estatura final","C) Puberdade antes dos 10 anos em meninas e 11 anos em meninos","D) A puberdade precoce não causa impacto na estatura final","E) Puberdade precoce em meninas é sempre causada por tumor ovariano"],"correta":1,"comentario":"PUBERDADE PRECOCE: desenvolvimento de caracteres sexuais secundários ANTES dos 8 anos em MENINAS e dos 9 anos em MENINOS. TIPOS: CENTRAL (GnRH-dependente, isosexual): ativação prematura do eixo HHG — mais comum em meninas (80% idiopática); em meninos, mais frequentemente associada a lesão do SNC (tumor, hamartoma hipotalâmico). PERIFÉRICA (GnRH-independente): produção autônoma de hormônios sexuais — tumor adrenal, tumor ovariano, síndrome de McCune-Albright, CAH. CONSEQUÊNCIAS: avanço da idade óssea → fusão prematura das epífises → BAIXA ESTATURA FINAL (paradoxo: criança alta precocemente, adulta baixa). DIAGNÓSTICO: avaliação clínica + idade óssea + LH/FSH + US pélvica/adrenal. TRATAMENTO da forma central: análogo de GnRH."},{"enunciado":"Um menino de 10 anos, filho de pais baixos, apresenta estatura no percentil 3 para a idade, velocidade de crescimento normal (6 cm/ano), idade óssea compatível com a cronológica e sem sinais puberais. O diagnóstico mais provável é:","alternativas":["A) Deficiência de hormônio do crescimento — iniciar somatotropina imediatamente","B) Baixa estatura familiar (BEF) — variante normal do crescimento; a estatura alvo dos pais indica potencial genético compatível; não requer tratamento hormonal","C) Hipotireoidismo congênito não tratado","D) Síndrome de Turner — causa comum de baixa estatura em meninos","E) Desnutrição grave — iniciar suplementação calórica intensiva"],"correta":1,"comentario":"BAIXA ESTATURA FAMILIAR (BEF): variante NORMAL do crescimento. Características: baixa estatura (< P3 ou Z-2), VELOCIDADE DE CRESCIMENTO NORMAL (≥ 5 cm/ano), IDADE ÓSSEA compatível com a cronológica (dentro de 1 ano), pais com baixa estatura (estatura alvo familiar baixo), puberdade em tempo normal, ESTATURA ADULTA dentro do potencial genético (alvo parental). Não requer tratamento. Estatura-alvo parental (EAP): (altura pai + altura mãe ± 13 cm) / 2 [+ 6,5 cm para meninos; – 6,5 cm para meninas]. BAIXA ESTATURA CONSTITUCIONAL DO CRESCIMENTO E PUBERDADE (BECCP): baixa estatura + ATRASO puberal + ID ÓSSEA atrasada — também é variante normal, mais comum em meninos (geralmente história familiar paterna de puberdade tardia)."},{"enunciado":"Sobre o desenvolvimento do controle esfincteriano (desfraldamento), qual orientação está CORRETA?","alternativas":["A) O treinamento deve ser iniciado ao 1 ano de vida para resultados mais eficazes","B) O controle esfincteriano voluntário se desenvolve entre 18-30 meses; o desfraldamento deve ser iniciado quando a criança demonstra prontidão (fica seca por 2h, avisa que vai urinar/evacuar, consegue sentar no penico, demonstra interesse); forçar antes da prontidão aumenta o risco de enurese e encoprese","C) O controle noturno se estabelece antes do controle diurno","D) O desfraldamento deve ser forçado antes dos 18 meses para evitar habituação à fralda","E) A encoprese (evacuar na roupa) é normal até os 6 anos"],"correta":1,"comentario":"DESENVOLVIMENTO DO CONTROLE ESFINCTERIANO: controle DIURNO: 18-30 meses (maioria entre 24-36 meses); controle NOTURNO: 36-48+ meses. Sequência fisiológica: controle intestinal noturno → intestinal diurno → urinário diurno → urinário noturno. SINAIS DE PRONTIDÃO para desfraldamento: permanece seca por ≥ 2h; avisa antes de urinar/evacuar; demonstra interesse no penico/vaso; consegue sentar; compreende instruções simples; copia comportamentos de adultos. ORIENTAR os pais: sem pressão, sem punição, reforço positivo; retrocesso é normal em momentos de estresse (irmão novo, mudança). ENCOPRESE (evacuar em local inadequado após controle): > 4 anos = investigar (constipação crônica = causa mais comum). ENURESE noturna: > 5-6 anos = investigar."},{"enunciado":"Sobre o rastreamento de displasia do desenvolvimento do quadril (DDQ) em recém-nascidos e lactentes, qual afirmação está CORRETA?","alternativas":["A) A DDQ é diagnosticada exclusivamente pela radiografia de quadril ao nascimento","B) O rastreamento clínico com as manobras de Ortolani e Barlow deve ser realizado no RN e lactente; ultrassonografia do quadril é indicada para grupos de risco (apresentação pélvica, história familiar, sexo feminino, oligoâmnio) até os 6 meses; tratamento precoce (suspensório de Pavlik) tem excelentes resultados","C) A DDQ é mais comum em meninos do que em meninas","D) O quadril clique ao nascimento sempre confirma DDQ e indica cirurgia imediata","E) A DDQ não tem tratamento antes dos 2 anos de vida"],"correta":1,"comentario":"DISPLASIA DO DESENVOLVIMENTO DO QUADRIL (DDQ) — antiga luxação congênita do quadril: incidência 1-3/1000 NV. FATORES DE RISCO: sexo FEMININO (4-8x maior risco), apresentação PÉLVICA (histor familiar, oligoâmnio, primigestas). RASTREAMENTO: Manobra de ORTOLANI (reduz o quadril luxado — 'clique' de redução = positivo) + BARLOW (luxa o quadril instável — positivo se quadril sai do acetábulo). ULTRASSONOGRAFIA do quadril: padrão-ouro antes dos 4-6 meses (osso cartilaginoso não aparece no RX). RX de quadril: > 4-6 meses. TRATAMENTO PRECOCE: < 6 meses: suspensório de Pavlik (95% de sucesso); 6-18 meses: redução fechada + imobilização gessada; > 18 meses: cirurgia. Diagnóstico e tratamento precoces evitam artrose e dismetria de membros."},{"enunciado":"Sobre o Transtorno do Espectro Autista (TEA), quais são os sinais de alerta precoces que o enfermeiro deve reconhecer na consulta de puericultura?","alternativas":["A) TEA só pode ser suspeito após os 5 anos de idade","B) Sinais precoces de TEA (red flags): não sorri socialmente até 6 meses, não balbuceia até 12 meses, não aponta nem acena até 12 meses, não fala palavras isoladas até 16 meses, não faz frases de 2 palavras até 24 meses, qualquer PERDA de habilidade em qualquer idade — usar M-CHAT-R/F entre 18-30 meses para triagem","C) Contato visual reduzido é normal até os 3 anos e não deve ser considerado sinal de alerta","D) TEA é exclusivamente genético — só investigar se houver familiar afetado","E) O diagnóstico definitivo de TEA pode ser feito pelo enfermeiro na consulta de puericultura"],"correta":1,"comentario":"TRANSTORNO DO ESPECTRO AUTISTA (TEA): prevalência atual 1:36 crianças (CDC 2023). SINAIS DE ALERTA PRECOCES (red flags absolutas — encaminhar para avaliação especializada imediatamente): ausência de sorriso social (< 6m); sem balbucio (< 12m); sem apontar, mostrar, gesticular (< 12m); sem palavras (< 16m); sem frases de 2 palavras (< 24m); QUALQUER PERDA de linguagem ou habilidade social em QUALQUER idade. M-CHAT-R/F (Modified Checklist for Autism in Toddlers): triagem entre 18-30 meses — aplicado na consulta de puericultura. TRIAGEM UNIVERSAL: recomendada pelo SBP aos 18 e 24-36 meses. O DIAGNÓSTICO de TEA é CLÍNICO-COMPORTAMENTAL (não existe exame laboratorial ou de imagem) — realizado por equipe especializada (neuropediatra, psiquiatra infantil, psicólogo). O ENFERMEIRO realiza a triagem e encaminha."},{"enunciado":"Sobre a avaliação do peso ao nascimento e suas classificações, qual sequência está CORRETA?","alternativas":["A) Baixo peso: < 3000g; muito baixo peso: < 2000g; extremo baixo peso: < 1500g","B) Baixo peso ao nascer (BPN): < 2500g; muito baixo peso (MBP): < 1500g; extremo baixo peso (EBP): < 1000g; RN grande para a idade gestacional (GIG): > P90; pequeno para IG (PIG): < P10","C) Todo RN com peso < 3000g é considerado prematuro","D) O peso de nascimento não influencia o risco de morbimortalidade neonatal","E) BPN é definido como < 2000g independentemente da IG"],"correta":1,"comentario":"Classificações do PESO AO NASCIMENTO: BPN (Baixo Peso ao Nascer): < 2500g (independente da IG); MBP (Muito Baixo Peso): < 1500g; EBP (Extremo Baixo Peso): < 1000g. Classificação pelo PESO × IDADE GESTACIONAL: AIG (Adequado para IG): entre P10 e P90; GIG (Grande para IG): > P90 — risco de hipoglicemia, tocotraumatismo; PIG (Pequeno para IG): < P10 — risco de RCIU, hipoglicemia, policitemia, hipotermia. CLASSIFICAÇÃO pela IG: Pré-termo extremo: < 28 sem; MTP: 28-31,6 sem; PT moderado: 32-33,6 sem; PT tardio: 34-36,6 sem; A termo precoce: 37-38,6 sem; A termo: 39-40,6 sem; Pós-termo: ≥ 41 sem. BPN + PT = maior risco de morbimortalidade."},{"enunciado":"Sobre a fontanela anterior (bregmática) nos lactentes, quais são os achados normais e os sinais de alerta?","alternativas":["A) A fontanela anterior fecha ao nascimento — não deve ser palpável","B) A fontanela anterior (bregmática) tem 2-3 cm ao nascimento, fecha entre 9-18 meses (média 12 meses); fontanela abaulada = aumento da PIC (hidrocefalia, meningite, TCE); fontanela deprimida = desidratação; fechamento prematuro (< 3 meses) = craniossinostose; fontanela > 3 cm ou persistente > 18 meses = hipotireoidismo, raquitismo, hidrocefalia","C) Fontanela abaulada em lactente chorando é sempre sinal de meningite","D) A fontanela posterior (lambdóidea) fecha entre 12-18 meses de vida","E) Fontanela deprimida indica aumento da pressão intracraniana"],"correta":1,"comentario":"FONTANELAS: ANTERIOR (bregmática): forma de losango, ~2-3 cm ao nascimento, fecha entre 9-18 meses (MÉDIA 12 meses); é normal pulsar com o batimento cardíaco; pode abaularse transitoriamente ao choro (sem significado). POSTERIOR (lambdóidea): fecha aos 2-3 meses. ACHADOS PATOLÓGICOS da fontanela anterior: ABAULAMENTO persistente ou em repouso = AUMENTO da PIC (meningite, encefalite, hidrocefalia, hemorragia subdural, TCE, hipervitaminose A); DEPRIMIDA = DESIDRATAÇÃO; CICHO PRECOCE (< 3-4 meses) = CRANIOSSINOSTOSE (risco de hipertensão intracraniana e deformidade craniana); ABERTURA > 4-5 cm ou fechamento TARDIO (> 18 meses) = hipotireoidismo, raquitismo, síndrome de Down, hidrocefalia. O PC e as fontanelas devem ser avaliados em TODA consulta de puericultura."},{"enunciado":"Sobre a avaliação nutricional da criança menor de 5 anos na Atenção Primária, qual indicador é mais sensível para detectar desnutrição aguda?","alternativas":["A) Peso/Idade — melhor indicador para desnutrição aguda","B) Peso/Estatura (ou IMC/Idade) — melhor indicador para desnutrição AGUDA (wasting), pois reflete a massa corporal em relação ao comprimento atual, identificando criança magra para sua estatura","C) Estatura/Idade — melhor indicador para desnutrição aguda","D) Perímetro cefálico — melhor indicador de desnutrição aguda em < 5 anos","E) Todos os indicadores têm a mesma sensibilidade para detectar desnutrição aguda"],"correta":1,"comentario":"INDICADORES ANTROPOMÉTRICOS na criança < 5 anos: PESO/ESTATURA (P/E) ou IMC/IDADE: melhor para DESNUTRIÇÃO AGUDA (WASTING — criança magra para sua estatura); reflete déficit recente de peso. ESTATURA/IDADE (E/I): melhor para DESNUTRIÇÃO CRÔNICA (STUNTING — baixa estatura para a idade); déficits acumulados ao longo do tempo. PESO/IDADE (P/I): indicador MISTO, útil na triagem de rotina mas menos específico. PERÍMETRO BRAQUIAL MÉDIO (PBM): muito útil em triagens populacionais e emergências nutricionais (< 11,5 cm = desnutrição aguda grave; 11,5-12,5 cm = moderada). MARASMO: desnutrição calórica aguda grave (P/E muito baixo). KWASHIORKOR: desnutrição proteica com edema. MARASMO-KWASHIORKOR: forma mista."},{"enunciado":"Sobre o desenvolvimento psicossocial segundo Erik Erikson, em qual crise/estágio está uma criança de 6 anos que ingressa na escola e começa a aprender habilidades acadêmicas?","alternativas":["A) Confiança vs. Desconfiança (0-18 meses)","B) Autonomia vs. Vergonha e Dúvida (18 meses-3 anos)","C) Iniciativa vs. Culpa (3-5 anos)","D) Produtividade vs. Inferioridade (6-12 anos) — fase escolar, a criança busca competência e reconhecimento; experiências de fracasso podem gerar sentimentos de inferioridade","E) Identidade vs. Confusão de Papéis (12-18 anos)"],"correta":3,"comentario":"TEORIA DO DESENVOLVIMENTO PSICOSSOCIAL de Erik Erikson: 8 estágios, cada um com uma crise a ser resolvida: 0-18m: CONFIANÇA vs. DESCONFIANÇA (cuidado materno consistente); 18m-3a: AUTONOMIA vs. VERGONHA E DÚVIDA (controle esfincteriano, independência); 3-5a: INICIATIVA vs. CULPA (jogo, curiosidade, moral); 6-12a: PRODUTIVIDADE/INDÚSTRIA vs. INFERIORIDADE (escola, habilidades, competência — criança de 6 anos está aqui); 12-18a: IDENTIDADE vs. CONFUSÃO DE PAPÉIS (adolescência, quem sou eu); 18-40a: INTIMIDADE vs. ISOLAMENTO; 40-65a: GENERATIVIDADE vs. ESTAGNAÇÃO; > 65a: INTEGRIDADE vs. DESESPERO. Na fase escolar, a criança aprende habilidades e busca reconhecimento — fracasso repetido gera sentimentos de inferioridade."},{"enunciado":"Sobre o uso de telas e mídia digital na infância, quais são as recomendações atuais da SBP e da Academia Americana de Pediatria?","alternativas":["A) Não há restrições ao uso de telas para crianças de qualquer idade","B) Menos de 18-24 meses: EVITAR telas (exceto videochamadas); 2-5 anos: máximo 1h/dia com conteúdo de qualidade e mediação ativa de adultos; 6+ anos: limitar o tempo, garantir sono adequado, atividade física e interação social; proibir telas durante refeições e 1h antes de dormir","C) Telas educativas são benéficas e sem restrições para crianças acima de 1 ano","D) O uso de telas > 3h/dia não está associado a problemas de desenvolvimento","E) Videogames violentos não têm impacto no comportamento de crianças"],"correta":1,"comentario":"Recomendações sobre TEMPO DE TELA (SBP 2019; AAP atualização): < 18-24 meses: EVITAR (exceto videochamadas com familiares); 18-24 meses: apenas com mediação ativa do adulto, conteúdo de qualidade; 2-5 anos: máximo 1h/dia com conteúdo educativo de qualidade + mediação ativa; 6+ anos: limites consistentes de TEMPO e CONTEÚDO, garantindo sono adequado (8-10h), atividade física (1h/dia), atividades off-screen. REGRAS: sem telas nas refeições (prejudica vínculo e alimentação consciente), sem telas no quarto, sem telas 1h antes de dormir (luz azul suprime melatonina). Uso excessivo associado: atraso de linguagem, obesidade, alterações do sono, dificuldades atencionais. O enfermeiro orienta sobre uso saudável da tecnologia."},{"enunciado":"O enfermeiro avalia o desenvolvimento de uma criança de 9 meses. Quais marcos são esperados para essa faixa etária?","alternativas":["A) Anda independentemente, constrói torre de 4 cubos e fala frases de 2 palavras","B) Senta sem apoio com estabilidade, engatinha, fica em pé com apoio, pinça inferior (polegar+dedos), transfere objetos entre as mãos, balbucio variado (bababa, mamama), estranhamento, busca objeto escondido (permanência do objeto)","C) Ainda não consegue sentar sem apoio nem transferir objetos","D) Já consegue co
