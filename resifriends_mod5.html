dos contraceptivos (dupla proteção: camisinha + hormonal), prevenir IST/HIV, rastrear violência sexual, oferecer profilaxia (PEP/PrEP conforme indicação), e respeitar a diversidade sexual e de gênero","C) Adolescentes < 16 anos não têm direito a consultas de saúde sexual sem os pais","D) Anticoncepção de emergência não deve ser disponibilizada a adolescentes","E) A abstinência sexual é a única orientação de prevenção adequada para adolescentes"],"correta":1,"comentario":"SAÚDE SEXUAL E REPRODUTIVA DO ADOLESCENTE — papel do enfermeiro: (1) ABORDAGEM ACOLHEDORA, SEM JULGAMENTOS, confidencial; respeitar a DIVERSIDADE SEXUAL E DE GÊNERO (LGBTQIA+); (2) CONTRACEPÇÃO: dupla proteção (preservativo masculino/feminino + hormonal — pílula, injeção, implante, DIU); anticoncepção de emergência (levonorgestrel) disponível SEM PRESCRIÇÃO para adolescentes; (3) PREVENÇÃO DE IST/HIV: rastreamento, aconselhamento, testagem (HIV, sífilis, gonorreia, clamídia); PEP (profilaxia pós-exposição); PrEP (pré-exposição em grupos de risco); (4) VIOLÊNCIA SEXUAL: rastreamento ativo; atendimento especializado; notificação compulsória; contracepção de emergência + profilaxia de IST em casos de violência; (5) GRAVIDEZ: pré-natal diferenciado. A SAÚDE SEXUAL é direito do adolescente — não exige autorização parental (sigilo)."},{"enunciado":"Sobre as Infecções Sexualmente Transmissíveis (IST) em adolescentes, qual grupo tem maior prevalência e quais são as mais comuns?","alternativas":["A) Adolescentes têm menor prevalência de IST que adultos por terem menos parceiros","B) Adolescentes e jovens (15-24 anos) concentram a maior proporção de IST no Brasil; as mais prevalentes são: clamídia e gonorreia (mais comuns em adolescentes femininas), sífilis (em expansão desde 2016), HIV (novos casos aumentando em jovens de 15-24 anos, especialmente HSH)","C) Herpes genital não ocorre em adolescentes virgens","D) IST em adolescentes sempre causam sintomas evidentes — diagnóstico clínico é suficiente","E) Adolescentes com IST devem ser tratados exclusivamente por infectologistas"],"correta":1,"comentario":"IST NA ADOLESCÊNCIA — dados epidemiológicos BR: adolescentes e jovens 15-24 anos têm as maiores taxas de incidência de IST. Mais prevalentes: CLAMÍDIA (Chlamydia trachomatis): IST bacteriana mais comum no mundo, frequentemente ASSINTOMÁTICA (70% nas mulheres) — causa DIP, infertilidade; GONORREIA: 2ª IST bacteriana mais comum; SÍFILIS: aumento alarmante desde 2016 (sífilis congênita + sífilis adquirida); HPV: presente em quase todos os sexualmente ativos — rastreio vacinal; HIV: jovens de 15-24 anos representam 14% dos novos casos do Brasil, com aumento entre HSH jovens. A maioria das IST é ASSINTOMÁTICA — rastreio ativo é fundamental. Rastreamento: sorologia de sífilis (VDRL/RPR), HIV, hepatite B e C em adolescentes sexualmente ativos. Notificação compulsória: HIV, sífilis, hepatite B e C, gonorreia."},{"enunciado":"Sobre os transtornos alimentares (TA) na adolescência, qual afirmação está CORRETA?","alternativas":["A) Transtornos alimentares afetam apenas meninas — meninos não desenvolvem TA","B) Anorexia nervosa (restrição severa + distorção da imagem corporal + medo intenso de ganhar peso) e bulimia nervosa (episódios de compulsão alimentar + comportamentos compensatórios) têm pico de início na adolescência; o enfermeiro deve rastrear preocupações com peso/corpo, comportamentos alimentares restritivos e práticas purgatórias; encaminhar para equipe multiprofissional","C) O tratamento de TA é exclusivamente farmacológico — antidepressivos curam a anorexia","D) Anorexia nervosa não é grave — mortalidade é baixa","E) Qualquer dieta na adolescência indica transtorno alimentar"],"correta":1,"comentario":"TRANSTORNOS ALIMENTARES (TA) na adolescência: ANOREXIA NERVOSA (AN): restrição calórica severa, medo intenso de ganhar peso, distorção da imagem corporal — maior MORTALIDADE de todos os transtornos psiquiátricos (5-10% em 10 anos: complicações clínicas + suicídio); repercussões: desnutrição grave, osteoporose, amenorreia, bradicardia, hipotensão, arritmias. BULIMIA NERVOSA (BN): episódios de compulsão alimentar (binge) + comportamentos compensatórios (vômito, laxante, exercício excessivo) — normopeso geralmente. TRANSTORNO DE COMPULSÃO ALIMENTAR PERIÓDICA (TCAP). Afetam AMBOS OS SEXOS, mas ~90% são do sexo feminino. RASTREAMENTO: SCOFF, EDE-Q; perguntar sobre satisfação corporal, comportamentos alimentares. TRATAMENTO: equipe MULTIPROFISSIONAL (psiquiatra, psicólogo, nutricionista, médico clínico). HOSPITALIZAÇÃO: se risco grave (IMC < 14, instabilidade hemodinâmica)."},{"enunciado":"Sobre o desenvolvimento cognitivo e psicossocial na adolescência, qual é a tarefa desenvolvimental central segundo Erik Erikson?","alternativas":["A) Produtividade vs. Inferioridade","B) IDENTIDADE vs. CONFUSÃO DE PAPÉIS (Erikson, 12-18 anos) — o adolescente busca responder 'Quem sou eu?', desenvolve identidade pessoal, sexual, vocacional e ideológica; a confusão de identidade pode levar a comportamentos de risco","C) Intimidade vs. Isolamento","D) Autonomia vs. Vergonha e Dúvida","E) Generatividade vs. Estagnação"],"correta":1,"comentario":"TEORIA PSICOSSOCIAL DE ERIKSON — adolescência (12-18 anos): crise de IDENTIDADE vs. CONFUSÃO DE PAPÉIS. O adolescente questiona: 'Quem sou eu? O que quero ser?' Busca integrar identidades anteriores em uma IDENTIDADE COESA. Dimensões da identidade: PESSOAL (valores, crenças), SEXUAL/DE GÊNERO, VOCACIONAL (carreiras), IDEOLÓGICA (política, religião). Se resolvida positivamente: senso de identidade, autoconhecimento, direção. Se não resolvida: CONFUSÃO DE PAPEL — insegurança, dificuldade de fazer escolhas, conformidade excessiva com grupos. IMPLICAÇÕES PARA SAÚDE: o adolescente testa limites, experimenta identidades, tem pensamento concreto progredindo para o abstrato (Piaget, operatório formal). O GRUPO DE PARES é central. O enfermeiro entende esses processos para abordagem eficaz sem julgamento."},{"enunciado":"Sobre a violência e o bullying na adolescência, qual é o papel do enfermeiro?","alternativas":["A) Bullying é um problema exclusivamente escolar — o sistema de saúde não deve se envolver","B) O enfermeiro deve rastrear ativamente violência (física, psicológica, sexual, cyberbullying), identificar vítimas e agressores, orientar sobre direitos, articular com a escola, família e rede de proteção social, notificar casos de violência ao SINAN e ao Conselho Tutelar","C) Adolescentes que sofrem bullying devem ser orientados a ignorar os agressores","D) A violência contra adolescentes não é de notificação compulsória","E) O enfermeiro não tem papel na prevenção de violência — é função exclusiva da segurança pública"],"correta":1,"comentario":"VIOLÊNCIA NA ADOLESCÊNCIA — papel do ENFERMEIRO: (1) RASTREAMENTO ATIVO: perguntar sobre violência física (brigas, agressões), psicológica (humilhação, ameaças), sexual (abuso, exploração), cyberbullying (assédio virtual), violência de gênero/LGBTfobia; (2) ESCUTA ACOLHEDORA e SEM JULGAMENTO; (3) AVALIAÇÃO DE RISCO (suicídio, fuga de casa, risco iminente); (4) NOTIFICAÇÃO COMPULSÓRIA: violência contra criança e adolescente → SINAN + Conselho Tutelar (obrigatório — Lei 8.069/90 ECA Art. 13 e 245); (5) ARTICULAÇÃO com escola (PSE), CRAS/CREAS, Conselho Tutelar, segurança pública se necessário; (6) ACOMPANHAMENTO. BULLYING: abuso de poder repetitivo entre pares — vítimas têm 2-9x maior risco de depressão, ansiedade e suicídio. Cyberbullying: agressão online 24/7 — impacto psicológico grave. A NOTIFICAÇÃO é DEVER LEGAL do profissional de saúde."},{"enunciado":"Sobre a vacinação específica para adolescentes (PNI 2024), qual esquema está CORRETO?","alternativas":["A) Adolescentes só recebem vacinas de reforço — sem vacinas novas após os 10 anos","B) HPV quadrivalente (9-14 anos, 2 doses); dTpa (11 anos, reforço); meningocócica ACWY (11-12 anos); hepatite B (completar); influenza (grupos de risco); varicela (não vacinados); além de manter esquema da infância em dia","C) A vacina HPV é indicada apenas para meninas — meninos não recebem no SUS","D) A vacina dTpa é contraindicada em adolescentes — usar apenas dT","E) A vacina meningocócica C não tem reforço indicado na adolescência"],"correta":1,"comentario":"VACINAÇÃO DO ADOLESCENTE (PNI/MS 2024): HPV QUADRIVALENTE (Gardasil 4): meninas 9-14 anos (2 doses: 0 e 6 meses no SUS) + meninos 11-14 anos (2 doses — desde 2017 no SUS); fora da faixa: 3 doses; imunossuprimidos: 3 doses. dTpa (tríplice bacteriana acelular: difteria, tétano, coqueluche): 11 anos no calendário — reforço a cada 10 anos com dT (ou dTpa em intervalos conforme protocolo). MENINGOCÓCICA ACWY: adolescentes 11-12 anos (após reforço de MnC). HEPATITE B: completar se não vacinado. VARICELA: 1 dose se nunca vacinou e sem histórico da doença. INFLUENZA: grupos de risco (doenças crônicas, imunossuprimidos). FEBRE AMARELA: reforço se vacinado há > 10 anos em área de risco. O enfermeiro deve revisar o cartão vacinal em toda consulta do adolescente e atualizar o esquema incompleto."},{"enunciado":"Sobre a prevenção de acidentes e violências em adolescentes, qual medida preventiva é mais eficaz?","alternativas":["A) Proibir a prática de esportes radicais para todos os adolescentes","B) Educação sobre uso do cinto de segurança e capacete (lei), prevenção do uso de álcool ao dirigir, abordagem sobre violência de gênero e sexual, promoção de ambientes seguros, desenvolvimento de habilidades para a vida (resolução de conflitos, regulação emocional)","C) Internar preventivamente adolescentes em risco de acidentes","D) Aumentar o policiamento nas escolas como única medida de prevenção de violência","E) Retirar o celular dos adolescentes como medida de segurança"],"correta":1,"comentario":"PREVENÇÃO DE ACIDENTES E VIOLÊNCIAS EM ADOLESCENTES: acidentes e violências são a PRINCIPAL CAUSA DE MORTE em adolescentes e jovens no Brasil (75-80% dos óbitos). Causas: acidentes de trânsito (moto principal), homicídios, suicídios, afogamentos. Medidas eficazes: (1) USO DE CINTO DE SEGURANÇA E CAPACETE: obrigatório por lei — educação e enforcement; (2) NÃO BEBER E DIRIGIR (Lei Seca — Lei 11.705/2008); (3) PREVENÇÃO DE VIOLÊNCIA DE GÊNERO e violência interpessoal (abordagem nas escolas, PSE); (4) DESENVOLVIMENTO DE HABILIDADES PARA A VIDA (Life Skills): resolução de conflitos, comunicação assertiva, regulação emocional, pensamento crítico; (5) AMBIENTES SEGUROS: iluminação, espaços de lazer; (6) RASTREAMENTO E PREVENÇÃO DO SUICÍDIO. O PROGRAMA SAÚDE NA ESCOLA (PSE) articula saúde e educação para promoção da saúde integral do adolescente."},{"enunciado":"Sobre o PROSAD (Programa de Saúde do Adolescente) e a atenção à saúde do adolescente no SUS, qual afirmação está CORRETA?","alternativas":["A) O PROSAD foi criado em 2015 e foca apenas na gravidez na adolescência","B) O PROSAD (1989/MS) estabeleceu as bases para a atenção integral à saúde do adolescente no SUS; o Estatuto da Criança e do Adolescente (1990) garante direitos; o Programa Saúde na Escola (PSE, 2007) articula saúde e educação; a PNSCA (Política Nacional de Saúde da Criança e do Adolescente) orienta as ações atuais","C) O atendimento ao adolescente é exclusivamente hospitalar — não faz parte da APS","D) Adolescentes só podem ser atendidos por pediatras — o enfermeiro não atende adolescentes","E) O PROSAD é um programa exclusivo para adolescentes em situação de vulnerabilidade social"],"correta":1,"comentario":"MARCOS LEGAIS E PROGRAMÁTICOS DA SAÚDE DO ADOLESCENTE: PROSAD (1989): Programa de Saúde do Adolescente — 1ª política nacional específica; definiu ações prioritárias (crescimento e desenvolvimento, sexualidade, saúde mental, saúde bucal, prevenção de violência); ECA (Lei 8.069/1990): direitos fundamentais da criança e do adolescente — saúde, educação, proteção, participação; PNUD/ONU: Objetivos do Desenvolvimento Sustentável (ODS 3 — saúde e bem-estar); PSE (2007 — Decreto 6.286/2007): intersetorial saúde-educação para promoção da saúde na escola; PNSCA/MS: Política Nacional de Saúde da Criança e do Adolescente — abordagem integral. A ATENÇÃO PRIMÁRIA À SAÚDE é o espaço privilegiado para o cuidado do adolescente — longitudinalidade, vínculo, territorialidade. O ENFERMEIRO atende adolescentes e tem papel central na promoção da saúde, prevenção e rastreamento."},{"enunciado":"Sobre a Escala de Tanner para estadiamento puberal, qual afirmação está CORRETA?","alternativas":["A) A Escala de Tanner avalia apenas o desenvolvimento mamário em meninas","B) A Escala de Tanner avalia o desenvolvimento puberal em 5 estágios (G1-G5 em meninos: genitália; M1-M5 em meninas: mamas; P1-P5 em ambos: pelo pubiano); G1/M1/P1 = pré-puberal; G5/M5/P5 = adulto","C) Tanner G3 corresponde ao estágio adulto completo","D) A Escala de Tanner é utilizada apenas em casos de puberdade precoce","E) A avaliação de Tanner só pode ser realizada por médicos especialistas"],"correta":1,"comentario":"ESCALA DE TANNER (SMR — Sexual Maturity Rating): sistema de estadiamento do DESENVOLVIMENTO PUBERAL em 5 estágios. MENINOS: G1-G5 (genitália externa = tamanho do pênis e testículo) + P1-P5 (pelos pubianos). MENINAS: M1-M5 (desenvolvimento mamário) + P1-P5 (pelos pubianos). ESTÁGIOS: 1 = pré-puberal (infantil); 2 = início puberal (1ª evidência de desenvolvimento); 3 = desenvolvimento progressivo; 4 = desenvolvimento avançado; 5 = adulto completo. O ESTADIAMENTO DE TANNER: (1) identifica início e progressão da puberdade; (2) orienta expectativas de crescimento; (3) detecta puberdade precoce (M2 < 8 anos; G2 < 9 anos) ou retardada (sem M2 até 13 anos; sem G2 até 14 anos); (4) orienta vacinação HPV (preferencialmente antes do início sexual = Tanner 2-3). O enfermeiro realiza a avaliação de Tanner como parte da consulta de saúde do adolescente."},{"enunciado":"O enfermeiro recebe um adolescente de 14 anos que relata insatisfação corporal e está fazendo dieta restritiva por conta própria. Qual é a abordagem mais adequada?","alternativas":["A) Apoiar a dieta restritiva se o IMC do adolescente estiver acima do percentil 85","B) Explorar o motivo da insatisfação corporal, avaliar o IMC/Idade, rastrear sinais de transtorno alimentar, abordar a influência da mídia/redes sociais na imagem corporal, orientar sobre alimentação saudável SEM caráter de dieta, encaminhar para nutricionista e psicólogo se necessário","C) Prescrever suplementos proteicos para o adolescente que quer 'emagrecer com saúde'","D) Ignorar a dieta restritiva se o peso estiver normal","E) Informar os pais imediatamente sobre a dieta do filho sem o consentimento do adolescente"],"correta":1,"comentario":"INSATISFAÇÃO CORPORAL E DIETA RESTRITIVA NA ADOLESCÊNCIA: fator de risco para transtornos alimentares. 60-70% das adolescentes (e crescente em adolescentes do sexo masculino) referem insatisfação com o corpo. INFLUÊNCIAS: redes sociais, padrões estéticos irreais, cyberbullying estético. ABORDAGEM DO ENFERMEIRO: (1) ESCUTA ATIVA sem julgamento; (2) AVALIAR: IMC/Idade na Caderneta, padrão alimentar atual, comportamentos de risco (vômito autoprovocado, uso de laxantes, exercício compulsivo), humor, autoimagem; (3) RASTREAR TA: SCOFF screening; (4) EDUCAÇÃO sobre ALIMENTAÇÃO SAUDÁVEL (não 'dieta' — linguagem não pejorativa); (5) DESCONSTRUIR mitos de padrão estético; (6) ENCAMINHAR: nutricionista + psicólogo se indicado; (7) SIGILO: respeitar a confidencialidade; informar pais apenas se risco grave. Dieta restritiva sem supervisão pode precipitar TA em adolescentes vulneráveis."},{"enunciado":"Sobre a síndrome metabólica em adolescentes obesos, qual afirmação está CORRETA?","alternativas":["A) Síndrome metabólica não ocorre em adolescentes — é exclusiva de adultos","B) A obesidade infantojuvenil é uma epidemia crescente no Brasil; adolescentes obesos podem desenvolver síndrome metabólica (obesidade central + dislipidemia + hipertensão + alteração glicêmica); rastrear com medida da cintura, perfil lipídico, glicemia, PA; tratamento: mudança de estilo de vida (alimentação + atividade física) + suporte psicossocial","C) O tratamento farmacológico é a primeira linha para síndrome metabólica em adolescentes","D) A síndrome metabólica em adolescentes não aumenta o risco cardiovascular na vida adulta","E) IMC acima do percentil 85 confirma síndrome metabólica"],"correta":1,"comentario":"OBESIDADE INFANTOJUVENIL e SÍNDROME METABÓLICA: o Brasil tem 30% de adolescentes com excesso de peso (sobrepeso + obesidade). A obesidade precoce aumenta o risco de: DM tipo 2 (crescente em adolescentes), síndrome metabólica, hipertensão, dislipidemia, esteatose hepática (DHGNA), apneia do sono, problemas ortopédicos e psicossociais. SÍNDROME METABÓLICA em adolescentes (IDF para < 16 anos): obesidade central (circunferência abdominal ≥ P90 para idade/sexo) + 2 dos seguintes: TG ≥ 150, HDL baixo, PA elevada, glicemia ≥ 100. RASTREAMENTO: medir CIRCUNFERÊNCIA ABDOMINAL, pressão arterial, perfil lipídico, glicemia em adolescentes com sobrepeso/obesidade. TRATAMENTO: Mudança de estilo de vida é a 1ª linha (dieta qualitativa, ≥ 60 min/dia de atividade física, redução de telas); metformina em casos selecionados (resistência insulínica grave); cirurgia bariátrica em adolescentes ≥ 16 anos com obesidade grave refratária + comorbidades graves."},{"enunciado":"Sobre o sono na adolescência, qual afirmação está CORRETA?","alternativas":["A) Adolescentes precisam de menos sono que crianças — 6 horas é suficiente","B) Adolescentes precisam de 8-10 horas de sono por noite; têm naturalmente um atraso do ciclo circadiano (hormônio do sono é liberado mais tarde → sono tardio → dificuldade de acordar cedo); privação de sono associada a: menor desempenho acadêmico, depressão, obesidade, acidentes, uso de substâncias","C) O uso de telas antes de dormir não afeta a qualidade do sono dos adolescentes","D) Dormir até tarde nos finais de semana ('recuperar sono') resolve completamente a privação da semana","E) Sonolência diurna excessiva em adolescentes é sempre sinal de preguiça"],"correta":1,"comentario":"SONO NA ADOLESCÊNCIA: a puberdade causa um ATRASO FISIOLÓGICO do ciclo circadiano — a melatonina é secretada mais tarde (~23-24h) → adolescentes naturalmente dormem e acordam mais tarde. Necessidade: 8-10 HORAS/NOITE. CAUSAS DE PRIVAÇÃO DE SONO em adolescentes: horário escolar precoce (desalinhamento circadiano), uso de telas à noite (luz azul suprime melatonina), demandas acadêmicas e sociais. CONSEQUÊNCIAS da privação crônica: pior desempenho acadêmico e cognitivo, maior risco de DEPRESSÃO e ANSIEDADE, OBESIDADE (grelina↑, leptina↓), acidentes de trânsito (sonolência ao dirigir), maior consumo de substâncias (álcool, cafeína). 'Social jetlag': atraso de 2+ horas nos fins de semana — perpetua o desalinhamento. Orientações: higiene do sono (rotina regular, ambiente escuro e fresco, sem telas 1h antes de dormir), limitar cafeína à tarde."},{"enunciado":"Sobre a abordagem do adolescente na consulta de enfermagem, qual técnica de comunicação é mais eficaz para estabelecer vínculo?","alternativas":["A) Direcionar perguntas fechadas (sim/não) para obter informações rapidamente","B) Usar linguagem acessível (sem jargões técnicos), iniciar com temas gerais (escola, esportes, amigos) antes de assuntos delicados, fazer perguntas abertas, escuta ativa, validar sentimentos, não julgar, garantir sigilo explicitamente, promover a autonomia e a participação do adolescente nas decisões sobre sua saúde","C) Sempre ter um dos pais presente para garantir as informações corretas","D) Iniciar a consulta perguntando sobre uso de drogas e vida sexual","E) Usar linguagem técnica para demonstrar seriedade e profissionalismo"],"correta":1,"comentario":"COMUNICAÇÃO EFICAZ COM ADOLESCENTES — habilidades do enfermeiro: (1) LINGUAGEM ACESSÍVEL: adequar ao nível de compreensão, evitar jargões; usar a linguagem do adolescente; (2) PERGUNTAS ABERTAS: 'Como você se sente sobre...?' 'Me conta mais sobre...' — permitem respostas amplas; (3) ESCUTA ATIVA: contato visual, linguagem corporal receptiva, não interromper, refletir o que foi dito; (4) VALIDAÇÃO EMOCIONAL: 'Entendo que isso é difícil para você'; (5) SEM JULGAMENTOS: suspender avaliações morais; (6) CONFIDENCIALIDADE EXPLÍCITA: 'O que você falar aqui fica entre nós, exceto se...'; (7) INICIAR POR TEMAS NÃO AMEAÇADORES: escola, hobbies, amigos antes de saúde sexual/drogas (abordagem HEADSS: Home, Education, Activities, Drugs, Sexuality, Suicide/Safety); (8) PROMOVER AUTONOMIA: envolver o adolescente nas decisões. O VÍNCULO é a base do cuidado eficaz com adolescentes."},{"enunciado":"Sobre o suicídio e a automutilação na adolescência, qual abordagem do enfermeiro é mais adequada?","alternativas":["A) Evitar perguntar sobre suicídio pois a pergunta pode 'plantar a ideia'","B) Rastrear ativamente ideação suicida e automutilação; perguntar diretamente ('Você já pensou em se machucar ou em suicídio?') NÃO aumenta o risco; avaliar presença de plano, acesso a meios e intenção; acionar equipe e família se risco grave; manter vínculo; NÃO romper sigilo desnecessariamente antes de tentar resolver com o adolescente","C) Em qualquer relato de automutilação, hospitalizar imediatamente","D) Minimizar a automutilação — é comportamento de manipulação que não indica risco real","E) Informar imediatamente os pais sobre qualquer pensamento de automutilação sem avaliar o risco"],"correta":1,"comentario":"SUICÍDIO E AUTOMUTILAÇÃO NA ADOLESCÊNCIA: suicídio = 3ª causa de morte em adolescentes 10-19 anos no Brasil. Automutilação NÃO suicida (AMNS): cortes, queimaduras — mecanismo de regulação emocional, mas fator de risco para tentativa de suicídio. MITO: perguntar sobre suicídio aumenta o risco — FALSO (perguntar demonstra cuidado, alivia o peso do segredo e NÃO sugere a ideia). AVALIAÇÃO DE RISCO: (1) IDEAÇÃO: frequência, intensidade, duração; (2) PLANO: tem um plano específico? (3) ACESSO A MEIOS: tem acesso a arma, medicamentos? (4) INTENÇÃO: pretende agir? (5) HISTÓRIA de tentativas anteriores; (6) FATORES PROTETORES: família, vínculos. ALTA RISCO (plano + acesso + intenção): encaminhar URGENTEMENTE ao serviço especializado; comunicar família e equipe. CUIDADO: SIGILO pode ser quebrado para PROTEÇÃO DA VIDA — mas tentar envolver o adolescente primeiro. CVV: 188."},{"enunciado":"Sobre o impacto das redes sociais na saúde mental dos adolescentes, qual afirmação está CORRETA?","alternativas":["A) As redes sociais têm efeito exclusivamente positivo no desenvolvimento dos adolescentes","B) O uso excessivo de redes sociais está associado a: maior insatisfação corporal, depressão e ansiedade (exposição a padrões irreais, comparação social), cyberbullying, privação de sono (uso noturno), sedentarismo; o uso saudável (conexão social, aprendizagem, expressão criativa) pode ser benéfico; orientar sobre uso consciente e equilibrado","C) Redes sociais não afetam a saúde mental — os efeitos são apenas no desempenho acadêmico","D) Proibir totalmente as redes sociais é a estratégia mais eficaz para proteger a saúde dos adolescentes","E) Adolescentes são imunes aos efeitos negativos das redes sociais por serem nativos digitais"],"correta":1,"comentario":"REDES SOCIAIS E SAÚDE MENTAL DOS ADOLESCENTES — evidências: (1) INSATISFAÇÃO CORPORAL: exposição a imagens filtradas/editadas → comparação social → insatisfação + risco de TA; maior impacto em meninas; (2) DEPRESSÃO E ANSIEDADE: meta-análises mostram associação entre uso > 3h/dia e sintomas depressivos e ansiosos; (3) CYBERBULLYING: assédio, humilhação online — sem 'descanso' do agressor; (4) PRIVAÇÃO DE SONO: uso noturno; luz azul suprime melatonina; (5) FOMO (Fear of Missing Out): ansiedade por perder eventos sociais; (6) EFEITOS POSITIVOS: conexão social com pares (especialmente LGBTQIA+), aprendizagem, expressão criativa, ativismo. ABORDAGEM: MEDIA LITERACY (literacia midiática): ensinar a questionar a realidade das imagens; estabelecer limites de tempo e horário; promover atividades presenciais; aplicar 'digital detox' periódico."},{"enunciado":"Sobre a abordagem HEADSS na consulta de saúde do adolescente, o que cada letra representa?","alternativas":["A) Health, Eating, Autonomy, Drugs, Sleep, Study","B) Home (casa/família), Education/Employment (escola/trabalho), Activities (atividades/hobbies), Drugs (drogas/substâncias), Sexuality (sexualidade), Suicide/Safety (suicídio/segurança) — roteiro para anamnese psicossocial do adolescente","C) History, Examination, Assessment, Diagnosis, Surgery, Screening","D) Hygiene, Exercise, Alcohol, Diet, Sleep, Stress","E) HEADSS não é um instrumento validado para uso clínico"],"correta":1,"comentario":"HEADSS (ou HEEADSSS): roteiro estruturado para ANAMNESE PSICOSSOCIAL DO ADOLESCENTE — abordagem por temas progressivamente mais sensíveis: H = HOME (casa, família, com quem mora, conflitos familiares, violência doméstica); E = EDUCATION/EMPLOYMENT (escola, desempenho, evasão, trabalho); E = EATING (alimentação, imagem corporal, dietas, TA); A = ACTIVITIES (hobbies, esportes, amigos, uso de telas, violência nos grupos); D = DRUGS (álcool, tabaco, maconha, outras drogas — uso próprio e na família); S = SEXUALITY (vida sexual, orientação, identidade de gênero, IST, contracepção, gravidez); S = SUICIDE/SAFETY/SLEEP (ideação suicida, automutilação, acidentes, segurança, sono). Técnica: começar pelos temas MENOS SENSÍVEIS (home, school) e progredir para os mais sensíveis (drogas, sexualidade, suicídio). Garante abordagem HOLÍSTICA da saúde do adolescente. Validado e recomendado pela SBP e pela AAP."}]},{"id":"aidpi","nome":"AIDPI — Atenção Integrada às Doenças Prevalentes na Infância","senha":"aidpi@mod5","emoji":"🏥","questoes":[{"enunciado":"A AIDPI (Atenção Integrada às Doenças Prevalentes na Infância) é uma estratégia da OMS/UNICEF adotada pelo Brasil. Qual é o objetivo principal dessa estratégia?","alternativas":["A) Tratar exclusivamente a pneumonia bacteriana em crianças hospitalizadas","B) Reduzir a morbimortalidade infantil por meio de uma abordagem integrada que avalia, classifica e trata as principais causas de adoecimento e morte em crianças menores de 5 anos (pneumonia, diarreia, malária, desnutrição, sarampo), incluindo avaliação de sinais de perigo e orientação familiar","C) Realizar apenas a vacinação de crianças menores de 2 anos na Atenção Básica","D) Substituir o prontuário médico por um roteiro de triagem simplificado","E) Atender exclusivamente crianças com doenças graves em Unidades de Emergência"],"correta":1,"comentario":"AIDPI (Integrated Management of Childhood Illness — IMCI): estratégia desenvolvida pela OMS/UNICEF na década de 1990, adotada pelo MS do Brasil como protocolo para a Atenção Básica. Objetivo: reduzir mortalidade e morbidade em crianças < 5 anos. Abordagem: INTEGRADA (avalia múltiplos problemas na mesma consulta), ORIENTADA AO PROCESSO (roteiro estruturado: perguntar → examinar → classificar → tratar → orientar família). Cobre as principais causas de mortalidade infantil: pneumonia, diarreia (com/sem desidratação), febre (malária/sarampo/dengue), desnutrição, anemia, doenças do ouvido. Componentes: (1) melhoria das habilidades dos profissionais de saúde; (2) fortalecimento dos sistemas de saúde; (3) práticas familiares e comunitárias. O ENFERMEIRO tem papel central na aplicação da AIDPI na APS."},{"enunciado":"Na avaliação pela AIDPI, quais são os sinais de perigo geral que indicam necessidade de encaminhamento URGENTE ao hospital?","alternativas":["A) Febre acima de 37,5°C em qualquer criança menor de 5 anos","B) Não consegue beber ou mamar, vomita tudo que ingere, convulsiona na doença atual, letargia ou inconsciência — presença de qualquer um indica ENCAMINHAMENTO URGENTE","C) Tosse há mais de 7 dias e coriza","D) Diarreia há 3 dias sem sangue e sem sinais de desidratação","E) Peso abaixo do percentil 25 para a idade"],"correta":1,"comentario":"SINAIS DE PERIGO GERAL (AIDPI): avaliados em TODA criança que chega ao serviço de saúde, ANTES de qualquer outra avaliação. São 4: (1) NÃO CONSEGUE BEBER OU MAMAR: incapacidade de ingerir líquidos por fraqueza extrema; (2) VOMITA TUDO QUE INGERE: toda oferta oral é vomitada; (3) CONVULSIONA na doença atual; (4) LETARGIA OU INCONSCIÊNCIA: criança não responde normalmente ao ambiente. Qualquer um desses sinais = DOENÇA MUITO GRAVE → encaminhar URGENTEMENTE ao hospital com: primeira dose de antibiótico IM, tratamento de prevenção de hipoglicemia, manter aquecida. OUTROS sinais que indicam encaminhar urgente: rigidez de nuca, fontanela abaulada, petéquias, classificações como 'pneumonia grave', 'desidratação grave', 'doença febril muito grave'."},{"enunciado":"Na avaliação da tosse pela AIDPI, uma criança de 18 meses apresenta tosse há 4 dias, FR = 48 irpm, sem tiragem subcostal, sem estridor. Como deve ser classificada?","alternativas":["A) Pneumonia grave — encaminhar urgentemente ao hospital","B) Pneumonia (não grave) — FR elevada para a idade (≥ 50 irpm para 2-11 meses; ≥ 40 irpm para 12-59 meses): amoxicilina VO por 5 dias, reavaliação em 2 dias","C) Sem pneumonia — apenas tosse e coriza: orientar cuidados em casa","D) Pneumonia muito grave — iniciar oxigênio e encaminhar imediatamente","E) Bronquiolite — salbutamol inalatório e observação por 4 horas"],"correta":1,"comentario":"AVALIAÇÃO DA TOSSE/DIFICULDADE RESPIRATÓRIA (AIDPI): criança 12-59 meses, FR ≥ 40 irpm = TAQUIPNEIA (sinal mais sensível de pneumonia). CLASSIFICAÇÕES: PNEUMONIA GRAVE ou DOENÇA MUITO GRAVE: tiragem subcostal + sinais de perigo geral + estridor → encaminhar urgente + 1ª dose ATB IM; PNEUMONIA (não grave): taquipneia SEM tiragem → amoxicilina VO 40-50 mg/kg/dia por 5 dias + retorno em 2 dias; SEM PNEUMONIA (tosse ou resfriado): sem taquipneia, sem tiragem → cuidados em casa (fluido oral, limpar nariz, retornar se piora). Limites de FR por idade: < 2 meses: ≥ 60; 2-11 meses: ≥ 50; 12-59 meses: ≥ 40 irpm. A FR deve ser contada por 1 MINUTO COMPLETO com a criança em REPOUSO."},{"enunciado":"Na avaliação da diarreia pela AIDPI, uma criança de 2 anos apresenta diarreia há 5 dias, olhos fundos, bebe com ânsia, sinal da prega cutânea com retorno lento (2-3 segundos). Qual a classificação e conduta?","alternativas":["A) Sem desidratação — orientar líquidos em casa","B) DESIDRATAÇÃO — Plano B: SRO 75 mL/kg em 4 horas no serviço de saúde, reavaliar após reidratação","C) Desidratação grave — soro EV imediato (ringer lactato 100 mL/kg em 3h) e encaminhar","D) Diarreia com sangue — metronidazol VO imediato","E) Diarreia persistente grave — internação hospitalar"],"correta":1,"comentario":"AVALIAÇÃO DA DESIDRATAÇÃO (AIDPI): SEM DESIDRATAÇÃO: sem sinais/2 ou mais sinais ausentes → Plano A (casa); DESIDRATAÇÃO (2+ sinais): olhos fundos + bebe com ânsia/com dificuldade + sinal da prega (2-3s) → PLANO B no serviço; DESIDRATAÇÃO GRAVE (2+ sinais intensos): olhos muito fundos + não consegue beber/bebe mal + prega ≥ 3s → PLANO C (EV). A criança do enunciado tem: olhos fundos + bebe com ânsia + prega 2-3s = DESIDRATAÇÃO (algum grau). PLANO B: SRO 75 mL/kg em 4h no serviço, reavaliar continuamente, zincoterapia (10-20 mg/dia por 10-14 dias — reduz duração e recorrência), continuar alimentação. SINAL DA PREGA: pellicar pele no abdome — retorno < 2s = normal; 2-3s = desidratação; ≥ 3s = grave. DIARREIA COM SANGUE (disenteria): investigar Shigella → cotrimoxazol."},{"enunciado":"Segundo a AIDPI, uma criança de 8 meses apresenta febre há 3 dias sem fonte óbvia, sem rigidez de nuca, sem erupção cutânea, sem sinais de malária. Como deve ser classificada?","alternativas":["A) Febre — malária, se não há teste disponível tratar como malária","B) DOENÇA FEBRIL — avaliar possível foco bacteriano (otite, IVU, pneumonia, meningite); se sem foco identificado e ≥ 7 dias de febre ou entre 5-7 dias: encaminhar para avaliação; < 5 dias sem foco e sem sinais de perigo: orientar cuidados e retorno se piora","C) Sarampo — notificar e isolar imediatamente","D) Febre sem causa — indicar antitérmico e alta sem retorno programado","E) Dengue — solicitar NS1 e hemograma imediatamente"],"correta":1,"comentario":"AVALIAÇÃO DA FEBRE (AIDPI): perguntar há quanto tempo dura, verificar sinais de PERIGO GERAL, rigidez de nuca, erupções cutâneas. CLASSIFICAÇÕES: DOENÇA FEBRIL MUITO GRAVE: sinais de perigo geral OU rigidez de nuca → encaminhar urgente; SARAMPO COMPLICADO: erupção + olhos vermelhos + complicação; DENGUE: sinais de alerta (dor abdominal, vômito persistente, sangramento); FEBRE PROVÁVEL DE MALÁRIA: região endêmica. Em área SEM malária e SEM sinais de perigo: febre < 5 dias sem foco → orientar retorno se piora; febre ≥ 7 dias → encaminhar para investigação; febre 5-7 dias → avaliar individualmente. Para crianças < 3 MESES: qualquer temperatura ≥ 38°C = potencialmente grave → encaminhar (sepse neonatal tardia)."},{"enunciado":"Na avaliação nutricional pela AIDPI, uma criança de 3 anos apresenta peso/estatura < Z-3, edema bilateral de tornozelos e cabelos despigmentados. Qual classificação e conduta?","alternativas":["A) Desnutrição leve — orientar alimentação em casa e retornar em 1 mês","B) DESNUTRIÇÃO GRAVE (kwashiorkor/marasmo-kwashiorkor) com edema nutricional — encaminhar URGENTEMENTE ao hospital para tratamento intensivo com protocolo OMS (F-75, F-100/ATPU, micronutrientes, tratamento de infecções)","C) Baixo peso esperado — criança de família de baixa estatura","D) Desnutrição moderada — suplementar vitamina D e ferro ambulatorialmente","E) Síndrome nefrótica — encaminhar ao nefrologista"],"correta":1,"comentario":"AVALIAÇÃO NUTRICIONAL (AIDPI): DESNUTRIÇÃO GRAVE: P/E < Z-3 OU PB < 11,5 cm OU EDEMA BILATERAL nutricional → ENCAMINHAR URGENTEMENTE ao hospital (risco de morte). Kwashiorkor: edema bilateral + cabelo despigmentado/quebradiço (sinal de 'bandeira'), pele descamativa, face de 'lua cheia', irritabilidade, anorexia. Marasmo: emaciação grave sem edema (criança parece 'pele e osso'). Tratamento hospitalar: protocolo 10 passos OMS — fase de estabilização (F-75 + tratar hipoglicemia, hipotermia, desidratação, infecção + micronutrientes sem ferro na 1ª fase) → fase de reabilitação (F-100 ou ATPU). DESNUTRIÇÃO MODERADA: P/E Z-2 a Z-3 OU PB 11,5-12,5 cm → tratamento ambulatorial com ATPU (Alimento Terapêutico Pronto para Uso) se disponível. ANEMIA: verificar conjuntivas e palmar → amarelo-pálidas = anemia → sulfato ferroso."},{"enunciado":"Sobre a avaliação do ouvido pela AIDPI, uma criança de 4 anos relata dor de ouvido há 2 dias e ao exame apresenta secreção purulenta no conduto auditivo externo. Como deve ser classificada e tratada?","alternativas":["A) Otite externa — lavar o ouvido com água oxigenada","B) OTITE MÉDIA AGUDA COM PERFURAÇÃO — amoxicilina VO por 5-7 dias, gotas de álcool boricado no ouvido, retorno em 5 dias","C) Mastoidite — encaminhar urgente para cirurgia","D) Corpo estranho no ouvido — remoção imediata","E) Infecção viral — analgésico apenas, sem antibiótico"],"correta":1,"comentario":"AVALIAÇÃO DO OUVIDO (AIDPI): perguntar: dor de ouvido, secreção no ouvido, dificuldade para ouvir. CLASSIFICAÇÕES: MASTOIDITE: edema e dor atrás do ouvido → URGENTE (complicação grave); OTITE MÉDIA AGUDA (OMA): dor + membrana hiperemiada/abaulada (sem perfuração) → amoxicilina 5-7 dias; OTITE MÉDIA COM PERFURAÇÃO: secreção purulenta no conduto por < 2 semanas → amoxicilina + gotas de álcool boricado (nunca amino-glicosídeo em OMP — risco de ototoxicidade); OTITE MÉDIA CRÔNICA: secreção > 2 semanas → encaminhar ORL + gotas de álcool boricado; SEM OTITE: nenhum tratamento. O enfermeiro realiza otoscopia para avaliar a membrana timpânica e classifica conforme a AIDPI. ANALGESIA (paracetamol ou ibuprofeno) em todas as formas de otite com dor."},{"enunciado":"Na AIDPI, qual é a orientação correta para cuidados em casa (Plano A) em criança com diarreia SEM desidratação?","alternativas":["A) Suspender a alimentação por 24 horas e oferecer apenas água","B) Oferecer mais líquidos que o habitual (SRO após cada evacuação: < 2 anos: 50-100 mL; 2-5 anos: 100-200 mL), manter alimentação habitual, dar zinco por 10-14 dias, e sinais de retorno (piora, sangue nas fezes, recusa alimentar, muito cansada)","C) Administrar antibiótico em toda diarreia, independente da causa","D) Oferecer refrigerante gelado para repor eletrólitos e energia","E) Aplicar injeção antidiarreica e limitar a 1 refeição por dia"],"correta":1,"comentario":"PLANO A — Diarreia SEM desidratação (cuidados em casa): (1) MAIS LÍQUIDOS que o habitual: SRO caseiro ou industrializado após CADA evacuação — < 2 anos: 50-100 mL; 2-5 anos: 100-200 mL; (2) MANTER ALIMENTAÇÃO: não suspender alimentos — a dieta normal reduz a duração da diarreia e previne desnutrição; aleitamento materno deve ser mantido; (3) ZINCO: 10 mg/dia (< 6 meses) ou 20 mg/dia (≥ 6 meses) por 10-14 dias — reduz duração e severidade + previne episódios futuros por 2-3 meses; (4) SINAIS DE RETORNO imediato: piora da diarreia, sangue nas fezes, vômitos repetidos, sede intensa, recusa alimentar, muito cansada/letárgica. ANTIBIÓTICO: APENAS para disenteria (diarreia com sangue → Shigella → cotrimoxazol ou azitromicina) ou cólera suspeita. Antidiarreicos (loperamida): CONTRAINDICADOS em crianças < 5 anos."},{"enunciado":"Sobre a classificação do estado nutricional pela AIDPI utilizando o Perímetro Braquial Médio (PBM), qual valor indica DESNUTRIÇÃO AGUDA GRAVE?","alternativas":["A) PBM < 15 cm — grave risco nutricional","B) PBM < 11,5 cm (vermelho na fita MUAC) — desnutrição aguda grave; 11,5-12,5 cm (amarelo) — desnutrição aguda moderada; > 12,5 cm (verde) — risco aceitável","C) PBM < 13 cm indica desnutrição aguda grave em crianças de qualquer idade","D) O PBM não é utilizado pela AIDPI — apenas peso/estatura é avaliado","E) PBM < 10 cm indica apenas baixo peso — não é critério de encaminhamento"],"correta":1,"comentario":"PERÍMETRO BRAQUIAL MÉDIO (PBM / MUAC — Middle Upper Arm Circumference): medida do perímetro no ponto médio entre o olécrano e o acrômio do braço esquerdo. Usada em triagens pela AIDPI e em emergências nutricionais. INTERPRETAÇÃO (6-59 meses): VERDE (≥ 12,5 cm): risco nutricional aceitável; AMARELO (11,5-12,5 cm): desnutrição aguda MODERADA → ATPU ambulatorial; VERMELHO (< 11,5 cm): desnutrição aguda GRAVE → encaminhar urgente para hospital. Vantagens do PBM: fita barata, fácil de usar, não requer conhecimento da idade, não depende de balança. Usado pela AIDPI comunitária, agentes de saúde e em situações de emergência humanitária. A fita MUAC tricolor é padrão da OMS/UNICEF. Em < 6 meses: PBM < 11 cm = grave."},{"enunciado":"Uma criança de 2 anos, trazida à UBS com tosse e febre há 2 dias. Na avaliação pela AIDPI, o enfermeiro conta FR = 35 irpm e observa tiragem subcostal. Qual é a classificação correta?","alternativas":["A) Sem pneumonia — FR dentro do normal para a idade","B) Pneumonia — apenas FR elevada, sem tiragem","C) PNEUMONIA GRAVE — tiragem subcostal + FR borderline: encaminhar ao hospital com 1ª dose de antibiótico IM (amoxicilina ou ampicilina) e oxigênio se SpO2 < 90%","D) Bronquite — salbutamol inalatório e retorno em 3 dias","E) Resfriado comum — apenas antitérmico e hidratação"],"correta":2,"comentario":"AVALIAÇÃO DA TOSSE e DIFICULDADE RESPIRATÓRIA (AIDPI) em criança de 12-59 meses: FR ≥ 40 irpm = taquipneia (criança de 2 anos: FR normal até 39 irpm). TIRAGEM SUBCOSTAL: retração do gradeado costal inferior durante a INSPIRAÇÃO — sinal de ESFORÇO RESPIRATÓRIO IMPORTANTE. CLASSIFICAÇÃO: PNEUMONIA GRAVE (ou DOENÇA MUITO GRAVE): tiragem subcostal OU estridor em repouso OU sinais de perigo → ENCAMINHAR URGENTE ao hospital + 1ª dose de antibiótico IM antes de transferir + O2 se SpO2 < 90% ou cianose. PNEUMONIA (não grave): taquipneia SEM tiragem. A criança do caso: FR = 35 irpm (NORMAL para 12-59 meses = < 40 irpm) MAS tem TIRAGEM SUBCOSTAL → PNEUMONIA GRAVE (a tiragem por si só classifica como grave, independente da FR). ANTIBIÓTICO IM: amoxicilina + ácido clavulânico IM OU ampicilina IM antes da transferência."},{"enunciado":"Na avaliação da criança jovem (0-2 meses) pela AIDPI Neonatal, qual sinal indica DOENÇA BACTERIANA GRAVE?","alternativas":["A) Choro mais intenso que o habitual em recém-nascido de 4 semanas","B) Convulsão, respiração rápida (≥ 60 irpm), tiragem subcostal grave, fontanela abaulada, febre (≥ 38°C) OU hipotermia (< 35,5°C), letargia ou inconsciência, pústulas extensas, olhos com secreção purulenta intensa — qualquer sinal = DOENÇA BACTERIANA GRAVE → encaminhar urgente","C) Icterícia leve nas primeiras 48h de vida — normal nessa faixa etária","D) Fezes amareladas e pastosas em lactente de 30 dias em AME","E) Regurgitação pós-mamada em RN de 2 semanas"],"correta":1,"comentario":"AIDPI NEONATAL (0-2 meses) — sinais de DOENÇA BACTERIANA GRAVE (DBG): (1) CONVULSÃO; (2) RESPIRAÇÃO RÁPIDA: ≥ 60 irpm (< 2 meses); (3) TIRAGEM SUBCOSTAL GRAVE; (4) GEMÊNCIA (sons de sofrimento); (5) FONTANELA ABAULADA; (6) FEBRE ≥ 38°C OU HIPOTERMIA < 35,5°C; (7) LETARGIA OU INCONSCIÊNCIA; (8) MUITAS PÚSTULAS CUTÂNEAS ou pústulas profundas; (9) ONFALITE com eritema periumbilical; (10) SECREÇÃO PURULENTA INTENSA nos olhos. Qualquer sinal = DBG → ENCAMINHAR URGENTE ao hospital + iniciar antibiótico IM antes de transferir (ampicilina + gentamicina). A avaliação do RN e lactente jovem exige VIGILÂNCIA MÁXIMA — infecções progridem rapidamente para sepse fatal. O critério de taquipneia em < 2 meses é DIFERENTE: ≥ 60 irpm (não 50 como em 2-11 meses)."},{"enunciado":"Sobre a dengue na avaliação pela AIDPI, quais são os sinais de alerta que indicam a necessidade de hidratação venosa e observação hospitalar?","alternativas":["A) Febre há 2 dias sem outros sintomas","B) Dor abdominal intensa e contínua, vômitos persistentes, sangramento espontâneo (petéquias, gengivorragia), hipotensão postural, hepatomegalia dolorosa, aumento do hematócrito com queda abrupta de plaquetas — DENGUE COM SINAIS DE ALERTA → Grupo C: hidratação EV + observação hospitalar","C) Cefaleia e mialgia sem febre — sinais clássicos de dengue grave","D) Febre há 7 dias com prostração leve — classificar como dengue sem alerta","E) Qualquer caso de dengue confirmado exige internação em UTI"],"correta":1,"comentario":"CLASSIFICAÇÃO DA DENGUE (MS 2016 / AIDPI adaptada): GRUPO A — dengue sem sinais de alerta: ambulatorial, hidratação oral, analgésico (paracetamol ou dipirona — NUNCA AAS/AINE pelo risco de sangramento); GRUPO B — dengue sem sinais de alerta + condição especial (gestantes, < 2 anos, > 65 anos, comorbidades): hidratação EV supervisionada; GRUPO C — dengue COM SINAIS DE ALERTA: dor abdominal intensa, vômitos persistentes, acúmulo de líquidos (ascite, pleura), sangramento espontâneo, letargia, hipotensão/tonturas, hepatomegalia dolorosa, aumento do hematócrito com queda de plaquetas → HIDRATAÇÃO EV + INTERNAÇÃO HOSPITALAR; GRUPO D — dengue GRAVE (choque, hemorragia grave, comprometimento grave de órgão): UTI. DENGUE + CRIANÇAS: especialmente perigosa — pode progredir rapidamente para choque. Monitorar hematócrito seriado."},{"enunciado":"Sobre o tratamento com antibiótico oral na AIDPI para pneumonia não grave, qual medicamento e esquema estão CORRETOS?","alternativas":["A) Azitromicina 10 mg/kg/dia por 3 dias — dose única diária","B) AMOXICILINA 40-50 mg/kg/dia dividida em 2 doses por 5 dias — tratamento de escolha para pneumonia comunitária não grave em < 5 anos","C) Ampicilina EV por 7 dias em qualquer pneumonia","D) Metronidazol 30 mg/kg/dia — cobertura para anaeróbios em pneumonia","E) Cefalexina 25 mg/kg/dia por 10 dias — melhor cobertura para Streptococcus"],"correta":1,"comentario":"TRATAMENTO DE PNEUMONIA NÃO GRAVE (AIDPI): AMOXICILINA 40-50 mg/kg/dia, dividida em 2 doses por DIA (12/12h), por 5 DIAS — tratamento de escolha. Justificativa: S. pneumoniae é o principal agente de pneumonia bacteriana em < 5 anos; amoxicilina tem excelente cobertura, é oral, barata e de fácil administração. Esquema alternativo (alergia à penicilina): azitromicina ou cotrimoxazol. RETORNO EM 2 DIAS para reavaliação. Sinais de falha terapêutica (retorno em 2 dias): manutenção ou piora da febre, piora da FR, sem melhora clínica → reclassificar (considerar pneumonia grave, resistência bacteriana, diagnóstico alternativo). PNEUMONIA GRAVE: ampicilina IM + gentamicina IM antes de encaminhar. Mycoplasma pneumoniae (causa pneumonia atípica em > 5 anos): azitromicina ou claritromicina (macrolídeos)."},{"enunciado":"Na AIDPI, como deve ser avaliada a criança que retorna para consulta de acompanhamento após 2 dias de tratamento de pneumonia com amoxicilina?","alternativas":["A) Considerar o tratamento bem-sucedido sem avaliação clínica se a mãe relata melhora","B) Reavaliação clínica completa: FR, sinais de perigo, febre, alimentação; SE MELHOROU (FR normal, sem febre, come bem): completar os 5 dias de amoxicilina; SE PIOROU ou NÃO MELHOROU: reclassificar como pneumonia grave e encaminhar ao hospital","C) Trocar antibiótico para azitromicina independentemente da evolução","D) Internação hospitalar de rotina após 2 dias de tratamento ambulatorial","E) Repetir RX de tórax para confirmar a resolução antes de continuar o antibiótico"],"correta":1,"comentario":"CONSULTA DE RETORNO (AIDPI) — PNEUMONIA APÓS 2 DIAS: avaliação clínica estruturada: (1) VERIFICAR SINAIS DE PERIGO GERAL; (2) MEDIR A FR (contar por 1 min completo em repouso); (3) VERIFICAR FEBRE; (4) AVALIAR ALIMENTAÇÃO. SE MELHOROU (melhora da FR, afebril, come bem): COMPLETAR os 5 dias de amoxicilina. SE NÃO MELHOROU ou PIOROU: RECLASSIFICAR — se agora tiver tiragem subcostal ou sinais de perigo = PNEUMONIA GRAVE → ENCAMINHAR URGENTE ao hospital. O retorno em 2 dias é fundamental para identificar precocemente falha terapêutica e evitar mortalidade. Outros retornos programados: diarreia com desidratação (2 dias), diarreia persistente (5 dias), otite (5 dias), desnutrição (30 dias). RETORNO IMEDIATO: qualquer sinal de perigo geral, dificuldade respiratória ou piora clínica."},{"enunciado":"Sobre as orientações à família na AIDPI, o que deve ser ensinado para identificar a necessidade de retorno IMEDIATO ao serviço de saúde?","alternativas":["A) Retornar apenas quando a criança tiver febre acima de 39°C","B) Retornar imediatamente se: não consegue beber ou mamar, piora do estado geral, desenvolvimento de febre OU a febre não baixa, dificuldade para respirar, sangue nas fezes — além dos sinais específicos do problema da visita","C) Retornar somente após completar o curso completo do antibiótico","D) Não é necessário orientar sobre sinais de retorno — a mãe saberá quando procurar o serviço","E) Retornar apenas se a criança não melhorar em 10 dias"],"correta":1,"comentario":"ORIENTAÇÃO PARA RETORNO IMEDIATO (AIDPI) — SINAIS DE PERIGO que a família deve reconhecer: GERAIS: não consegue beber ou mamar, vomita tudo que ingere, convulsão, muito sonolenta ou difícil de acordar. ESPECÍFICOS: FEBRE: criança piora + febre ou febre por > 2 dias sem melhora, manchas vermelhas na pele. DIARREIA: sangue nas fezes, piora da diarreia, muita sede. TOSSE/PNEUMONIA: respiração difícil ou rápida. A ORIENTAÇÃO FAMILIAR é um dos 3 componentes da AIDPI — o cuidador é o principal agente de identificação precoce de agravamento. Deve-se ensinar: (1) quando retornar imediatamente, (2) quando retornar para consulta de acompanhamento (data marcada), (3) como dar os medicamentos em casa, (4) como alimentar e oferecer líquidos. A comunicação eficaz com a família é tão importante quanto o tratamento correto."},{"enunciado":"Sobre a avaliação do estado de hidratação pela AIDPI, qual técnica de realização do sinal da prega cutânea está CORRETA?","alternativas":["A) Realizar o sinal da prega na face interna da coxa e observar por 5 segundos","B) Pellicionar a pele do ABDOME (linha umbilical lateral) com os dedos polegar e indicador, levantar por 1 segundo e soltar, avaliar o tempo de retorno: < 2 segundos = normal; 2-3 segundos = desidratação; ≥ 3 segundos = desidratação grave","C) Realizar o sinal na face dorsal da mão — mais sensível para detectar desidratação","D) O sinal da prega é realizado apenas quando a criança está claramente desidratada","E) Pellicionar a pele por 30 segundos para aumentar a sensibilidade do sinal"],"correta":1,"comentario":"SINAL DA PREGA CUTÂNEA (teste de turgor cutâneo): avaliação da hidratação na AIDPI. TÉCNICA: pellicionar a pele do ABDOME (entre a cicatriz umbilical e a linha lateral do abdome) entre os dedos polegar e indicador, LEVANTANDO (não apenas comprimindo), por 1 segundo e SOLTANDO. Observar o tempo de retorno: NORMAL (< 2 segundos): tecido elástico, hidratado; DESIDRATAÇÃO (2-3 segundos): prega some lentamente; DESIDRATAÇÃO GRAVE (≥ 3 segundos): prega some muito lentamente ou persiste. LIMITAÇÕES: pode ser normal em crianças obesas (falso negativo) e prolongado em desnutridas (falso positivo — pele perdeu elasticidade por falta de proteínas). Outros sinais de desidratação: olhos fundos, bebe com ânsia/mal/não consegue, boca seca, choro sem lágrimas, fontanela deprimida, diminuição do turgor. O sinal da prega DEVE ser avaliado em TODAS as crianças com diarreia."},{"enunciado":"A AIDPI é aplicada em crianças de qual faixa etária e quais são os dois momentos de avaliação distintos no protocolo?","alternativas":["A) Apenas crianças de 2 a 5 anos, em um único protocolo universal","B) AIDPI abrange: crianças de 0 a 2 MESES (AIDPI Neonatal — avaliação específica para RN e lactente jovem com critérios diferentes) e crianças de 2 MESES a 5 ANOS (protocolo padrão); cada faixa tem critérios diagnósticos e limites fisiológicos próprios (ex: FR: ≥ 60 para < 2m; ≥ 50 para 2-11m; ≥ 40 para 12-59m)","C) AIDPI é aplicada apenas a partir dos 6 meses de vida","D) AIDPI abrange até os 10 anos de vida sem distinção por faixa etária","E) A AIDPI neonatal é a mesma que a de crianças maiores — apenas a dose dos medicamentos muda"],"correta":1,"comentario":"AIDPI — FAIXAS ETÁRIAS: o protocolo divide as crianças em 2 grupos com avaliação DISTINTA: (1) 0-2 MESES (AIDPI NEONATAL / jovem infante): avaliação de doença bacteriana grave, icterícia, peso, problemas de alimentação (amamentação), infecções locais (onfalite, pústulas, olhos). Critérios fisiológicos diferentes: FR ≥ 60 = taquipneia grave (< 2m). (2) 2 MESES a 5 ANOS: protocolo PADRÃO — avalia tosse/dificuldade respiratória, diarreia, febre, ouvido, nutrição. FR por faixa: 2-11m: ≥ 50 irpm; 12-59m: ≥ 40 irpm. A diferenciação é FUNDAMENTAL pois neonatos têm apresentações atípicas de doenças graves, imunidade imaturo e risco muito maior de sepse fulminante. A AIDPI NEONATAL é particularmente relevante para o componente domiciliar (visita de ACS) para detectar precocemente doença bacteriana grave no RN."},{"enunciado":"O enfermeiro aplica a AIDPI em uma criança de 3 anos com diarreia há 10 dias. Como deve ser classificada essa diarreia?","alternativas":["A) Diarreia aguda — tratar com SRO e zinco","B) DIARREIA PERSISTENTE (≥ 14 dias): se grave (com desidratação) → encaminhar urgente; se sem desidratação → encaminhar para avaliação (risco de desnutrição, investigar causas — parasitoses, doença celíaca, intolerância à lactose pós-infecciosa)","C) Diarreia crônica — tratar com metronidazol empírico por 7 dias","D) Diarreia com sangue — cotrimoxazol sem necessidade de encaminhamento","E) Diarreia por rotavírus — vacina imediatamente"],"correta":1,"comentario":"CLASSIFICAÇÃO DA DIARREIA POR DURAÇÃO (AIDPI): DIARREIA AGUDA: < 14 dias (maioria — viral autolimitada). DIARREIA PERSISTENTE: ≥ 14 dias (10 dias ainda não alcança 14 dias — MAS a AIDPI avalia a tendência). Na questão: 10 dias é longa duração — avaliar se está evoluindo para persistente. DIARREIA PERSISTENTE GRAVE: ≥ 14 dias + desidratação → ENCAMINHAR URGENTE. DIARREIA PERSISTENTE (sem desidratação): ≥ 14 dias → encaminhar para avaliação (risco de desnutrição por má absorção). CAUSAS: parasitoses (Giardia, Cryptosporidium), bacteriana (Salmonella, E. coli), intolerância à lactose pós-infecciosa (transitória), doença celíaca, síndrome do intestino irritável pós-infecciosa. TRATAMENTO: reposição nutricional, evitar lactose temporariamente, metronidazol só se Giardia ou ameba confirmada. O MS recomenda suplementação de vitamina A em crianças com diarreia persistente."},{"enunciado":"Sobre a malária na avaliação pela AIDPI, qual afirmação está CORRETA?","alternativas":["A) A malária deve ser investigada em todas as crianças com febre no Brasil","B) A malária é investigada APENAS em crianças provenientes de ou que residem em áreas endêmicas (Amazônia Legal — estados: AM, PA, RO, AC, RR, AP, MT, MA, TO); confirmação por gota espessa ou teste rápido antes de tratar; MALÁRIA GRAVE: alteração de consciência, convulsões, anemia grave → internação","C) O tratamento empírico para malária pode ser iniciado sem confirmação laboratorial em qualquer criança febril","D) A malária por P. falciparum não causa malária grave em crianças","E) Cloroquina é o tratamento de escolha para P. falciparum no Brasil"],"correta":1,"comentario":"MALÁRIA (AIDPI): endêmica na AMAZÔNIA LEGAL (representa > 99% dos casos do Brasil). AVALIAÇÃO: toda criança com febre proveniente de área endêmica ou que viajou para área endêmica. DIAGNÓSTICO: GOTA ESPESSA (padrão-ouro) ou TESTE RÁPIDO (antígeno). CLASSIFICAÇÃO: MALÁRIA GRAVE: alteração de consciência, convulsões, respiração difícil, anemia grave (palidez palmar grave), incapacidade de beber → ENCAMINHAR URGENTE + artesunato EV (P. falciparum grave); MALÁRIA COMPLICADA: classificações intermediárias; MALÁRIA SEM COMPLICAÇÃO: tratar ambulatorialmente. TRATAMENTO (MS/SVSA 2024): P. vivax: cloroquina 3 dias + primaquina 7-14 dias; P. falciparum: artemeter-lumefantrina OU artesunato + doxiciclina/clindamicina (primaquina dose única para gametócitos). PREVENÇÃO: repelentes, mosquiteiros impregnados, diagnóstico precoce."},{"enunciado":"Sobre as Práticas Familiares e Comunitárias (PFC) no contexto da AIDPI, qual prática é considerada de ALTO IMPACTO na redução da mortalidade infantil?","alternativas":["A) Uso de chás caseiros para tratar diarreias e febres","B) Aleitamento materno exclusivo até 6 meses, lavagem das mãos nos momentos críticos (antes de preparar alimentos, antes de alimentar a criança, após usar o banheiro/trocar fraldas), uso adequado de mosquiteiros impregnados em área endêmica de malária, vacinação em dia e tratamento adequado de doenças","C) Uso de purgantes para eliminar 'mau olhado' em crianças com diarreia","D) Aplicação de pomadas nas fontanelas para estimular o desenvolvimento cerebral","E) Restrição de líquidos em crianças com febre para evitar convulsão febril"],"correta":1,"comentario":"PRÁTICAS FAMILIARES E COMUNITÁRIAS (PFC) — componente da AIDPI: 16 práticas chave identificadas pela OMS que, se universalizadas, poderiam prevenir 2/3 das mortes de crianças < 5 anos. ALTO IMPACTO: (1) AME até 6 meses → reduz 13% da mortalidade infantil global; (2) LAVAGEM DAS MÃOS com água e sabão: reduz diarreia em 48%, pneumonia em 23%; (3) VACINAÇÃO: cobertura ≥ 90% previne surtos; (4) MOSQUITEIRO IMPREGNADO: reduz malária grave em 50%; (5) Uso de SRO e zinco; (6) Reconhecer sinais de perigo e buscar cuidado imediato; (7) Prevenir lesões e acidentes. O ENFERMEIRO E O ACS realizam educação em saúde sobre as PFC em visitas domiciliares, grupos educativos e consultas. Crenças populares (chás, purgantes, pomadas na fontanela) podem atrasar o tratamento adequado — abordar sem julgamento."},{"enunciado":"Na avaliação pela AIDPI, uma criança de 9 meses é trazida com olhos vermelhos há 4 dias, presença de manchas brancas na boca (aftas extensas) e erupção generalizada que começa a escurecer. Qual diagnóstico deve ser considerado?","alternativas":["A) Varicela — tratar com aciclovir e isolar","B) SARAMPO — exantema maculopapular + febre + tosse/coriza/conjuntivite; as manchas de Koplik (brancas na mucosa oral) são patognomônicas; notificação compulsória imediata; avaliar complicações (pneumonia, diarreia grave, encefalite)","C) Rubéola — erupção rosada típica sem comprometimento ocular","D) Escarlatina — erupção eritematosa com língua em framboesa","E) Dengue — exantema sem manchas orais típicas"],"correta":1,"comentario":"SARAMPO (AIDPI): exantema maculopapular + febre + tosse + coriza + CONJUNTIVITE (3C: coryza, cough, conjunctivitis) + MANCHAS DE KOPLIK (manchas brancas na mucosa oral = PATOGNOMÔNICAS, aparecem antes do exantema). Exantema: começa na face → dissemina cefalocaudalmente → 'escurece' (mancha de sarampo). CLASSIFICAÇÃO AIDPI: SARAMPO COM COMPLICAÇÃO GRAVE: opalescência da córnea, pústulas extensas, coma → encaminhar urgente; SARAMPO COM COMPLICAÇÃO: boca com úlceras, diarreia, otite, pneumonia → vitamina A + tratar complicação; SARAMPO SEM COMPLICAÇÃO: vitamina A, cuidados em casa. NOTIFICAÇÃO COMPULSÓRIA IMEDIATA (doença eliminada no BR — qualquer caso suspeito notificar em 24h). VITAMINA A: reduz mortalidade em 50% → 100.000 UI (< 12m) ou 200.000 UI (> 12m), 2 doses. Prevenção: vacina MMR (tríplice viral) aos 12 e 15 meses."},{"enunciado":"Sobre a avaliação do peso e crescimento pela AIDPI, qual conduta está CORRETA para uma criança de 18 meses com peso para estatura entre Z-2 e Z-3 (desnutrição moderada) sem edema?","alternativas":["A) Iniciar tratamento hospitalar com fórmula F-75 imediatamente","B) DESNUTRIÇÃO AGUDA MODERADA: tratar ambulatorialmente com ATPU (Alimento Terapêutico Pronto para Uso — pasta de amendoim enriquecida, se disponível) OU orientação nutricional intensiva, tratar doenças concomitantes, suplementar vitamina A e zinco, retorno em 30 dias para avaliação do ganho de peso","C) Aguardar 6 meses para reavaliação — a criança pode melhorar espontaneamente","D) Iniciar nutrição parenteral total ambulatorial","E) Hospitalizar apenas se a criança apresentar edema bilateral"],"correta":1,"comentario":"DESNUTRIÇÃO AGUDA MODERADA (DAM) — AIDPI: P/E entre Z-2 e Z-3 OU PBM 11,5-12,5 cm (amarelo) + SEM edema bilateral. TRATAMENTO AMBULATORIAL: (1) ATPU (Alimento Terapêutico Pronto para Uso — Plumpy'Nut® ou equivalente): 92 g/dia (aprox. 500 kcal/dia, rica em proteínas, gorduras e micronutrientes) por 6-8 semanas; (2) Se ATPU não disponível: orientação nutricional intensiva com alimentos locais enriquecidos; (3) TRATAR DOENÇAS CONCOMITANTES (infecções, parasitoses, anemia); (4) VITAMINA A (dose de choque): 100.000 UI (< 12m) ou 200.000 UI (≥ 12m); (5) ZINCO e multivitamínico; (6) RETORNO em 2 semanas e 30 dias para avaliar ganho de peso (esperado: ≥ 8g/kg/dia). HOSPITALIZAR se: não ganha peso após 2 semanas de ATPU, desenvolve edema, sinais de perigo geral, complicações médicas."},{"enunciado":"O enfermeiro aplica a AIDPI a uma criança de 4 anos com febre há 2 dias. Ao examinar, encontra: rigidez de nuca + fontanela abaulada + petéquias. Qual é a classificação e conduta?","alternativas":["A) Febre viral simples — antitérmico e retorno em 2 dias","B) MENINGITE BACTERIANA / DOENÇA FEBRIL MUITO GRAVE — ENCAMINHAR URGENTEMENTE ao hospital: 1ª dose de ceftriaxona IM (se disponível), manter aquecido, prevenir hipoglicemia durante o transporte","C) Dengue grave — hidratação EV e monitoramento","D) Sarampo complicado — vitamina A e retorno em 2 dias","E) Febre reumática — aspirina e encaminhar ao cardiologista"],"correta":1,"comentario":"RIGIDEZ DE NUCA + FONTANELA ABAULADA + PETÉQUIAS em criança com febre = MENINGITE BACTERIANA até prova em contrário — EMERGÊNCIA MÁXIMA. CLASSIFICAÇÃO AIDPI: DOENÇA FEBRIL MUITO GRAVE (sinal de perigo + rigidez de nuca): ENCAMINHAR URGENTE com: (1) 1ª DOSE DE ANTIBIÓTICO IM (ceftriaxona 50-100 mg/kg IM — se disponível) ANTES de transferir — não aguardar resultado de LCR para iniciar ATB em caso de suspeita de meningite; (2) DEXAMETASONA EV se disponível (reduz sequelas na meningite bacteriana); (3) Manter AQUECIDO (prevenir hipotermia); (4) PREVENIR HIPOGLICEMIA (glicose EV ou solução açucarada VO se tolera); (5) Transporte com acompanhante de saúde. PETÉQUIAS: sinal de bacteremia por Neisseria meningitidis ou Streptococcus pneumoniae — mortalidade de até 20% sem tratamento imediato. A AIDPI prioriza o reconhecimento precoce e a transferência rápida."},{"enunciado":"Sobre a suplementação de vitamina A pela AIDPI, em quais situações está indicada?","alternativas":["A) Vitamina A só é necessária em crianças com cegueira noturna confirmada","B) Vitamina A é indicada em: SARAMPO (toda criança com sarampo — 2 doses), DESNUTRIÇÃO GRAVE, DIARREIA PERSISTENTE, e como SUPLEMENTAÇÃO DE ROTINA em áreas de alta prevalência de deficiência (MS: suplementação a cada 6 meses para crianças de 6-59 meses em municípios vulneráveis — PNSVA)","C) Vitamina A é contraindicada em crianças < 2 anos por risco de toxicidade","D) Vitamina A só é usada em suplementação preventiva — nunca como tratamento","E) A dose de vitamina A é a mesma independentemente da idade da criança"],"correta":1,"comentario":"VITAMINA A (AIDPI e PNSVA): INDICAÇÕES: (1) SARAMPO: reduz mortalidade em 50% → DUAS doses com 24h de intervalo: < 6m: 50.000 UI; 6-11m: 100.000 UI; ≥ 12m: 200.000 UI; (2) DESNUTRIÇÃO GRAVE: dose de choque única; (3) DIARREIA PERSISTENTE: dose única; (4) XEROFTALMIA (cegueira noturna, manchas de Bitot): tratamento com 3 doses. SUPLEMENTAÇÃO DE ROTINA — PNSVA (Programa Nacional de Suplementação de Vitamina A / MS): crianças de 6-59 meses em municípios vulneráveis do Norte e Nordeste: 100.000 UI (6-11 meses) e 200.000 UI (12-59 meses) a cada 6 meses + puérperas nas primeiras 6 semanas pós-parto (200.000 UI — repõe vitamina A do leite materno). TOXICIDADE: rara com doses corretas; sintomas: cefaleia, vômito, fontanela abaulada (pseudotumor cerebri) por superdose."},{"enunciado":"Sobre a prevenção da pneumonia pela AIDPI, quais medidas são mais eficazes segundo as evidências?","alternativas":["A) Uso de antibiótico profilático diário para todas as crianças menores de 2 anos","B) Aleitamento materno exclusivo até 6 meses (reduz pneumonia em 50%), vacinação completa (PCV10, Hib — previnem pneumonia bacteriana), lavagem das mãos, redução da poluição intradomiciliar (fogão a lenha), tratamento do baixo peso e desnutrição","C) Isolamento social completo de crianças até os 2 anos","D) Uso de vitamina C em altas doses para prevenir infecções respiratórias","E) Antibiótico profilático apenas em crianças com histórico de 2 ou mais pneumonias"],"correta":1,"comentario":"PREVENÇÃO DA PNEUMONIA (AIDPI/OMS): A pneumonia é a principal causa de morte infantil no mundo (> 800.000 crianças/ano). Medidas preventivas de ALTO IMPACTO: (1) ALEITAMENTO MATERNO EXCLUSIVO até 6 meses: reduz risco de pneumonia em ~50% (IgA secretória, fatores imunológicos, proteção microbioma); (2) VACINAÇÃO: PCV10 (Pneumocócica) previne pneumonia pneumocócica; Hib (Haemophilus influenzae tipo b — na Penta); influenza anual; (3) LAVAGEM DAS MÃOS: reduz pneumonia em 23% (transmissão por gotículas e contato); (4) REDUÇÃO DA POLUIÇÃO INTRADOMICILIAR: fogão a lenha, cigarro passivo — principais riscos domiciliares; (5) NUTRIÇÃO ADEQUADA: desnutrição aumenta o risco de pneumonia grave em 4-5x; vitamina A e zinco protetores; (6) DIAGNÓSTICO E TRATAMENTO PRECOCES (AIDPI). ANTIBIÓTICO PROFILÁTICO: não indicado em rotina (exceto imunossuprimidos com indicação específica)."}]}];
const WPP='5581987488449';
let temaAtual=null,questoes=[],respostas={},tentAtual=0;

(function init(){
  const g=document.getElementById('grid');
  TEMAS.forEach((t,i)=>{
    const tent=+localStorage.getItem('m5_t_'+t.id)||0;
    const bloq=tent>=6;
    const ult=localStorage.getItem('m5_u_'+t.id)||'';
    const d=document.createElement('div');
    d.className='card';
    d.innerHTML=`<span class="em">${t.emoji}</span><h3>${t.nome}</h3><p>${t.questoes.length} questões · ${tent}/6 tentativas${ult?' · Último: '+ult:''}</p>${bloq?'<p style="color:#FF6B6B;font-weight:700;margin-top:5px;">🔒 BLOQUEADO</p>':''}`;
    if(!bloq)d.onclick=()=>abrirSenha(i);
    else d.style.opacity='.6';
    g.appendChild(d);
  });
})();

function abrirSenha(i){
  temaAtual=TEMAS[i];
  document.getElementById('s-em').textContent=temaAtual.emoji;
  document.getElementById('s-tit').textContent=temaAtual.nome;
  document.getElementById('s-inp').value='';
  document.getElementById('s-err').textContent='';
  show('tela-senha');
  setTimeout(()=>document.getElementById('s-inp').focus(),250);
}
document.getElementById('s-inp').addEventListener('keypress',e=>{if(e.key==='Enter')verificar();});
function verificar(){
  const v=document.getElementById('s-inp').value.trim();
  if(v===temaAtual.senha){iniciar();}
  else{document.getElementById('s-err').textContent='❌ Senha incorreta.';document.getElementById('s-inp').value='';}
}
function iniciar(){
  tentAtual=(+localStorage.getItem('m5_t_'+temaAtual.id)||0)+1;
  localStorage.setItem('m5_t_'+temaAtual.id,tentAtual);
  respostas={};
  const all=[...temaAtual.questoes];
  for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]];}
  questoes=all.slice(0,25).map(q=>{
    const alts=q.alternativas.map((t,i)=>({t,c:i===q.correta}));
    for(let i=alts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[alts[i],alts[j]]=[alts[j],alts[i]];}
    return{...q,alts,cor:alts.findIndex(a=>a.c)};
  });
  document.getElementById('t-tit').textContent=temaAtual.emoji+' '+temaAtual.nome;
  document.getElementById('t-tent').textContent='Tentativa '+tentAtual+' de 6';
  renderQs();
  show('tela-sim');
  window.scrollTo(0,0);
}
function renderQs(){
  const c=document.getElementById('qs');c.innerHTML='';
  questoes.forEach((q,qi)=>{
    const d=document.createElement('div');d.className='qc';d.id='q'+qi;
    let altsH='';
    q.alts.forEach((a,ai)=>{
      const L=String.fromCharCode(65+ai);
      altsH+=`<button class="ab" id="a${qi}_${ai}" onclick="resp(${qi},${ai})"><span class="al">${L})</span><span>${a.t.replace(/^[A-E]\) /,'')}</span></button>`;
    });
    d.innerHTML=`<span class="qn">Questão ${qi+1} de ${questoes.length}</span><div class="en">${q.enunciado}</div>${altsH}<div class="com" id="com${qi}"><span class="lb">📝 Gabarito Comentado:</span>${q.comentario}</div>`;
    c.appendChild(d);
  });
}
function resp(qi,ai){
  if(respostas[qi]!==undefined)return;
  respostas[qi]=ai;
  const q=questoes[qi];
  document.querySelectorAll('[id^="a'+qi+'_"]').forEach((b,i)=>{
    b.disabled=true;
    if(i===q.cor)b.classList.add('cor');
    else if(i===ai&&ai!==q.cor)b.classList.add('err2');
  });
  document.getElementById('com'+qi).style.display='block';
  const n=Object.keys(respostas).length;
  document.getElementById('prog').style.width=(n/questoes.length*100)+'%';
  if(n===questoes.length)setTimeout(()=>{if(confirm('Você respondeu todas! Deseja finalizar?'))finalizar();},400);
}
function finalizar(){
  const ac=questoes.filter((q,i)=>respostas[i]===q.cor).length;
  const tot=questoes.length;
  const pct=Math.round(ac/tot*100);
  const dt=new Date().toLocaleDateString('pt-BR');
  const cod='M5-'+temaAtual.id.substring(0,5).toUpperCase()+'-'+ac+'de'+tot+'-T'+tentAtual+'-'+dt.replace(/\//g,'');
  localStorage.setItem('m5_u_'+temaAtual.id,ac+'/'+tot+' ('+pct+'%) em '+dt);
  document.getElementById('r-tit').textContent=temaAtual.emoji+' '+temaAtual.nome;
  document.getElementById('r-pl').textContent=ac+'/'+tot;
  document.getElementById('r-sub').textContent=pct+'% de aproveitamento · Tentativa '+tentAtual+'/6 · '+dt;
  document.getElementById('r-cod').textContent=cod;
  const tent=+localStorage.getItem('m5_t_'+temaAtual.id)||0;
  const ld=document.getElementById('lim-div');
  if(tent>=6){ld.style.display='block';ld.innerHTML='⚠️ Você atingiu o limite de 6 tentativas.<br>Entre em contato com a professora Fátima.<br><br><button class="bw" onclick="wpp()">💬 Falar com a Professora</button>';document.querySelector('.br2').style.display='none';}
  else{ld.style.display='none';document.querySelector('.br2').style.display='block';}
  show('tela-res');window.scrollTo(0,0);
}
function gabarito(){
  show('tela-sim');
  questoes.forEach((q,qi)=>{
    document.getElementById('com'+qi).style.display='block';
    document.querySelectorAll('[id^="a'+qi+'_"]').forEach((b,i)=>{b.disabled=true;if(i===q.cor)b.classList.add('cor');});
  });
  window.scrollTo(0,0);
}
function reiniciar(){
  const t=+localStorage.getItem('m5_t_'+temaAtual.id)||0;
  if(t>=6){alert('Limite de 6 tentativas atingido.');return;}
  iniciar();
}
function wpp(){
  const cod=document.getElementById('r-cod').textContent;
  const pl=document.getElementById('r-pl').textContent;
  const sub=document.getElementById('r-sub').textContent;
  const msg=encodeURIComponent('🩺 *Resifriends 2026 — Módulo 5: Saúde da Criança*\n📚 Tema: '+temaAtual.nome+'\n📊 Resultado: '+pl+' ('+sub+')\n🔑 Código: '+cod);
  window.open('https://wa.me/'+WPP+'?text='+msg,'_blank');
}
function menu(){
  show('tela-inicial');
  const g=document.getElementById('grid');g.innerHTML='';
  TEMAS.forEach((t,i)=>{
    const tent=+localStorage.getItem('m5_t_'+t.id)||0;
    const bloq=tent>=6;
    const ult=localStorage.getItem('m5_u_'+t.id)||'';
    const d=document.createElement('div');d.className='card';
    d.innerHTML=`<span class="em">${t.emoji}</span><h3>${t.nome}</h3><p>${t.questoes.length} questões · ${tent}/6 tentativas${ult?' · Último: '+ult:''}</p>${bloq?'<p style="color:#FF6B6B;font-weight:700;margin-top:5px;">🔒 BLOQUEADO</p>':''}`;
    if(!bloq)d.onclick=()=>abrirSenha(i);
    else d.style.opacity='.6';
    g.appendChild(d);
  });
  window.scrollTo(0,0);
}
function show(id){
  ['tela-inicial','tela-senha','tela-sim','tela-res'].forEach(x=>{
    const el=document.getElementById(x);
    el.style.display='none';
  });
  const t=document.getElementById(id);
  t.style.display=(id==='tela-inicial'||id==='tela-senha')?'flex':'block';
}
</script>
</body>
</html>
