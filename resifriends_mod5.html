rrer e chutar bola","E) Realiza apenas movimentos reflexos — ainda não tem motricidade voluntária"],"correta":1,"comentario":"MARCOS DO DESENVOLVIMENTO aos 9 MESES: MOTOR GROSSO: senta SEM APOIO com estabilidade, engatinha com coordenação (alguns crianças já pulam o engatinhamento), fica em pé com apoio, inicia movimento de levantar da posição sentada. MOTOR FINO: PINÇA INFERIOR (polegar + todos os dedos — precede a pinça superior aos 12m), transfere objetos entre as mãos, explora objetos de formas variadas, bate objetos um no outro. COGNITIVO: PERMANÊNCIA DO OBJETO (busca objeto escondido debaixo de pano — Piaget, estágio 4), causalidade. LINGUAGEM: balbucio com variações de tom, mamama/bababa/papapa (sem significado específico), 'não' compreendido. SOCIAL: estranhamento intenso (pico 8 meses), gestos bidirecionais, imita gestos simples."}]},{"id":"caderneta_crianca","nome":"Caderneta da Criança","senha":"caderneta@mod5","emoji":"📒","questoes":[{"enunciado":"A Caderneta da Criança é o documento oficial do Ministério da Saúde para acompanhamento da saúde infantil. Qual é sua principal função e quem deve mantê-la?","alternativas":["A) É um documento exclusivamente para vacinação — outras informações não são registradas","B) É o instrumento de monitoramento integral da saúde da criança, registrando crescimento, desenvolvimento, vacinação, amamentação, condições do nascimento e intercorrências — deve ser mantida PELA FAMÍLIA e solicitada em todas as consultas de saúde","C) É um documento exclusivo dos serviços de saúde — a família não deve ter acesso","D) A Caderneta é opcional — o prontuário hospitalar substitui suas funções","E) Deve ser preenchida apenas pelo médico pediatra — o enfermeiro não preenche a Caderneta"],"correta":1,"comentario":"A CADERNETA DA CRIANÇA (versão atual MS 2023) é o instrumento de monitoramento integral da saúde da criança de 0 a 10 anos. Conteúdo: condições do nascimento (peso, comprimento, IG, Apgar), curvas de crescimento (peso/idade, comprimento/estatura/idade, IMC/idade, PC/idade), marcos do desenvolvimento neuropsicomotor, calendário de vacinação, registro de aleitamento materno, orientações para os pais, informações de saúde bucal, triagens neonatais. É de PROPRIEDADE DA FAMÍLIA — deve acompanhar a criança em TODOS os serviços de saúde. O ENFERMEIRO tem papel fundamental no preenchimento e uso da Caderneta na consulta de puericultura."},{"enunciado":"Na Caderneta da Criança (MS 2023), a linha que separa o normal do abaixo do normal nas curvas de crescimento de peso para idade corresponde a qual escore Z?","alternativas":["A) Escore Z 0 (mediana) — abaixo da mediana indica baixo peso","B) Escore Z -2 — abaixo dessa linha indica baixo peso; abaixo de Z -3 indica muito baixo peso","C) Percentil 15 — crianças abaixo do P15 têm baixo peso","D) Escore Z +2 — acima indica obesidade, abaixo indica normal","E) Percentil 50 — abaixo indica necessidade de intervenção"],"correta":1,"comentario":"As curvas da Caderneta da Criança usam ESCORES Z (desvios-padrão da mediana): PESO/IDADE: < Z-3 = muito baixo peso (ação imediata); Z-3 a Z-2 = baixo peso (investigar, encaminhar); Z-2 a Z+2 = eutrofia; Z+2 a Z+3 = peso elevado; > Z+3 = obesidade. COMPRIMENTO/ESTATURA/IDADE: < Z-2 = baixa estatura para idade (stunting); < Z-3 = muito baixa estatura. IMC/IDADE: < Z-2 = magreza; Z-2 a Z+1 = eutrofia; Z+1 a Z+2 = risco de sobrepeso; > Z+2 = sobrepeso; > Z+3 = obesidade. O plotagem CORRETA nos gráficos e a ANÁLISE DA CURVA (tendência) são mais importantes que um ponto isolado."},{"enunciado":"O enfermeiro de UBS realiza a consulta de puericultura de uma criança de 1 ano. Quais informações DEVEM ser registradas na Caderneta da Criança nessa consulta?","alternativas":["A) Apenas o peso e a vacina do dia","B) Peso, comprimento, perímetro cefálico, plotagem nas curvas, avaliação do desenvolvimento (marcos), registro vacinal, prática alimentar atual, intercorrências desde a última consulta, conduta e próxima consulta","C) Apenas informações sobre vacinação e doenças — o desenvolvimento não é registrado na Caderneta","D) O registro na Caderneta é responsabilidade exclusiva do médico","E) Apenas o peso — os demais dados são registrados apenas no prontuário"],"correta":1,"comentario":"Na CONSULTA DE PUERICULTURA, o enfermeiro deve registrar NA CADERNETA: (1) ANTROPOMETRIA: peso (balança calibrada, sem roupa), comprimento/estatura (régua infantométrica ou estadiômetro), PC até 2 anos; (2) PLOTAGEM nas CURVAS da Caderneta e interpretação do escore Z; (3) DESENVOLVIMENTO: marcos atingidos na consulta; (4) VACINAÇÃO: vacinas aplicadas, lote, laboratório; (5) ALIMENTAÇÃO: amamentação, introdução alimentar, alimentos ofertados; (6) INTERCORRÊNCIAS desde a última consulta; (7) CONDUTA: encaminhamentos, prescrições, orientações; (8) PRÓXIMA CONSULTA. A Caderneta é o registro LONGITUDINAL da saúde da criança — continuidade do cuidado."},{"enunciado":"Segundo a Caderneta da Criança (MS 2023), qual é o calendário mínimo de consultas de puericultura recomendado para uma criança saudável?","alternativas":["A) Apenas 2 consultas no 1º ano: aos 2 meses e aos 12 meses","B) 1ª semana de vida, 1 mês, 2 meses, 4 meses, 6 meses, 9 meses, 12 meses, 18 meses, 2 anos, e anualmente até os 10 anos","C) Mensalmente do nascimento até os 12 meses, depois semestralmente","D) Somente quando a criança adoece ou precisa de vacina","E) Uma vez por ano do nascimento aos 10 anos"],"correta":1,"comentario":"Calendário mínimo de PUERICULTURA (MS/Caderneta da Criança 2023): 1ª SEMANA de vida (3-7 dias — visita domiciliar ou UBS), 1 MÊS, 2 MESES, 4 MESES, 6 MESES, 9 MESES, 12 MESES, 18 MESES, 2 ANOS, depois ANUALMENTE até os 10 anos. Total: 10 consultas nos primeiros 2 anos + anuais. As consultas coincidem com o calendário vacinal. Crianças de risco (prematuros, BPN, vulnerabilidade social) têm calendário MAIS FREQUENTE. A 1ª consulta na 1ª semana é fundamental: detectar precocemente dificuldades na amamentação, icterícia, infecções, alterações do desenvolvimento. A consulta de puericultura é prerrogativa do ENFERMEIRO na APS (SAE, Lei 7.498/86)."},{"enunciado":"Na Caderneta da Criança, qual sinal de perigo geral no lactente, listado como 'sinal de alarme', indica necessidade de avaliação IMEDIATA?","alternativas":["A) Criança que chora muito após vacinação","B) Qualquer sinal da tétrade: não consegue beber/mamar, vomita tudo que ingere, convulsiona ou apresenta letargia/inconsciência — sinais de perigo geral segundo AIDPI","C) Febre de 37,5°C em criança de 6 meses","D) Recusa de 1 mamada em lactente de 2 meses","E) Choro noturno ocasional em criança de 3 meses"],"correta":1,"comentario":"SINAIS DE PERIGO GERAL (Caderneta da Criança / AIDPI — Atenção Integrada às Doenças Prevalentes na Infância): qualquer criança que apresente: (1) NÃO CONSEGUE BEBER OU MAMAR; (2) VOMITA TUDO QUE INGERE; (3) CONVULSÕES na doença atual; (4) LETARGIA OU INCONSCIÊNCIA — deve ser ENCAMINHADA URGENTEMENTE ao hospital, independente do diagnóstico principal. Esses sinais indicam doença grave com risco de vida. A Caderneta orienta os pais a identificar esses sinais e procurar o serviço de saúde IMEDIATAMENTE. Além dos gerais, a Caderneta lista sinais específicos por sistema (respiratório, gastrointestinal, neurológico) que o enfermeiro deve orientar na consulta."},{"enunciado":"Sobre o calendário vacinal infantil registrado na Caderneta da Criança (PNI/MS 2024), qual sequência de vacinas está CORRETA para o 2º mês de vida?","alternativas":["A) BCG, Hepatite B e Rotavírus","B) Penta (DTP+Hib+HepB), VIP (Poliomielite inativada), Pneumocócica 10-valente e Rotavírus Humano G1P1 — 1ª dose de cada","C) Apenas DTP (tríplice bacteriana) e BCG","D) MMR (tríplice viral) e varicela","E) Hepatite A e meningocócica C"],"correta":1,"comentario":"Calendário Vacinal PNI/MS 2024 — 2 MESES: (1) PENTA (Pentavalente: DTP + Hib + HepB) — 1ª dose; (2) VIP (Vacina Inativada Poliomielite) — 1ª dose; (3) PCV10 (Pneumocócica 10-valente) — 1ª dose; (4) VORH (Vacina Oral Rotavírus Humano G1P1) — 1ª dose (2-7 meses e 14 dias). Ao NASCER: BCG-ID (dose única) + Hepatite B (1ª dose em < 12h). 4 MESES: Penta 2ª + VIP 2ª + PCV10 2ª + VORH 2ª. 6 MESES: Penta 3ª + VIP 3ª + Influenza (anual, campanha). 9 MESES: Febre Amarela. 12 MESES: MMR (tríplice viral) + PCV10 Reforço + Meningo C. 15 MESES: Penta Reforço + VOP + MMR 2ª + Hepatite A + Varicela. O registro CORRETO na Caderneta inclui: data, lote, laboratório, assinatura."},{"enunciado":"A Caderneta da Criança registra os marcos do desenvolvimento neuropsicomotor em 4 domínios. Quais são eles?","alternativas":["A) Motor, linguagem, cognitivo e emocional","B) Motor grosso, motor fino/adaptativo, linguagem/comunicação e pessoal-social","C) Físico, mental, social e espiritual","D) Reflexos, equilíbrio, coordenação e cognição","E) Neurológico, ortopédico, fonoaudiológico e psicológico"],"correta":1,"comentario":"A Caderneta da Criança avalia o DESENVOLVIMENTO NEUROPSICOMOTOR em 4 DOMÍNIOS (baseada no Denver II e nas diretrizes do MS): (1) MOTOR GROSSO: controle postural, equilíbrio, locomoção (rolar, sentar, engatinhar, andar, correr, pular); (2) MOTOR FINO / ADAPTATIVO: coordenação olho-mão, preensão, manipulação de objetos (pinça, construção de torre, desenho); (3) LINGUAGEM / COMUNICAÇÃO: compreensão e expressão verbal e não verbal (vocalização, balbucio, palavras, frases); (4) PESSOAL-SOCIAL: interação social, autocuidado, brincadeiras, vínculos. O enfermeiro registra os marcos ATINGIDOS na consulta e identifica os atrasos, que devem ser acompanhados e investigados. ATRASO em ≥ 2 domínios = encaminhar para avaliação especializada."},{"enunciado":"Um lactente de 3 meses é levado à UBS para consulta de rotina. O enfermeiro ao plotar o peso na Caderneta da Criança identifica que o ponto está abaixo da linha de escore Z-3 (muito baixo peso). Qual é a conduta do enfermeiro?","alternativas":["A) Repetir a pesagem na próxima consulta de rotina daqui 3 meses","B) Avaliar o aleitamento materno (pega, frequência, duração), investigar causas (doenças, problemas de sucção, oferta inadequada), orientar a mãe, encaminhar para avaliação médica e nutricional e agendar retorno em curto prazo (7-14 dias)","C) Iniciar suplementação com fórmula artificial imediatamente sem avaliação adicional","D) Hospitalizar imediatamente sem avaliação prévia na UBS","E) Tranquilizar a mãe — peso abaixo de Z-3 é normal em lactentes amamentados"],"correta":1,"comentario":"Criança com peso < Z-3 (muito baixo peso) = RISCO NUTRICIONAL GRAVE que exige ação imediata. Conduta do ENFERMEIRO: (1) AVALIAR DETALHADAMENTE: história alimentar completa (AM, pega, frequência, duração, suplementação), avaliação da mama/mamilos, histórico de doenças, condições socioeconômicas, vínculo mãe-filho; (2) VERIFICAR TÉCNICA DE AMAMENTAÇÃO (pega, posicionamento); (3) INVESTIGAR causas: erro alimentar (mais comum), doenças (infecções, cardiopatia, fibrose cística, refluxo, etc.); (4) ENCAMINHAR ao médico para avaliação e investigação; (5) COMUNICAR à equipe de saúde; (6) AGENDAR RETORNO EM CURTO PRAZO (7-14 dias); (7) Considerar visita domiciliar e envolvimento de assistência social se vulnerabilidade. NÃO introduzir fórmula sem avaliação do AM."},{"enunciado":"Sobre o registro do aleitamento materno na Caderneta da Criança, qual informação é coletada e qual é sua importância?","alternativas":["A) A Caderneta não registra informações sobre aleitamento materno","B) A Caderneta registra se a criança está em aleitamento materno exclusivo (AME), aleitamento materno predominante, complementado ou não está mamando — informação usada para monitorar o cumprimento das metas de AME até 6 meses e AM até 2 anos ou mais","C) Apenas o peso da criança reflete indiretamente o aleitamento — sem registro específico","D) O registro de AM na Caderneta é responsabilidade exclusiva do médico pediatra","E) A Caderneta registra apenas se a criança recebeu ou não fórmula artificial"],"correta":1,"comentario":"A Caderneta da Criança (MS 2023) registra a PRÁTICA ALIMENTAR em cada consulta: ALEITAMENTO MATERNO EXCLUSIVO (AME): apenas leite materno, sem água, chás, sucos ou outros alimentos; AM PREDOMINANTE: leite materno + água/chás; AM COMPLEMENTADO: leite materno + alimentos; AM NÃO EXCLUSIVO / NÃO ESTÁ MAMANDO. As METAS OMS/MS: AME até os 6 MESES (180 dias) + AM COMPLEMENTADO até os 2 ANOS OU MAIS. O monitoramento permite identificar precocemente o desmame e intervir com apoio especializado (consultora em amamentação, grupo de amamentação). O Brasil tem melhorado os indicadores de AM, mas ainda está aquém das metas da OMS."},{"enunciado":"A Caderneta da Criança traz orientações sobre saúde bucal. Qual recomendação está CORRETA?","alternativas":["A) A higiene bucal deve ser iniciada apenas após a erupção dos dentes permanentes","B) Higiene das gengivas com gaze úmida desde o nascimento; após erupção do 1º dente: escovação com escova macia e pasta fluoretada (1000-1100 ppm); 1ª consulta odontológica antes do 1º aniversário; evitar hábitos nocivos (chupeta, mamadeira noturna com leite/suco)","C) Chá adoçado antes de dormir não causa cárie de mamadeira","D) Pasta de dente sem flúor é recomendada até os 6 anos para evitar fluorose","E) A cárie de infância precoce não é considerada problema de saúde pública"],"correta":1,"comentario":"SAÚDE BUCAL NA INFÂNCIA (Caderneta da Criança / MS / CFO): HIGIENE BUCAL DESDE O NASCIMENTO: limpar gengiva com gaze úmida após cada mamada. Após ERUPÇÃO DO 1º DENTE: ESCOVAÇÃO com escovinha de dedo ou escova macia adequada para bebês + PASTA COM FLÚOR 1000-1100 ppm (grão de arroz até 3 anos; grão de ervilha 3-6 anos). 1ª CONSULTA ODONTOLÓGICA: antes do 1º aniversário. CÁRIE DE INFÂNCIA PRECOCE (CIP): início antes dos 6 anos, muito prevalente no Brasil — fatores de risco: amamentação noturna após erupção dos dentes (↑ sem higiene), mamadeira com leite/suco/chá doce, hábito de dormir com mamadeira. HÁBITOS NOCIVOS: chupeta e sucção de dedo prolongados (> 3-4 anos) → má oclusão. Pasta SEM FLÚOR não protege adequadamente — o flúor é preventivo quando usado corretamente."},{"enunciado":"Sobre o Método Canguru registrado na Caderneta da Criança, qual é o principal benefício documentado para o RN prematuro ou de baixo peso?","alternativas":["A) Substitui completamente a incubadora e o monitoramento de sinais vitais","B) Promove termorregulação, estabilidade cardiorrespiratória, ganho de peso, redução da dor, promoção do vínculo e aleitamento materno — com evidências de redução da mortalidade neonatal em prematuros de baixo peso","C) É indicado apenas para RN a termo com peso normal","D) O Método Canguru só beneficia o desenvolvimento emocional — não tem efeitos fisiológicos","E) É contraindicado para mães com cesárea recente"],"correta":1,"comentario":"MÉTODO CANGURU (MC) — evidências (revisão Cochrane): redução da mortalidade em ~40% em prematuros de baixo peso de países de média e baixa renda; estabilização da TEMPERATURA (termorregulação pelo contato pele a pele = igual à incubadora); estabilidade CARDIORRESPIRATÓRIA (reduz apneias e bradicardias); melhor GANHO DE PESO (transferência calórica, redução do gasto energético); REDUÇÃO DA DOR (toque materno tem efeito analgésico — reduz NICU procedural pain); AMAMENTAÇÃO: maior duração e exclusividade; VÍNCULO E APEGO (reduz depressão pós-parto); NEURODESENVOLVIMENTO: melhores resultados cognitivos e comportamentais. No Brasil: política pública desde 2000 (Portaria MS 693/2000). A Caderneta da Criança orienta as famílias sobre o MC."},{"enunciado":"O enfermeiro realiza a visita domiciliar ao RN na primeira semana de vida. Quais aspectos devem ser avaliados e registrados na Caderneta da Criança nessa visita?","alternativas":["A) Apenas verificar se as vacinas da maternidade foram aplicadas","B) Condições do RN (peso, coloração, hidratação, coto umbilical, icterícia), amamentação (pega, frequência, duração, suficiência), condições da puérpera (lóquios, mamas, saúde mental), ambiente domiciliar e rede de apoio, triagens neonatais realizadas","C) Apenas avaliar a cicatrização do coto umbilical","D) A visita domiciliar não é registrada na Caderneta da Criança","E) Verificar apenas se a mãe está amamentando — demais avaliações são desnecessárias na 1ª semana"],"correta":1,"comentario":"VISITA DOMICILIAR NA 1ª SEMANA (estratégia NASF-AB / ACS / Equipe ESF): fundamental para reduzir mortalidade neonatal. Avaliação do RN: PESO (detectar perda > 10% = investigar AM), COLORAÇÃO (icterícia — avaliar escleras, tronco), HIDRATAÇÃO (fontanela, mucosas), COTO UMBILICAL (sinais de onfalite), MAMADAS (frequência, duração, urina/fezes normais). AMAMENTAÇÃO: observar mamada, avaliar pega, produção de leite. PUÉRPERA: lóquios, mamas (ingurgitamento, fissuras), sinais de depressão pós-parto. AMBIENTE: condições de moradia, rede de apoio, violência doméstica (rastrear). TRIAGENS: verificar se foram realizadas (pezinho, orelhinha, coraçãozinho, olhinho). TUDO REGISTRADO na Caderneta e no prontuário. Resultado alterado = encaminhar IMEDIATAMENTE."},{"enunciado":"A Caderneta da Criança (MS 2023) traz informações sobre o 'Teste do Olhinho' (Triagem Ocular Neonatal). Em que consiste esse exame e quando é realizado?","alternativas":["A) Avaliação da acuidade visual com tabela de Snellen — realizado aos 6 meses","B) Reflexo vermelho ocular (RVO) — realizado antes da alta da maternidade (idealmente nas primeiras 48h) e em toda consulta de puericultura até os 3 meses; detecta opacidades dos meios oculares (catarata congênita, glaucoma, retinoblastoma)","C) Teste de cobertura ocular — avalia estrabismo nos primeiros dias de vida","D) Fundoscopia dilatada — realizada por oftalmologista na maternidade rotineiramente","E) Potencial visual evocado — exame eletrofisiológico realizado aos 3 meses"],"correta":1,"comentario":"TESTE DO OLHINHO (Triagem Ocular Neonatal — TON): realizado por REFLEXO VERMELHO OCULAR (RVO) com oftalmoscópio direto. Procedimento: iluminar os olhos do RN com oftalmoscópio a ~30-40 cm de distância — olhos normais refletem luz avermelhada (como 'olho vermelho' de foto); opacidade = reflexo BRANCO (leucocoria) ou AUSENTE → urgência oftalmológica. QUANDO: antes da alta da maternidade (idealmente nas primeiras 48h de vida) — Lei 12.258/2010 + Portaria MS; repetir em TODA consulta de puericultura até os 3 anos. DETECTA: catarata congênita (2ª causa de cegueira infantil evitável), glaucoma congênito, retinoblastoma (tumor ocular maligno mais comum na infância), coloboma. O diagnóstico precoce (<8-12 semanas) e tratamento cirúrgico prevencem a ambliopia e preservam a visão."},{"enunciado":"Sobre as orientações de segurança registradas na Caderneta da Criança, qual medida preventiva de acidente é indicada para lactentes?","alternativas":["A) Deixar a criança < 6 meses dormindo em posição prona (de bruços) para evitar aspiração","B) Posição SUPINA (de costas) para dormir — reduz risco de SMSL (Síndrome da Morte Súbita do Lactente); berço firme e plano sem almofadas/protetores; sem objetos no berço; temperatura ambiente confortável; não fumar próximo à criança; cadeirinha de carro desde o nascimento","C) Protetores de berço macios são recomendados para proteger a cabeça do lactente","D) Lactentes devem dormir na mesma cama dos pais até os 6 meses para facilitar a amamentação","E) A cadeirinha de carro é obrigatória apenas para crianças > 6 meses"],"correta":1,"comentario":"Prevenção da SÍNDROME DA MORTE SÚBITA DO LACTENTE (SMSL) — principal causa de morte não acidental em < 1 ano — Campanha 'SAFE TO SLEEP' (AAP/SBP): (1) POSIÇÃO SUPINA para dormir (de costas) — reduz SMSL em 50%; (2) SUPERFÍCIE firme e plana (colchão firme); (3) SEM objetos no berço (travesseiros, almofadas, brinquedos, protetores — risco de asfixia e reinalação de CO2); (4) TEMPERATURA confortável (evitar superaquecimento); (5) SEM fumo (tabagismo passivo dobra o risco de SMSL); (6) NÃO compartilhar cama (risco de sobreposição — bedsharing); compartilhar o quarto (mas não a cama) é aceito; (7) AMAMENTAÇÃO (fator protetor). CADEIRINHA: obrigatória em qualquer deslocamento de carro desde o nascimento (CTB/ABNT NBR 14400)."},{"enunciado":"A Caderneta da Criança orienta sobre a identificação de violência e maus-tratos. Quais são os sinais físicos que o enfermeiro deve reconhecer como possíveis indicativos de violência infantil?","alternativas":["A) Apenas fraturas são indicativas de maus-tratos — outros achados são inespecíficos","B) Hematomas em locais incomuns (costas, nádegas, tronco, face), múltiplas fraturas em diferentes estágios de consolidação, queimaduras com padrões definidos, lesões perineais sem causa explicada, regressão do desenvolvimento e medo do cuidador","C) Crianças que choram muito são as únicas que sofrem maus-tratos","D) Maus-tratos infantis ocorrem apenas em famílias de baixa renda","E) O enfermeiro não tem papel na identificação de violência — é função exclusiva do conselho tutelar"],"correta":1,"comentario":"SINAIS DE VIOLÊNCIA/MAUS-TRATOS INFANTIS — o enfermeiro DEVE reconhecer e NOTIFICAR (Lei 8.069/90 — ECA, Art. 13): FÍSICOS: hematomas em locais incomuns (costas, nádegas, face, tronco), múltiplas fraturas em DIFERENTES ESTÁGIOS de consolidação (indicam eventos repetidos), fraturas de costelas em < 2 anos (muito suspeito), queimaduras com padrões definidos (ex: marcas de cigarro, imersão em água quente), mordidas humanas, lesões genitais. COMPORTAMENTAIS: regressão do DNPM, medo do cuidador, comportamento hiperalerta, mudança comportamental súbita. RELATO INCOMPATÍVEL com a lesão ou com o desenvolvimento da criança. NOTIFICAÇÃO é OBRIGATÓRIA (não facultativa): ECA Art. 13 + SINAN (Ficha de Notificação de Violência). Encaminhar ao Conselho Tutelar e serviços de assistência social."},{"enunciado":"Sobre o registro do peso na Caderneta da Criança, qual técnica está CORRETA para pesagem de lactentes?","alternativas":["A) Pesar o lactente com fraldas e roupas — subtrair 300g ao final","B) Pesar sem roupa e sem fralda (ou com fralda seca tarada) em balança infantil calibrada (tipo prato, capacidade até 15-16 kg, precisão de 10g); verificar calibração antes do uso; registrar o peso em gramas","C) Usar a mesma balança de adultos — dividir o resultado pelo coeficiente de correção","D) A precisão da balança para lactentes não influencia no resultado clínico","E) Pesar apenas com roupa e registrar o peso bruto sem correção"],"correta":1,"comentario":"TÉCNICA DE PESAGEM DE LACTENTES: usar BALANÇA PEDIÁTRICA (tipo prato/bebê) calibrada, com capacidade de até 15-16 kg e PRECISÃO DE 10g (erros de 100-200g são clinicamente significativos em bebês pequenos). Procedimento: (1) CALIBRAR a balança (verificar o zero); (2) RETIRAR toda roupa e fralda do lactente (ou usar fralda seca, tarada na balança); (3) POSICIONAR o lactente decúbito dorsal ou sentado no centro da balança; (4) AGUARDAR estabilização do peso; (5) REGISTRAR em gramas; (6) PLOTAR na curva da Caderneta. > 2 anos: balança digital de piso (bipedestação, pés descalços, roupas leves). A CALIBRAÇÃO da balança deve ser verificada mensalmente com peso padrão. Erros na medição comprometem a avaliação do crescimento."},{"enunciado":"Sobre o acompanhamento do crescimento e desenvolvimento na Caderneta da Criança, qual situação indica necessidade de ENCAMINHAMENTO para especialista?","alternativas":["A) Criança com peso no escore Z-1 (dentro da faixa de eutrofia)","B) Ausência de marcos do desenvolvimento esperados para a faixa etária em 2 ou mais domínios, queda de dois ou mais escores Z no canal de crescimento, ou perda de habilidades previamente adquiridas","C) Criança que ganhou peso abaixo do esperado em uma única consulta durante período de doença aguda","D) Lactente que ainda não anda com 10 meses","E) Criança com estatura no percentil 25 para a idade"],"correta":1,"comentario":"CRITÉRIOS DE ENCAMINHAMENTO para especialista (MS/Caderneta): CRESCIMENTO: queda de ≥ 2 escores Z no canal de crescimento (sem causa aparente, mesmo mantendo dentro do normal); peso < Z-3 (muito baixo peso); estatura < Z-3 (muito baixa estatura); peso > Z+3 (obesidade grave); velocidade de crescimento < esperada de forma sustentada. DESENVOLVIMENTO: ausência de marcos esperados em ≥ 2 domínios; PERDA de habilidades já adquiridas (regressão — sempre urgente); resultado suspeito no Denver II confirmado em 2 avaliações. OUTROS: resultado alterado nas triagens neonatais (pezinho, orelhinha, olhinho, coraçãozinho); sinais de violência; RVO alterado. O encaminhamento OPORTUNO é fundamental para o prognóstico. O enfermeiro deve conhecer os recursos disponíveis na rede de saúde."},{"enunciado":"A Caderneta da Criança (MS 2023) aborda o tema de saúde mental materna. Por que isso é relevante no contexto da saúde da criança?","alternativas":["A) Saúde mental materna não tem relação com o desenvolvimento da criança","B) A depressão pós-parto (DPP) afeta 10-20% das mães e impacta diretamente o desenvolvimento infantil — compromete o vínculo, a amamentação, os cuidados básicos e o desenvolvimento neuropsicomotor da criança; o enfermeiro deve rastrear DPP (Escala de Edinburgh) em todas as consultas do 1º ano","C) A depressão pós-parto é um problema exclusivamente da mãe — não precisa ser abordado na consulta de puericultura","D) A DPP afeta apenas mães de prematuros — mães de RN a termo não desenvolvem DPP","E) O rastreamento de DPP é responsabilidade exclusiva do psiquiatra"],"correta":1,"comentario":"DEPRESSÃO PÓS-PARTO (DPP): prevalência 10-20% das puérperas. IMPACTO na criança: comprometimento do VÍNCULO MÃE-FILHO (responsividade emocional reduzida); menor duração do ALEITAMENTO MATERNO; prejuízo nos CUIDADOS BÁSICOS; impacto no DESENVOLVIMENTO NEUROPSICOMOTOR (atraso de linguagem, dificuldades emocionais e comportamentais, menor QI). RASTREAMENTO: Escala de Depressão Pós-Parto de Edinburgh (EPDS) — aplicada nas consultas do 1º mês, 3º mês e conforme clínica. Escore ≥ 10-12 = rastreio positivo → encaminhar para avaliação especializada. O ENFERMEIRO rastreia rotineiramente na consulta de puericultura (a criança não vem sozinha!). A Caderneta 2023 inclui orientações sobre DPP e ESSS (Escala de Suporte Social). Paternidade presente e rede de apoio são fatores protetores."},{"enunciado":"Sobre a medida do perímetro cefálico (PC) na Caderneta da Criança, qual técnica e frequência estão CORRETAS?","alternativas":["A) O PC é medido apenas ao nascimento — não faz parte das consultas de puericultura","B) O PC deve ser medido em TODA consulta até os 2 anos (e sempre que houver suspeita de alteração); usar fita métrica inelástica ao redor do crânio no maior diâmetro (acima das sobrancelhas e proeminência occipital); plotar na curva da Caderneta; normal entre Z-2 e Z+2","C) O PC é medido com paquímetro — fita métrica não é adequada","D) PC abaixo do Z-2 é normal em crianças com pais de cabeça pequena — não requer investigação","E) O PC só é medido em suspeita de hidrocefalia ou microcefalia"],"correta":1,"comentario":"PERÍMETRO CEFÁLICO (PC): medida fundamental do desenvolvimento neurológico. TÉCNICA: fita métrica INELÁSTICA, posicionada acima das sobrancelhas (glabela), acima das orelhas e ao redor da maior proeminência occipital posterior; realizar 3 medidas e usar a maior. FREQUÊNCIA: em TODA consulta de puericultura ATÉ 2 ANOS; após 2 anos se houver indicação clínica. PLOTAR na curva da Caderneta (PC/Idade, curvas OMS). NORMAL: entre Z-2 e Z+2. MICROCEFALIA: < Z-2 (investigar); < Z-3 = microcefalia grave. MACROCEFALIA: > Z+2 (investigar hidrocefalia, megalencefalia); > Z+3 = macrocefalia grave. PC com cabeça dos pais pequena (BEF) pode haver microcefalia constitucional benigna — mas SEMPRE investigar antes de concluir isso. A VELOCIDADE de crescimento do PC é mais importante que o valor isolado."},{"enunciado":"Sobre o calendário de vacinação do adolescente registrado na Caderneta da Criança / Caderneta do Adolescente, qual vacina é recomendada especificamente para esse grupo etário no PNI 2024?","alternativas":["A) O adolescente não recebe vacinas novas — apenas completar o esquema da infância","B) HPV quadrivalente (Gardasil 4) para meninas e meninos de 9-14 anos (2 doses), dTpa (reforço a cada 10 anos), Meningocócica ACWY e, para grupos específicos, hepatite B (se não vacinado) e influenza","C) Vacina contra dengue para todos os adolescentes independentemente de infecção prévia","D) BCG de reforço aos 15 anos para todos","E) Tríplice viral (MMR) de reforço anual durante a adolescência"],"correta":1,"comentario":"Calendário vacinal para ADOLESCENTES (PNI/MS 2024, 9-19 anos): HPV QUADRIVALENTE: meninas 9-14 anos (2 doses: 0 e 6 meses) + meninos 11-14 anos (2 doses); > 15 anos: 3 doses (0, 2, 6 meses); protege contra HPV 6, 11, 16, 18. dTpa (tríplice bacteriana acelular): reforço para adolescentes 11 anos (ou dT a cada 10 anos). MENINGOCÓCICA C (MnC): reforço aos 11-12 anos. MENINGOCÓCICA ACWY: adolescentes 11-12 anos (após reforço de MnC). Hepatite B: completar esquema se não vacinado. Influenza: anualmente (grupos de risco incluem adolescentes com comorbidades). HPV oncogênico (16 e 18) causa 70% do câncer do colo do útero, anal, vulvar, vaginal, peniano e orofaríngeo. A vacinação ANTES do início da atividade sexual é mais eficaz."},{"enunciado":"Sobre as orientações de amamentação na Caderneta da Criança, qual afirmação está CORRETA?","alternativas":["A) A Caderneta recomenda que a criança seja amamentada exclusivamente até os 4 meses","B) A Caderneta segue as recomendações do MS/OMS: aleitamento materno EXCLUSIVO até os 6 meses (180 dias) e aleitamento materno COMPLEMENTADO (com alimentos) até os 2 anos ou mais — o leite materno deve ser oferecido em livre demanda","C) A Caderneta recomenda que a mãe ofereça os dois seios em cada mamada — sempre os dois","D) Após 1 ano, o leite materno perde valor nutricional e imunológico — pode ser suspenso","E) A Caderneta recomenda introduzir água e sucos a partir dos 4 meses"],"correta":1,"comentario":"RECOMENDAÇÕES DE AMAMENTAÇÃO (OMS/MS/Caderneta da Criança): AME até os 6 MESES (180 dias) — leite materno EXCLUSIVO, SEM água, sucos, chás ou outros alimentos; AM COMPLEMENTADO até os 2 ANOS OU MAIS (com introdução de alimentos a partir dos 6 meses). LIVRE DEMANDA: sem horários fixos, sem limitar duração ou número de mamadas. O leite materno MANTÉM valor nutricional e imunológico após 1 ano (IgA, lactoferrina, linfócitos, fatores de crescimento). Não há indicação de esvaziar completamente um seio antes de oferecer o outro — oferecer o 2º seio se o bebê desejar, mas priorizar esvaziamento do 1º para garantir leite posterior (hindmilk — maior teor de gordura). Água: PROIBIDA antes dos 6 meses em AME (o leite materno tem 87% de água)."},{"enunciado":"O Protocolo de Acompanhamento do Crescimento e Desenvolvimento na Atenção Básica utiliza a Caderneta da Criança como ferramenta central. Qual é o papel específico do ENFERMEIRO nesse contexto?","alternativas":["A) O enfermeiro apenas aplica vacinas — a avaliação do crescimento e desenvolvimento é exclusiva do médico","B) O enfermeiro realiza consultas de puericultura autônomas (Lei 7.498/86 e Resolução COFEN 159/1993), avalia crescimento e desenvolvimento, aplica vacinas, realiza triagens, orienta sobre alimentação e cuidados, identifica fatores de risco, solicita exames de rotina e encaminha quando necessário","C) O enfermeiro pode realizar puericultura apenas na ausência do médico","D) O enfermeiro preenche apenas a parte de vacinação da Caderneta — demais informações são do médico","E) A consulta de puericultura pelo enfermeiro não é reconhecida pelo Ministério da Saúde"],"correta":1,"comentario":"PAPEL DO ENFERMEIRO NA PUERICULTURA (Lei 7.498/86 / COFEN 159/1993 / PNAB): o enfermeiro está LEGALMENTE HABILITADO para realizar CONSULTAS DE PUERICULTURA AUTÔNOMAS na APS. Competências: (1) anamnese e exame físico completo do lactente/criança; (2) avaliação do CRESCIMENTO (antropometria + plotagem nas curvas); (3) avaliação do DESENVOLVIMENTO (DNPM, Denver II, M-CHAT); (4) aplicação e registro de VACINAS; (5) triagens (RVO, teste do pezinho, triagem auditiva — verificar realização); (6) ORIENTAÇÕES sobre alimentação, sono, segurança, estimulação; (7) RASTREAMENTO de violência, DPP, vulnerabilidade social; (8) PRESCRIÇÃO de suplementos (vitamina D, sulfato ferroso — conforme protocolo); (9) ENCAMINHAMENTOS quando necessário. A consulta de enfermagem de puericultura é FUNDAMENTAL para a qualidade do acompanhamento infantil na APS."}]},{"id":"alimentacao_infantil","nome":"Alimentação Infantil","senha":"alimentacao@mod5","emoji":"🍼","questoes":[{"enunciado":"Segundo o Guia Alimentar para Crianças Brasileiras Menores de 2 Anos (MS 2019), qual é a recomendação sobre o Aleitamento Materno Exclusivo (AME)?","alternativas":["A) AME até os 4 meses, seguido de introdução gradual de alimentos","B) AME até os 6 meses completos (180 dias), sem oferta de água, chás, sucos ou outros alimentos; após os 6 meses, iniciar introdução alimentar mantendo o aleitamento materno até os 2 anos ou mais","C) AME até os 3 meses — após esse período o leite materno perde valor nutricional","D) AME é recomendado apenas para prematuros e crianças de baixo peso","E) Água e chá de ervas podem ser oferecidos desde o nascimento para hidratar o bebê"],"correta":1,"comentario":"O Guia Alimentar para Crianças Brasileiras < 2 anos (MS 2019) e as recomendações OMS/UNICEF recomendam: AME ATÉ OS 6 MESES COMPLETOS (180 dias) — o leite materno é o único alimento necessário, pois contém todos os nutrientes, água e fatores imunológicos suficientes; SEM ÁGUA, chás, sucos, fórmulas ou qualquer outro alimento. Após 6 meses: INTRODUÇÃO ALIMENTAR OPORTUNA (alimentos complementares) + manutenção do AM até os 2 ANOS OU MAIS. Benefícios do AME: redução de diarreias, infecções respiratórias, otites, alergias, obesidade, diabetes, leucemia; proteção contra SMSL; desenvolvimento neurológico; benefícios para a mãe (involução uterina, redução de câncer de mama e ovário, espaçamento gestacional). O leite materno contém ~87% de água — o bebê NÃO precisa de água suplementar."},{"enunciado":"A partir de qual idade deve ser iniciada a introdução de alimentos complementares e quais características devem ter?","alternativas":["A) 4 meses — alimentos líquidos como sucos de frutas e caldos","B) 6 meses completos — alimentos variados, da família, amassados/picados (não liquidificados), sem açúcar, sal em pouca quantidade, sem temperos industrializados, na consistência adequada para a idade","C) 8 meses — alimentos sólidos inteiros desde o início","D) 6 meses — apenas papinhas de frutas e leites artificiais","E) 4 meses para crianças que não estão em AME exclusivo"],"correta":1,"comentario":"INTRODUÇÃO ALIMENTAR (IA): AOS 6 MESES COMPLETOS (ou até 180 dias). Guia MS 2019: (1) CONSISTÊNCIA: amassados/picados — NÃO liquidificar/peneirar (textura ensina a mastigar); progredir de amassados (6m) para pedaços maiores e alimentos da família (12m); (2) VARIEDADE: todos os grupos alimentares desde o início (verduras, legumes, leguminosas, carnes, ovos, cereais, frutas); (3) SEM AÇÚCAR até 2 anos; (4) SAL: em pouca quantidade (< 1g/dia total) — sem sal industrializado; (5) SEM mel até 1 ano (botulismo); (6) Oferecer alimentos novos várias vezes (8-15 tentativas) antes de concluir rejeição; (7) Fazer refeições em família. A IA oportuna (nem precoce nem tardia) previne alergias, obesidade e deficiências nutricionais. Método BLW (Baby-Led Weaning — auto-alimentação) é opção após avaliação."},{"enunciado":"O enfermeiro orienta uma mãe sobre os sinais de fome e saciedade do lactente. Qual orientação está CORRETA?","alternativas":["A) O lactente deve ser alimentado exatamente a cada 3 horas — intervalo fixo garante melhor ganho de peso","B) Alimentar o lactente em LIVRE DEMANDA — respeitar os sinais de fome (busca ativa, rotação da cabeça, mão na boca, agitação) e saciedade (recusa o seio, fica relaxado, adormece); o choro já é sinal tardio de fome","C) Oferecer chupeta entre as mamadas para que o lactente aprenda a esperar 3 horas","D) Limitar cada mamada a 10 minutos por seio para não sobrecarregar a mama","E) O lactente deve acordar a noite apenas até os 3 meses — após isso, não acordar para mamar"],"correta":1,"comentario":"LIVRE DEMANDA (amamentação sob demanda): oferecer o seio sempre que o bebê demonstrar sinais de FOME — SINAIS PRECOCES: agitação, movimentos de busca (rotação de cabeça, procura com a boca), mão na boca, chupamento dos lábios; SINAL TARDIO: choro (já indica estresse). NÃO aguardar o choro para oferecer o seio. SACIEDADE: baby larga o seio espontaneamente, adormece, fica relaxado, mãos abertas. NÚMERO DE MAMADAS: nos primeiros meses, geralmente 8-12 mamadas por 24h (inclui noturnas). DURAÇÃO: o bebê deve esvaziar o seio completamente (acesso ao leite posterior/hindmilk gorduroso). Limitar tempo = privação do leite posterior. Chupeta: pode interferir no estabelecimento do AM (confusão bico-mamilo nos primeiros meses). Mamar à noite é normal e fisiológico nos primeiros meses."},{"enunciado":"Sobre o colostro, qual afirmação está CORRETA?","alternativas":["A) O colostro é um leite de menor qualidade — a mãe deve complementar com fórmula nos primeiros dias","B) O colostro é o leite produzido nos primeiros 3-5 dias após o parto; é rico em proteínas, fatores imunológicos (IgA, lactoferrina, leucócitos), fatores de crescimento intestinal e tem efeito laxativo (estimula eliminação do mecônio) — é o 'ouro líquido' para o RN","C) O colostro deve ser descartado antes de oferecer ao bebê por conter impurezas","D) O colostro é idêntico ao leite maduro — sem diferenças nutricionais","E) A produção de colostro indica que o leite 'não desceu' — sinal de hipogalactia"],"correta":1,"comentario":"COLOSTRO: leite produzido nos primeiros 3-5 dias pós-parto. Características: cor AMARELADA (rico em betacaroteno e vitamina A), volume PEQUENO (30-50 mL/dia — suficiente para o estômago do RN), mas ALTAMENTE CONCENTRADO. Composição: PROTEÍNAS: 2-3x mais que leite maduro; IgA SECRETÓRIA: proteção intestinal contra patógenos; LACTOFERRINA: antibacteriana; LEUCÓCITOS: macrófagos, linfócitos, neutrófilos; FATORES DE CRESCIMENTO: EGF (crescimento intestinal), IGF; LAXATIVO NATURAL: acelera eliminação do MECÔNIO (reduz icterícia). É chamado de 'OURO LÍQUIDO' ou '1ª VACINA DO BEBÊ'. LEITE DE TRANSIÇÃO: 5-14 dias. LEITE MADURO: após 15 dias. A 'descida do leite' (apojadura) ocorre entre 2-5 dias após o parto — o colostro é suficiente antes disso."},{"enunciado":"Uma mãe de lactente de 4 meses relata que está com mastite. Como o enfermeiro deve orientá-la?","alternativas":["A) Suspender imediatamente o aleitamento materno e introduzir fórmula artificial","B) MANTER o aleitamento materno no seio afetado é fundamental — esvaziamento frequente reduz a mastite; compressas mornas antes, compressas frias depois das mamadas; posicionamento adequado; analgésico/antipirético conforme prescrição; antibiótico se não melhorar em 12-24h ou se houver sinais de abscesso","C) Suspender o aleitamento apenas no seio afetado e ordenhar mecanicamente","D) A mastite é contraindicação absoluta para amamentação — introduzir fórmula imediatamente","E) Aplicar pomada de tetraciclina no mamilo afetado"],"correta":1,"comentario":"MASTITE LACTACIONAL: inflamação da mama durante amamentação (bacteriana ou não). A recomendação OMS/MS é CONTINUAR AMAMENTANDO no seio afetado — é a conduta mais eficaz! O esvaziamento frequente da mama é fundamental para resolução. Conduta: (1) MANTER amamentação frequente no seio afetado (ou ordenhar se dor impede); (2) CALOR LOCAL antes das mamadas (facilita fluxo); (3) FRIO após (reduz edema e dor); (4) ANALGÉSICO/ANTI-INFLAMATÓRIO (ibuprofeno ou paracetamol); (5) ANTIBIÓTICO se não melhora em 12-24h ou há sinais de abscesso: cefalexina 500mg 6/6h ou amoxicilina-clavulanato por 10-14 dias (S. aureus — agente mais comum); (6) Se ABSCESSO: drenagem cirúrgica + ATB. O leite da mama com mastite é SEGURO para o bebê (exceto se abscesso rompido no ducto). SUSPENDER a amamentação agrava a mastite."},{"enunciado":"Sobre a suplementação de vitamina D em lactentes, qual é a recomendação atual da SBP?","alternativas":["A) Vitamina D é necessária apenas para prematuros — RN a termo não precisam de suplementação","B) A SBP recomenda suplementação de vitamina D 400 UI/dia para todos os lactentes desde os primeiros dias de vida até os 12 meses (independente de AM ou fórmula); dos 12-24 meses: 600 UI/dia se AME ou ingesta insuficiente de alimentos fontes","C) Vitamina D só é necessária em lactentes com exposição solar insuficiente","D) A dose recomendada de vitamina D para lactentes é 1000 UI/dia desde o nascimento","E) A vitamina D deve ser suplementada apenas em lactentes com sinais clínicos de raquitismo"],"correta":1,"comentario":"VITAMINA D EM LACTENTES (SBP 2021/2024): deficiência muito prevalente no Brasil. RECOMENDAÇÃO: 400 UI/DIA para TODOS os lactentes desde os PRIMEIROS DIAS de vida até os 12 MESES (o leite materno tem baixo teor de vitamina D; fórmulas industriais têm vitamina D, mas o volume ingerido pode ser insuficiente). 12-24 MESES: 600 UI/dia se em AME ou ingesta insuficiente. EXPOSIÇÃO SOLAR: insuficiente para manter níveis adequados de vitamina D em lactentes (riscos: queimaduras, fotocarcinogênese — não expor < 6 meses ao sol direto). A vitamina D previne RAQUITISMO, favorece absorção de cálcio e fósforo, saúde óssea e imunidade. O ENFERMEIRO pode PRESCREVER vitamina D na APS conforme protocolo. FERRO: 1 mg/kg/dia a partir do 4º mês em AME (início antes dos 6 meses de AM exclusivo)."},{"enunciado":"Sobre a suplementação de ferro em lactentes, qual é a recomendação da SBP?","alternativas":["A) Ferro não é necessário antes dos 12 meses em lactentes amamentados","B) Lactentes em AME: sulfato ferroso 1 mg/kg/dia a partir do 4º mês até os 2 anos ou até ingesta adequada de ferro na alimentação; prematuros e baixo peso: iniciar com 2-4 semanas de vida","C) Ferro só é suplementado após diagnóstico laboratorial de anemia","D) Fórmulas artificiais fornecem ferro suficiente — não é necessária suplementação adicional","E) A suplementação de ferro deve ser iniciada aos 12 meses para todos"],"correta":1,"comentario":"SUPLEMENTAÇÃO DE FERRO (SBP 2021): A ANEMIA FERROPRIVA é a deficiência nutricional mais prevalente na infância brasileira (35% dos < 5 anos). RECOMENDAÇÕES: (1) LACTENTES EM AME (a termo, peso adequado): SULFATO FERROSO 1 mg/kg/dia a partir do 4º MÊS (120 dias) até os 2 anos (ou até ingesta adequada de ferro na dieta); (2) PREMATUROS e BAIXO PESO (< 2500g a termo, < 33 semanas): iniciar com 2-4 semanas de vida — 2-3 mg/kg/dia; (3) Lactentes em FÓRMULA: geralmente desnecessário (fórmulas enriquecidas); avaliar ingesta; (4) Introdução de CARNES e FEIJÃO aos 6 meses é essencial; (5) HEMOGRAMA de triagem: 12 meses (SBP). Vitamina C junto com o ferro não heme aumenta absorção. O enfermeiro prescreve conforme protocolo na APS."},{"enunciado":"O Guia Alimentar para Crianças Brasileiras < 2 anos (MS 2019) classifica os alimentos em grupos. Qual classificação está CORRETA?","alternativas":["A) Alimentos naturais, processados leves, processados moderados e processados intensos","B) IN NATURA ou minimamente processados (frutas, verduras, legumes, carnes, ovos, leguminosas), PROCESSADOS (produtos feitos com adição de sal ou açúcar) e ULTRAPROCESSADOS (formulações industriais com substâncias sintéticas — evitar antes dos 2 anos)","C) Saudáveis e não saudáveis — divisão simplificada para orientação familiar","D) Alimentos de origem animal e vegetal apenas","E) A classificação NOVA não é adotada pelo Guia Alimentar Brasileiro"],"correta":1,"comentario":"O Guia Alimentar para Crianças < 2 anos adota a CLASSIFICAÇÃO NOVA (NOVA Food Classification System — Prof. Carlos Monteiro/USP): (1) IN NATURA ou MINIMAMENTE PROCESSADOS: frutas, verduras, legumes, ovos, carnes, peixes, leite, leguminosas (feijão, lentilha), cereais integrais — BASE da alimentação; (2) PROCESSADOS CULINÁRIOS: óleos, manteigas, farinha, sal, açúcar — usados em pequenas quantidades no preparo; (3) PROCESSADOS: alimentos feitos com adição de sal ou açúcar (queijos, conservas, embutidos) — uso moderado; (4) ULTRAPROCESSADOS: formulações industriais com substâncias sintéticas (corantes, aromatizantes, conservantes, espessantes) — biscoitos recheados, refrigerantes, temperos em pó, macarrão instantâneo, fórmulas lácteas — EVITAR antes dos 2 anos. O Guia recomenda dar preferência a alimentos REAIS preparados em casa."},{"enunciado":"Uma mãe relata que seu filho de 8 meses se recusa a comer algumas frutas e legumes novos. Como o enfermeiro deve orientá-la?","alternativas":["A) Abandonar o alimento recusado e não oferecer mais — a criança demonstrou alergia","B) A neofobia (rejeição de alimentos novos) é normal e esperada — oferecer o mesmo alimento repetidamente (8-15 vezes em diferentes ocasiões), sem pressão ou coerção; variar preparações e combinações; os pais devem também comer o alimento na frente da criança (modelagem)","C) Misturar o alimento recusado escondido em outros alimentos sem a criança perceber","D) Adicionar açúcar ou sal para melhorar o sabor e aumentar a aceitação","E) Forçar a criança a comer o alimento recusado — a resistência é comportamento manipulativo"],"correta":1,"comentario":"NEOFOBIA ALIMENTAR (rejeição de alimentos novos): fenômeno NORMAL e esperado, com pico entre 18 meses e 5 anos. É um mecanismo evolutivo de proteção. ORIENTAÇÕES para pais (Guia MS 2019): (1) OFERECER O ALIMENTO 8-15 VEZES em diferentes ocasiões (dias, preparações, combinações) — maioria das crianças aceita após várias exposições; (2) SEM PRESSÃO ou coerção — forçar agrava a recusa e cria trauma alimentar; (3) MODELAGEM: pais e família comem o alimento na frente da criança — aprendizagem por imitação; (4) VARIAR PREPARAÇÕES: mesma cenoura pode ser crua, cozida, assada, amassada; (5) Ambiente de refeições POSITIVO (família à mesa, sem TV); (6) NÃO esconder o alimento nem adicionar açúcar/sal. A DIVISÃO DE RESPONSABILIDADE de Ellyn Satter: cuidador decide O QUÊ, QUANDO e ONDE; a criança decide SE come e QUANTO come."},{"enunciado":"Sobre a introdução de alimentos potencialmente alergênicos, qual é a recomendação atual baseada em evidências?","alternativas":["A) Ovo, amendoim, leite de vaca e trigo devem ser introduzidos apenas após os 2 anos para prevenir alergias","B) A introdução precoce e regular de alimentos alergênicos (incluindo ovo, amendoim, peixe, frutos do mar, leite de vaca, trigo, soja) a partir dos 6 meses, em crianças sem alergia, REDUZ o risco de desenvolvimento de alergia alimentar","C) A introdução de alimentos alergênicos deve ser feita somente após consulta com alergologista","D) A introdução tardia de alergênicos é a estratégia mais eficaz de prevenção de alergias na infância","E) AME até 12 meses previne completamente alergias alimentares independentemente da introdução alimentar"],"correta":1,"comentario":"INTRODUÇÃO DE ALÉRGENOS ALIMENTARES — mudança de paradigma nas últimas décadas: estudos LEAP (amendoim), EAT (multiplos alérgenos) e outros demonstraram que a INTRODUÇÃO PRECOCE (a partir dos 6 meses) e REGULAR de alimentos alergênicos REDUZ significativamente o risco de alergia alimentar — ao contrário do que se acreditava. Recomendação atual (SBP/AAP/ESPGHAN): introduzir TODOS os alimentos alergênicos a partir dos 6 MESES (junto com a introdução alimentar) em crianças SEM ALERGIA conhecida, incluindo: amendoim, ovo bem cozido, peixe, frutos do mar, leite de vaca (em preparações, não como bebida principal), trigo, soja, castanhas. Em crianças COM eczema grave ou alergia a ovo: avaliar com alergologista antes da introdução de amendoim (estudo LEAP). A introdução TARDIA de alérgenos NÃO previne alergias — ao contrário, pode aumentar o risco."},{"enunciado":"Sobre o mel e o leite de vaca integral na alimentação infantil, quais são as restrições e por quê?","alternativas":["A) Mel: evitar até 6 meses por ser muito doce; leite de vaca: pode ser usado a partir dos 4 meses","B) MEL: proibido antes dos 12 meses — risco de botulismo infantil (Clostridium botulinum); LEITE DE VACA INTEGRAL: não usar como bebida principal antes dos 12 meses — alto teor de proteínas e sódio sobrecarregam os rins imaturos, baixo teor de ferro e ácidos graxos essenciais; pode ser usado em pequenas quantidades em preparações (mingaus, papa) a partir dos 6 meses","C) Mel e leite de vaca: restritos apenas para prematuros","D) Mel: seguro após os 6 meses; leite de vaca: pode substituir o leite materno a partir dos 4 meses","E) Leite de vaca integral pode ser introduzido a partir dos 6 meses como substituto do leite materno"],"correta":1,"comentario":"MEL: PROIBIDO antes dos 12 MESES — risco de BOTULISMO INFANTIL. O mel pode conter esporos de Clostridium botulinum que germinam no intestino imaturo do lactente (flora intestinal ainda não protetora), produzindo toxina botulínica → paralisia flácida descendente, fraqueza muscular, dificuldade para sugar e engolir, risco de parada respiratória. O intestino de crianças > 1 ano e adultos é protegido pela flora intestinal madura. LEITE DE VACA INTEGRAL como BEBIDA PRINCIPAL: não usar antes de 12 MESES — alta carga renal de solutos (proteínas e sódio), baixo teor de ferro (causa anemia), relação incorreta cálcio:fósforo, baixo teor de ácidos graxos essenciais. EM PREPARAÇÕES (mingau, papa): pode ser usado em PEQUENAS QUANTIDADES a partir dos 6 meses. Após 12 meses: leite de vaca integral pode substituir parcialmente (não totalmente) o AM."},{"enunciado":"Sobre a Alergia ao Leite de Vaca (APLV) em lactentes, qual afirmação está CORRETA?","alternativas":["A) APLV é confirmada apenas por exame laboratorial (RAST/IgE específica) positivo","B) APLV é a alergia alimentar mais comum em lactentes; pode ser IgE mediada (reação imediata: urticária, vômitos, anafilaxia) ou não IgE mediada (tardia: sangue nas fezes, vômitos, FPIES); em lactentes em AM materno: mãe exclui proteínas do leite de vaca da dieta; em fórmula: substituir por fórmula extensamente hidrolisada ou de aminoácidos","C) APLV é permanente — a criança nunca desenvolve tolerância ao leite de vaca","D) Lactentes com APLV devem ser amamentados com leite de outras espécies animais (cabra, ovelha)","E) APLV é diagnosticada com certeza apenas por biópsia intestinal"],"correta":1,"comentario":"APLV (Alergia à Proteína do Leite de Vaca): alergia alimentar mais comum em lactentes (2-7,5%). MECANISMOS: IgE MEDIADA (imediata, < 2h): urticária, angioedema, vômitos, anafilaxia; NÃO IgE MEDIADA (tardia, > 2h-dias): FPIES (síndrome enterocolítica por proteína alimentar — vômitos tardios repetitivos), proctocolite alérgica (sangue nas fezes), enterite, DRGE-like. DIAGNÓSTICO: principalmente CLÍNICO (suspensão + reintrodução — teste de provocação oral). IgE específica/Prick test: útil na forma IgE mediada; negativo NÃO exclui APLV não IgE mediada. TRATAMENTO: (1) AM: mãe faz DIETA DE EXCLUSÃO de leite de vaca e derivados; (2) FÓRMULA: FÓRMULA EXTENSAMENTE HIDROLISADA (FEH, proteína quebrada em peptídeos); se grave/refratária: fórmula de AMINOÁCIDOS. NÃO usar leite de cabra/ovelha (proteínas similares — reação cruzada). PROGNÓSTICO: maioria desenvolve tolerância até 3-5 anos."},{"enunciado":"Sobre os alimentos ultraprocessados na alimentação infantil, qual recomendação do Guia MS 2019 está CORRETA?","alternativas":["A) Alimentos ultraprocessados diet/light são seguros para crianças menores de 2 anos","B) Alimentos ultraprocessados devem ser EVITADOS nos primeiros 2 anos de vida; após essa idade, devem ser limitados — são associados a obesidade, hipertensão, diabetes tipo 2, câncer e alterações do microbioma intestinal","C) Sucos industrializados de fruta são equivalentes às frutas frescas em termos nutricionais","D) Biscoitos recheados e petit suisse são opções saudáveis para o lanche de crianças menores de 2 anos","E) Iogurte industrial com sabores artificiais é equivalente ao iogurte natural integral"],"correta":1,"comentario":"ALIMENTOS ULTRAPROCESSADOS (AUP): formulações industriais com 5+ ingredientes, incluindo substâncias sem uso culinário (corantes, aromatizantes artificiais, estabilizantes, emulsificantes, adoçantes, conservantes). Exemplos: biscoitos recheados, cereais matinais açucarados, salgadinhos, refrigerantes, sucos de caixinha, embutidos, temperos em pó, fórmulas infantis de transição (Mucilon, NAN Comfor). O Guia MS 2019 recomenda EVITAR completamente antes dos 2 anos e LIMITAR após. Riscos: obesidade infantil (calorias vazias, hiperpalalatabilidade), hipertensão (excesso de sódio), dificuldade de aceitação de alimentos naturais (palatabilidade artificial), impacto negativo no microbioma, associação com diabetes e câncer na vida adulta. SUCOS: mesmo os naturais são NÃO recomendados antes de 12 meses e limitados após (máx. 120-180 mL/dia)."},{"enunciado":"Sobre a desnutrição infantil aguda grave e o tratamento nutricional, qual conduta está CORRETA?","alternativas":["A) Iniciar alimentação rica em proteínas e energia imediatamente para recuperação rápida","B) A desnutrição aguda grave (peso/estatura < Z-3 ou PB < 11,5 cm) com complicações médicas: internação hospitalar com FASE DE ESTABILIZAÇÃO (F-75: fórmula terapêutica de baixa energia para prevenir síndrome de realimentação) seguida de FASE DE REABILITAÇÃO nutricional (F-100 ou ATPU — alimento terapêutico pronto para uso); sem complicações: tratamento ambulatorial com ATPU","C) A desnutrição aguda grave não tem tratamento — apenas suporte de conforto","D) Iniciar nutrição parenteral total imediatamente em toda criança com desnutrição grave","E) Oferecer alimentos ricos em açúcar para recuperação energética rápida"],"correta":1,"comentario":"DESNUTRIÇÃO AGUDA GRAVE (DAG): peso/estatura ou IMC/Idade < Z-3 OU PB < 11,5 cm (< 6 meses: < 11 cm) OU EDEMA BILATERAL de pitting. Tratamento (OMS/MS — PROTOCOLO 10 PASSOS): (1) FASE DE ESTABILIZAÇÃO (dias 1-7): tratar hipoglicemia, hipotermia, desidratação, infecção; F-75 (75 kcal/100mL, baixa proteína — previne síndrome de realimentação); (2) FASE DE TRANSIÇÃO (semanas 2-4); (3) FASE DE REABILITAÇÃO: F-100 (100 kcal/100mL) ou ATPU — Alimento Terapêutico Pronto para Uso (pasta de amendoim enriquecida — Plumpy'Nut® ou Nutriset®). DAG sem complicações: tratamento AMBULATORIAL com ATPU. A SÍNDROME DE REALIMENTAÇÃO (hipofosfatemia, hipopotassemia, hipomagnesemia) é risco real na realimentação rápida — iniciar lentamente. Micronutrientes: vitamina A (dose única), zinco, folato, multivitamínico."},{"enunciado":"Sobre o aleitamento materno em situações especiais, qual afirmação está CORRETA?","alternativas":["A) Mães HIV positivas devem amamentar livremente — o leite materno protege contra HIV","B) Mães HIV+ em TARV com carga viral indetectável: consenso nacional (BR) = NÃO AMAMENTAR (oferecer fórmula pelo PNCT); países de alta mortalidade infantil por diarreias/pneumonias: OMS permite amamentação com TARV; mães com HTLV-1/2: NÃO amamentar; TB ativa com baciloscopia positiva: suspender temporariamente até 2 semanas de tratamento","C) Mães com HIV podem amamentar se fizerem TARV — o risco de transmissão é zero","D) Alcoolismo materno não afeta o leite materno — amamentação pode continuar normalmente","E) Mães com hepatite C não devem amamentar em nenhuma circunstância"],"correta":1,"comentario":"CONTRAINDICAÇÕES AO ALEITAMENTO MATERNO no Brasil: (1) HIV MATERNO: NÃO AMAMENTAR no Brasil (independente de TARV e carga viral) — oferecer fórmula gratuita pelo PNCT (alta mortalidade por substituição em países desenvolvidos não ocorre no BR; decisão baseada no contexto local). A OMS permite em países de alta mortalidade infantil SE mãe em TARV com CVindetectável. (2) HTLV-1/2: NÃO amamentar (transmissão pelo leite). (3) GALACTOSEMIA no bebê: NÃO amamentar. (4) TB ATIVA (baciloscopia positiva): suspender até 2 semanas de tratamento eficaz (manter ordenha para não perder leite). (5) ALCOOLISMO PESADO e DROGAS ILÍCITAS: avaliar individualmente. NÃO são contraindicações: hepatite B (vacina o bebê), hepatite C (sem lesão de mamilo), HIV negativo, CMV, tabagismo (pesadas restrições). "},{"enunciado":"Um lactente de 5 meses, em AME, é trazido à consulta. A mãe relata que o bebê parece insatisfeito após mamar. O enfermeiro investiga a produção de leite. Qual sinal indica leite materno suficiente?","alternativas":["A) Bebê que dorme por longos períodos entre as mamadas (> 4h sempre)","B) Bebê que molha 6 ou mais fraldas de urina por dia, tem fezes regulares (amamentados podem ter fezes frequentes ou uma vez por semana), ganha peso adequadamente e tem mamadas ativas (deglutição audível)","C) Apenas o peso do bebê confirma produção suficiente de leite","D) Mama que não vaza entre as mamadas indica baixa produção","E) Bebê que chora após mamar sempre indica leite insuficiente"],"correta":1,"comentario":"SINAIS DE LEITE MATERNO SUFICIENTE: (1) DIURESE: 6 ou mais fraldas molhadas por dia (urina clara/amarelo pálido) — indica hidratação adequada; (2) FEZES: padrão variável — recém-nascidos: 3-8x/dia (amostardas, pastosas); a partir de 4-6 semanas: pode reduzir para 1x a cada vários dias OU várias vezes ao dia — ambos são normais em AME; (3) GANHO DE PESO: 150-200g/semana no 1º trimestre; (4) MAMADA ATIVA: deglutição audível, mama após o reflexo de ejeção; (5) SATISFAÇÃO após mamar (não 100% do tempo — bebês podem chorar por outras razões). NÃO são sinais confiáveis de leite insuficiente: mama que não vaza, mama que parece mole, bebê que mama muito, bebê que não dorme longo. Baixa produção verdadeira é incomum (2-5% das mulheres)."},{"enunciado":"Sobre a hipogalactia (baixa produção de leite), quais são as causas mais comuns e a conduta do enfermeiro?","alternativas":["A) A hipogalactia é muito comum — a maioria das mães não produz leite suficiente","B) Causas mais comuns: pega incorreta (reduz estímulo), mamadas pouco frequentes, uso de chupeta/mamadeira, ansiedade materna, medicamentos (anticoncepcional hormonal, pseudoefedrina); conduta: corrigir a pega, aumentar a frequência das mamadas, evitar complementação desnecessária, apoio emocional, encaminhar para grupo de amamentação","C) Hipogalactia é sempre de causa hormonal — indicar domperidona imediatamente","D) A introdução de fórmula é sempre necessária quando a mãe relata pouco leite","E) O uso de mamadeira estimula a produção de leite ao fortalecer a sucção do bebê"],"correta":1,"comentario":"HIPOGALACTIA PERCEBIDA (sensação subjetiva de pouco leite) é MUITO MAIS COMUM que a hipogalactia verdadeira. Causas de BAIXA PRODUÇÃO REAL: (1) PEGA INCORRETA (causa mais comum — sucção ineficiente reduz estímulo à prolactina); (2) MAMADAS POUCO FREQUENTES ou duração insuficiente; (3) USO PRECOCE de CHUPETA/MAMADEIRA (interferência no estabelecimento do AM); (4) COMPLEMENTAÇÃO desnecessária (reduz demanda); (5) MEDICAMENTOS: anticoncepcional com estrogênio (inibe prolactina), pseudoefedrina, bromocriptina; (6) RETENÇÃO de PLACENTA; (7) SÍNDROME DE SHEEHAN. CONDUTA: corrigir a PEGA (intervenção principal), aumentar frequência das mamadas, contato pele a pele, retirar chupeta, suporte emocional, encaminhar para GRUPO DE APOIO. Galactagogos (domperidona, metoclopramida): evidência controversa, uso apenas em hipogalactia verdadeira confirmada."},{"enunciado":"Sobre a alimentação da criança de 1 a 2 anos, qual orientação está CORRETA?","alternativas":["A) A criança deve continuar recebendo alimentos em forma de papinha amassada até os 2 anos","B) Entre 12-24 meses: progressão para alimentos da família em pedaços, consistência normal (não liquidificar nem peneirar); 3 refeições + 2 lanches; manter AM; variedade de todos os grupos alimentares; sem açúcar, limitando sal e ultraprocessados; respeitar sinais de fome e saciedade","C) O leite de vaca integral pode substituir completamente o leite materno a partir dos 12 meses","D) Sucos de frutas podem substituir as frutas inteiras na alimentação de crianças de 1-2 anos","E) Crianças de 1-2 anos devem receber as mesmas porções de alimentos que adultos"],"correta":1,"comentario":"ALIMENTAÇÃO DA CRIANÇA DE 1-2 ANOS (Guia MS 2019): (1) CONSISTÊNCIA: alimentos da família em PEDAÇOS — progressão natural; NÃO liquidificar (interfere no desenvolvimento da mastigação e palatabilidade); (2) REFEIÇÕES: 3 principais (café, almoço, jantar) + 2 LANCHES saudáveis; (3) MANTER AM: continuar AM até 2 anos ou mais; (4) VARIEDADE: todos os grupos (cereais, leguminosas, carnes/ovos, laticínios, frutas, vegetais); (5) SEM AÇÚCAR: evitar completamente até 2 anos; (6) SAL: < 1g/dia; (7) RESPEITAR A SACIEDADE: não forçar, porções pequenas; (8) RESPONSIVIDADE: ambiente positivo de refeição, comer em família; (9) EVITAR ULTRAPROCESSADOS; (10) Sucos: evitar antes de 12 meses, limitar depois (< 120-180 mL/dia, SEMPRE a fruta inteira é preferível). Leite de vaca integral: pode complementar (não substituir) AM após 12 meses — máx. 500 mL/dia."},{"enunciado":"Sobre o Banco de Leite Humano (BLH) e a doação de leite materno, qual informação está CORRETA?","alternativas":["A) Qualquer mulher pode receber leite do BLH para seu filho independentemente da indicação","B) O BLH coleta, pasteuriza, controla qualidade e distribui leite humano; as doadoras são triadas sorologicamente; o leite pasteurizado (62,5°C/30min — Holder) é fornecido gratuitamente pelo SUS prioritariamente para RN prematuros e de baixo peso internados em UTIN/UCI","C) O leite do BLH pode ser dado diretamente de doadora para receptor sem pasteurização","D) A pasteurização do BLH elimina completamente todos os nutrientes do leite humano","E) O leite do BLH só pode ser usado para crianças com diagnóstico de APLV"],"correta":1,"comentario":"BANCO DE LEITE HUMANO (BLH) — Rede BLH-BR: maior rede de BLH do mundo (mais de 220 BLH em 2023). Processo: (1) SELEÇÃO e TRIAGEM das doadoras: entrevista + sorologia (HIV, HTLV, sífilis, hepatite B e C, toxoplasmose); (2) COLETA: em casa (kit asséptico fornecido) ou no BLH; (3) CONTROLE DE QUALIDADE: acidez, microbiologia, crematócrito (teor de gordura); (4) PASTEURIZAÇÃO HOLDER (62,5°C/30min): inativa patógenos virais (HIV, HTLV, CMV) e bacterianos; (5) DISTRIBUIÇÃO: GRATUITA, prioridade para RN PREMATUROS e de BAIXO PESO em UTIN/UCI neonatal, seguido de RN hospitalizados com indicação. Preserva: IgA (70-80%), lactoferrina parcialmente, fatores de crescimento, macro e micronutrientes. O leite do BLH É PRESCRITO — não é entregue sem indicação médica ou de enfermagem."},{"enunciado":"Sobre o teste de provação oral para diagnóstico de alergia alimentar em crianças, qual afirmação está CORRETA?","alternativas":["A) O teste de provocação oral está contraindicado em crianças com suspeita de alergia alimentar","B) O teste de provocação oral duplo-cego controlado por placebo (TPODCCP) é considerado o padrão-ouro para diagnóstico de alergia alimentar; baseia-se na melhora com exclusão e retorno dos sintomas com reintrodução do alimento suspeito","C) A IgE específica positiva para um alimento confirma alergia e dispensa o teste de provocação","D) O teste de provocação oral só pode ser realizado em ambiente hospitalar de alta complexidade","E) O prick test na pele substitui completamente o teste de provocação oral"],"correta":1,"comentario":"DIAGNÓSTICO DE ALERGIA ALIMENTAR: (1) TESTE DE PROVOCAÇÃO ORAL (TPO): padrão-ouro — retirada do alimento com melhora dos sintomas + reintrodução com retorno dos sintomas. TPODCCP (duplo-cego controlado por placebo): padrão científico máximo, geralmente em pesquisa. ABERTO (mais usado na prática clínica): clínico vê e sabe o que está sendo dado. Deve ser realizado com SUPERVISÃO MÉDICA (risco de anafilaxia). (2) IgE ESPECÍFICA (RAST) e PRICK TEST: auxiliares — alta sensibilidade, baixa especificidade; positivo indica SENSIBILIZAÇÃO, não necessariamente alergia clínica; NEGATIVO em alergia não IgE mediada. (3) DIETA DE EXCLUSÃO + REINTRODUÇÃO: base do diagnóstico na prática. Critério de DIAGNÓSTICO de APLV: melhora com exclusão de PL + retorno dos sintomas com reintrodução (TPO aberto). Em lactentes em AM: mãe exclui e reintroduz PL na dieta."},{"enunciado":"O enfermeiro orienta uma puérpera sobre as posições corretas para amamentar. Qual posição é descrita CORRETAMENTE?","alternativas":["A) O bebê deve ficar de frente para a mama com a cabeça virada para o lado","B) Na posição TRADICIONAL (berço): o corpo do bebê fica de frente para o corpo da mãe (barriga com barriga), cabeça e corpo alinhados (sem torcer o pescoço), cabeça levemente estendida, boca em nível do mamilo, mãe apoia o bebê com o braço homolateral à mama oferecida","C) O bebê deve mamar com a cabeça inclinada para frente (queixo no peito)","D) A mãe deve empurrar a cabeça do bebê para aproximar da mama durante a sucção","E) O bebê deve ficar deitado de costas enquanto mama para facilitar a deglutição"],"correta":1,"comentario":"POSIÇÕES PARA AMAMENTAÇÃO — características gerais: (1) BARRIGA COM BARRIGA: corpo do bebê de frente para o corpo da mãe; (2) ALINHAMENTO: orelha, ombro e quadril do bebê alinhados (sem torção); (3) POSIÇÃO DA CABEÇA: levemente estendida (não fletida no peito — dificulta deglutição); (4) NARIZ EM FRENTE AO MAMILO (antes da pega); (5) NÃO empurrar a cabeça do bebê — a mãe traz o bebê para a mama, nunca inclina para a mama. POSIÇÕES PRINCIPAIS: TRADICIONAL (berço), INVERTIDA (futebol americano/clutch — boa para gêmeos e pós-cesárea), DEITADA (boa para noite e pós-cesárea), CAVALEIRO (baby senta no joelho materno — boa para refluxo e fissura palatina). A PEGA ADEQUADA (boca ampla, lábio inferior evertido, aréola visível acima) é mais importante que a posição."},{"enunciado":"Sobre a alimentação na escola e a promoção de alimentação saudável em crianças, qual política pública está CORRETA?","alternativas":["A) O PNAE não tem obrigatoriedade de oferta de frutas e vegetais nas refeições escolares","B) O PNAE (Programa Nacional de Alimentação Escolar) garante alimentação escolar saudável e adequada a todos os alunos da educação básica pública; exige que 30% dos recursos sejam destinados à aquisição de produtos da AGRICULTURA FAMILIAR; proíbe alimentos ultraprocessados e com alto teor de sódio, gordura e açúcar nos cardápios escolares","C) Alimentos ultraprocessados são permitidos nas escolas públicas desde que em quantidades moderadas","D) O PNAE atende apenas alunos do ensino fundamental — não inclui creches e pré-escola","E) A cantina escolar pode vender qualquer alimento sem restrições legais"],"correta":1,"comentario":"PNAE (Programa Nacional de Alimentação Escolar — Lei 11.947/2009 e atualizações): maior programa de alimentação escolar do mundo. Garante: refeição saudável para TODOS os alunos da educação básica pública (de creches ao ensino médio, incluindo EJA e indígenas); exige 30% dos recursos para AGRICULTURA FAMILIAR (produção local, orgânicos preferidos); PROÍBE: bebidas com baixo teor nutricional, refrigerantes, balas, doces, alimentos ultraprocessados nos cardápios; limita sódio, gordura saturada e açúcar. O cardápio é elaborado por NUTRICIONISTA do FNDE/PNAE. As cantinas escolares em escolas públicas seguem regulamentação estadual/municipal, com tendência de restrição de ultraprocessados (ex: Lei Estadual SP 12.061/2005). O enfermeiro orienta sobre alimentação saudável no contexto escolar."},{"enunciado":"Sobre a introdução alimentar no estilo Baby-Led Weaning (BLW — Introdução Alimentar Responsiva/Autorregulada), qual afirmação está CORRETA?","alternativas":["A) BLW é contraindicado e aumenta o risco de engasgos e deficiência de ferro","B) BLW (auto-alimentação com alimentos inteiros em palitos/pedaços adequados a partir dos 6 meses, quando a criança tem coordenação motora suficiente) promove autonomia alimentar, aceitação de alimentos variados e autorregulação da saciedade; o risco de engasgo não é maior que na alimentação com colher quando realizado corretamente","C) BLW pode ser iniciado a partir dos 4 meses para desenvolver habilidades motoras","D) BLW exclui completamente o uso de colher e alimentos amassados","E) BLW é recomendado apenas para crianças com desenvolvimento motor avançado"],"correta":1,"comentario":"BABY-LED WEANING (BLW) — Auto-Alimentação Responsiva: método de introdução alimentar em que o bebê se alimenta sozinho (não há colher ou puré dado pelo cuidador). Indicações: bebê com ≥ 6 meses COM PRONTIDÃO MOTORA (senta com apoio mínimo, leva objetos à boca, coordenação mão-boca). Alimentos: em palitos/pedaços seguros (tamanho do punho do bebê, macios). EVIDÊNCIAS: não aumenta engasgos quando implementado corretamente (engasgo ≠ sufocação — reflexo protetor normal); maior VARIEDADE DE ALIMENTOS aceitos; melhor AUTONOMIA e AUTORREGULAÇÃO da saciedade; menos SELETIVIDADE ALIMENTAR futura; sem diferença no ganho de peso. PREOCUPAÇÕES reais: ferro (garantir carnes e feijão em TODOS os BLW); sal e açúcar. BLW PURO ou MISTO (combinado com colher) são opções — o MS orienta que a consistência progrida naturalmente, não necessariamente BLW estrito."}]},{"id":"saude_adolescente","nome":"Saúde do Adolescente / Desenvolvimento Infanto-Puberal","senha":"adolescente@mod5","emoji":"🧑‍⚕️","questoes":[{"enunciado":"Segundo o Estatuto da Criança e do Adolescente (ECA — Lei 8.069/1990) e o Ministério da Saúde, qual é a faixa etária definida como adolescência no Brasil?","alternativas":["A) 10 a 18 anos (OMS) e 12 a 21 anos incompletos (ECA)","B) ECA: 12 a 18 anos incompletos; OMS/MS: 10 a 19 anos; Jovens: 15 a 24 anos (ONU)","C) Apenas 15 a 18 anos — antes e depois são outras fases","D) 10 a 20 anos segundo todas as classificações vigentes no Brasil","E) O ECA não define a adolescência por faixa etária"],"correta":1,"comentario":"DEFINIÇÕES LEGAIS E DE SAÚDE: ECA (Lei 8.069/1990): CRIANÇA = 0-12 anos incompletos; ADOLESCENTE = 12-18 anos incompletos (18-21 anos em situações especiais). OMS/OPAS: ADOLESCÊNCIA = 10-19 anos (inclui puberdade precoce). MS (PROSAD/Saúde na Escola): 10-19 anos para políticas de saúde. ONU: JOVENS = 15-24 anos. Na prática de saúde no Brasil, atende-se adolescentes de 10-19 anos nas políticas de saúde. A Lei 13.106/2015 proíbe venda de bebidas alcoólicas para < 18 anos. O Programa Saúde na Escola (PSE) atende crianças e adolescentes na escola, com ações de saúde bucal, visual, auditiva, nutrição, saúde mental e prevenção."},{"enunciado":"Sobre as características do crescimento na puberdade, qual sequência de eventos puberais é CORRETA para meninas?","alternativas":["A) Pelo pubiano → menarca → telarca → pico de velocidade de crescimento","B) TELARCA (botão mamário) → pelo pubiano → PICO DE VELOCIDADE DE CRESCIMENTO → menarca (geralmente no pico ou após); idade média de início: 8-13 anos; menarca: 9-16 anos (média 12,5 anos)","C) Menarca → telarca → pico de velocidade de crescimento → pelo pubiano","D) Pico de velocidade de crescimento → telarca → pelo pubiano → menarca","E) A sequência puberal é idêntica em meninas e meninos"],"correta":1,"comentario":"PUBERDADE EM MENINAS — sequência de Tanner: (1) TELARCA (Tanner 2): aparecimento do botão mamário — 1º sinal de puberdade feminina, em média 10-11 anos (normal: 8-13 anos); (2) PELO PUBIANO (Tanner 2-3); (3) ESTIRÃO/PICO DE VELOCIDADE DE CRESCIMENTO (PVC): geralmente em Tanner 2-3, antes da menarca (8-9 cm/ano em média); (4) MENARCA: em Tanner 3-4, geralmente 2-3 anos após a telarca (média 12,5 anos; normal 9-16 anos) — após a menarca o crescimento em estatura é de ~5-7 cm; (5) Pelos axilares, acne, sudorese, corpo da mulher. PUBERDADE PRECOCE em meninas: inicio < 8 anos. TELARCA ISOLADA (botão mamário sem progressão): variante normal benigna em < 2 anos e > 6 anos — requer acompanhamento mas geralmente regride."},{"enunciado":"Sobre as características do crescimento e desenvolvimento puberal em meninos, qual sequência está CORRETA?","alternativas":["A) 1º sinal: aparecimento de pelos pubianos → depois aumento testicular","B) 1º sinal: AUMENTO DO VOLUME TESTICULAR (≥ 4 mL ou testículo ≥ 2,5 cm no maior diâmetro) — Tanner G2, seguido de pelo pubiano, crescimento do pênis, pico de velocidade de crescimento (Tanner 3-4), mudança de voz, pelos axilares, acne, semenarca; início normal: 9-14 anos","C) O pico de velocidade de crescimento em meninos ocorre antes da telarca feminina","D) A voz muda antes do aumento testicular em meninos","E) Pelos pubianos são o 1º sinal de puberdade em ambos os sexos"],"correta":1,"comentario":"PUBERDADE EM MENINOS — sequência de Tanner: (1) AUMENTO TESTICULAR (G2): volume ≥ 4 mL (orquidômetro de Prader) — 1º sinal de puberdade masculina (média 11,5 anos; normal 9-14 anos); (2) PELOS PUBIANOS (P2); (3) CRESCIMENTO DO PÊNIS (G3); (4) PICO DE VELOCIDADE DE CRESCIMENTO (Tanner G3-4): média 13-14 anos, ~9-10 cm/ano; (5) MUDANÇA DE VOZ (G4): por crescimento da laringe; (6) PELOS AXILARES, FACIAIS (barba); (7) ACNE; (8) SEMENARCA: 1ª ejaculação (média 13,5 anos). PUBERDADE PRECOCE em meninos: inicio < 9 anos. O estirão em meninos é MAIS TARDIO e MAIS INTENSO que em meninas — daí a maior estatura masculina final. Criptorquidia (testículo não descido): cirurgia (orquidopexia) recomendada antes dos 12-18 meses."},{"enunciado":"O enfermeiro realiza consulta de saúde do adolescente de 15 anos. Sobre a confidencialidade e o sigilo na consulta, qual postura é CORRETA?","alternativas":["A) Toda informação do adolescente deve ser compartilhada com os pais imediatamente","B) O adolescente tem direito ao SIGILO e à CONFIDENCIALIDADE em consultas de saúde; informações só são compartilhadas com pais/responsáveis sem consentimento do adolescente em situações de risco grave (automutilação, suicídio, violência, uso de drogas com risco de vida); o atendimento pode ser feito sem a presença dos pais após os 12 anos","C) Adolescentes < 18 anos não têm direito à confidencialidade — os pais decidem sobre toda a saúde","D) O sigilo profissional não se aplica a adolescentes em nenhuma circunstância","E) Toda informação sobre saúde sexual e reprodutiva deve ser repassada aos pais"],"correta":1,"comentario":"CONFIDENCIALIDADE NA SAÚDE DO ADOLESCENTE: o adolescente tem direito ao SIGILO (CFM, COFEN, ECA). Pode ser atendido SEM presença dos pais. SIGILO DEVE SER MANTIDO em: saúde sexual e reprodutiva, uso de drogas sem risco iminente, saúde mental, conflitos familiares. SIGILO PODE/DEVE SER QUEBRADO em: RISCO GRAVE E IMINENTE para o adolescente ou terceiros — automutilação, ideação suicida com plano, abuso sexual em curso, violência grave, uso de drogas com risco de vida. Nessas situações: informar o adolescente ANTES de comunicar à família ou autoridades. ATENDIMENTO SEM OS PAIS: após os 12 anos (ECA). CONSULTA CONJUNTA: após estabelecer vínculo a sós. O estabelecimento da CONFIANÇA é fundamental para o vínculo terapêutico com adolescentes. NOTIFICAÇÃO COMPULSÓRIA de violência (SINAN) obrigatória."},{"enunciado":"Sobre a saúde mental do adolescente, quais são os transtornos mais prevalentes nessa faixa etária?","alternativas":["A) Esquizofrenia e transtorno bipolar são os mais prevalentes na adolescência","B) Transtornos de ansiedade (mais comuns), depressão, TDAH, transtornos alimentares (anorexia e bulimia), uso de substâncias e tentativas de suicídio — o suicídio é a 3ª causa de morte em adolescentes no Brasil","C) Transtornos mentais na adolescência são raros — manifestam-se apenas na vida adulta","D) Apenas meninas desenvolvem transtornos mentais durante a adolescência","E) Transtornos mentais na adolescência sempre são causados pelo uso de drogas"],"correta":1,"comentario":"SAÚDE MENTAL NA ADOLESCÊNCIA: 50% dos transtornos mentais adultos têm início antes dos 14 anos (OMS). Prevalência: (1) ANSIEDADE: 8-25% dos adolescentes (generalizada, fobia social, pânico, TOC, TEPT); (2) DEPRESSÃO: 4-8%; risco aumentado na puberdade, especialmente em meninas; (3) TDAH: 5-8% (diagnóstico na infância, persiste na adolescência); (4) TRANSTORNOS ALIMENTARES: anorexia nervosa e bulimia — pico 14-18 anos, maioria meninas; (5) USO DE SUBSTÂNCIAS: álcool (mais prevalente), tabaco, cannabis, outras; (6) SUICÍDIO: 3ª causa de morte em adolescentes no Brasil (após violências e acidentes); ideação suicida em 10-15%. O enfermeiro rastreia ativamente: humor, sono, apetite, comportamento, relacionamentos, uso de substâncias, automutilação. PHQ-A (PHQ-9 adaptado) para rastreio de depressão."},{"enunciado":"Sobre a gravidez na adolescência, qual afirmação está CORRETA?","alternativas":["A) Gravidez na adolescência é infrequente no Brasil — não é um problema de saúde pública","B) O Brasil tem uma das maiores taxas de gravidez na adolescência da América Latina; está associada a abandono escolar, perpetuação da pobreza, maior morbimortalidade materna e perinatal; o enfermeiro tem papel fundamental na educação sexual e acesso a métodos contraceptivos","C) Adolescentes grávidas devem receber os mesmos cuidados pré-natais que adultas — sem diferenças","D) Contraceptivos não devem ser fornecidos a adolescentes < 18 anos sem autorização dos pais","E) A gravidez na adolescência não tem impacto no desenvolvimento psicossocial da adolescente"],"correta":1,"comentario":"GRAVIDEZ NA ADOLESCÊNCIA no Brasil: 15-17% dos partos são de adolescentes (uma das maiores taxas da AL). IMPACTOS: abandono escolar (especialmente meninas), perpetuação do ciclo de pobreza, isolamento social, violência de gênero. RISCOS À SAÚDE: pré-eclâmpsia, anemia, desnutrição materna, prematuridade, BPN, maior mortalidade materna (adolescentes < 15 anos: risco 5x maior). O ENFERMEIRO deve: educação sexual nas escolas/UBS (PSE), rastrear vida sexual ativa e contracepção, oferecer CONTRACEPTIVOS SEM NECESSIDADE DE CONSENTIMENTO PARENTAL (< 18 anos podem receber contracepção — sigilo), pré-natal diferenciado com equipe multiprofissional. A Lei 9.434/2023 exige que o MS implemente o Programa Nacional de Prevenção da Gravidez na Adolescência. NOTA: relação sexual consentida com adolescente < 14 anos é crime (ECA Art. 217-A)."},{"enunciado":"Sobre o uso de álcool e drogas na adolescência, qual abordagem do enfermeiro é mais adequada?","alternativas":["A) Ignorar o tema — o uso de drogas na adolescência é inevitável e não deve ser abordado","B) Utilizar a abordagem CRAFT/AUDIT-C ou perguntas abertas sem julgamento para rastrear uso; aplicar Entrevista Motivacional para adolescentes em uso; orientar sobre riscos do uso precoce para o desenvolvimento cerebral; manter sigilo; encaminhar para CAPS-AD se dependência","C) Informar imediatamente os pais sobre qualquer uso de substâncias referido pelo adolescente","D) Prescrever medicamentos ansiolíticos para reduzir o uso de drogas","E) Encaminhar diretamente para internação psiquiátrica em qualquer relato de uso"],"correta":1,"comentario":"ABORDAGEM DO USO DE SUBSTÂNCIAS NA ADOLESCÊNCIA: (1) RASTREAMENTO: CRAFFT (Car, Relax, Alone, Forget, Friends, Trouble) — triagem validada para adolescentes; AUDIT-C (álcool); perguntas abertas sem julgamento em ambiente de sigilo; (2) ENTREVISTA MOTIVACIONAL: abordagem centrada no adolescente, sem confrontação, explorando ambivalência (eficácia comprovada); (3) ORIENTAÇÃO sobre riscos: o cérebro ainda em desenvolvimento é mais vulnerável aos efeitos neurotóxicos — risco 4-7x maior de dependência quando início < 14 anos; riscos de acidentes, violências, DST; (4) SIGILO: manter, exceto risco grave; (5) ENCAMINHAMENTOS: uso abusivo → CAPS-AD (Centro de Atenção Psicossocial Álcool e Drogas); dependência → tratamento especializado. Abordagem PROIBICIONISTA e MORALISTA é INEFICAZ e afasta o adolescente do serviço de saúde."},{"enunciado":"Sobre a saúde sexual e reprodutiva do adolescente, qual afirmação está CORRETA?","alternativas":["A) O enfermeiro não deve abordar sexualidade na consulta do adolescente — é assunto privado","B) O enfermeiro deve abordar sexualidade de forma acolhedora e sem julgamentos; orientar sobre méto
